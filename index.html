// Faixa de códigos de turno (aparece só com a ferramenta Código)
function schedCodeStripHtml(){
  const chip = (c) => `<button class="gen-code-chip ${c.charAt(0) === 'A' ? 'a' : 'b'} ${schedEdit.code === c ? 'on' : ''}" data-edcode="${c}">${c}<small>${SHIFT_TIMES[c] || '&nbsp;'}</small></button>`;
  let h = `<button class="gen-code-chip clr ${schedEdit.code === '' ? 'on' : ''}" data-edcode="">Tirar<small>&nbsp;</small></button><span class="gen-code-sep"></span>`;
  SHIFT_CODES.forEach((c, i) => {
    if(i > 0 && c.charAt(0) !== SHIFT_CODES[i - 1].charAt(0)) h += '<span class="gen-code-sep"></span>';
    h += chip(c);
  });
  return h;
}
function schedEditSyncStrip(){
  const f = document.getElementById('genFull'), strip = document.getElementById('genCodeStrip');
  if(!f || !strip) return;
  const on = schedEdit.active && schedEdit.tool === 'code';
  f.classList.toggle('coding', on);
  if(on){
    const keep = strip.scrollLeft;
    strip.innerHTML = schedCodeStripHtml();
    strip.scrollLeft = keep;
  }
}
function schedEditBuild(){
  const t = schedBuildTable(schedEdit.y, schedEdit.m);
  if(t) t.cfg.rules.offs = MIN_OFF_DAYS_PER_MONTH; // quem está abaixo do mínimo fica com o total em vermelho
  return t;
}
function schedOpenEdit(){
  const y = calYear, m = calMonth;
  schedEdit.y = y; schedEdit.m = m; schedEdit.tool = 'off'; schedEdit.undo = []; schedEdit.code = null;
  const t = schedEditBuild();
  if(!t) return;
  schedEdit.active = true;
  const f = document.getElementById('genFull');
  f.classList.add('editing');
  openFullOverlay(`${capFirst(MONTHS[m])} ${y}`, schedEditToolbarHtml(),
    `<div class="gen-table-wrap noanim">${genTableHtml(t.cfg, t.sol)}</div>${schedEditLegendHtml()}`);
  schedEditSyncStrip();
  genEditMsg('Modo edição: toque num dia para marcar ou tirar a folga.', true);
}
function schedEditRefresh(flash){
  const t = schedEditBuild();
  const host = document.getElementById('genFullHost');
  if(!t || !host) return;
  const w = host.querySelector('.gen-table-wrap');
  const keep = { w: w ? w.scrollLeft : 0, t: host.scrollTop, l: host.scrollLeft };
  host.innerHTML = `<div class="gen-table-wrap noanim">${genTableHtml(t.cfg, t.sol)}</div>${schedEditLegendHtml()}`;
  const w2 = host.querySelector('.gen-table-wrap');
  if(w2) w2.scrollLeft = keep.w;
  host.scrollTop = keep.t; host.scrollLeft = keep.l;
  if(flash){
    const pi = t.cfg.people.findIndex(P => P.id === flash.pid);
    const td = host.querySelector(`td.c[data-p="${pi}"][data-d="${flash.d}"]`);
    if(td){ td.classList.add('ed-flash'); }
  }
  const tabs = document.getElementById('genFullTabs');
  if(tabs){
    tabs.querySelectorAll('[data-edtool]').forEach(b => b.classList.toggle('on', b.dataset.edtool === schedEdit.tool));
    const u = document.getElementById('schedUndoBtn');
    if(u) u.disabled = !schedEdit.undo.length;
  }
}
function schedEditCellClick(e){
  const td = e.target.closest('td.c[data-p]');
  if(!td) return;
  const t = schedEditBuild();
  if(!t) return;
  const pi = parseInt(td.dataset.p, 10), d = parseInt(td.dataset.d, 10);
  const P = t.cfg.people[pi];
  if(!P) return;
  const y = schedEdit.y, m = schedEdit.m;
  const pid = P.id, ds = iso(y, m, d + 1), dlabel = formatDateBR(ds);
  const person = state.people.find(x => x.id === pid);
  const nm = person ? person.name : 'Pessoa';
  const wasOff = isOff(pid, ds);
  const wasReq = wasOff && isRequestedOff(pid, ds);
  const cnt = offDaysCountInMonth(pid, y, m);
  const rec = { pid, ds, off: wasOff, req: wasReq, code: getShiftCode(pid, ds) };

  if(schedEdit.tool === 'code'){
    if(schedEdit.code === null){ genEditMsg('Escolha um código na faixa de cima e depois toque no dia.'); return; }
    if(wasOff){ genEditMsg(`${nm} está de folga em ${dlabel}. Tire a folga antes de colocar um código.`); return; }
    const cur = getShiftCode(pid, ds);
    const want = schedEdit.code === '' ? null : (cur === schedEdit.code ? null : schedEdit.code);
    if(want === cur){ genEditMsg(`${nm} já está sem código em ${dlabel}.`); return; }
    schedEdit.undo.push({ kind: 'code', pid, ds, prev: cur });
    setShiftCode(pid, ds, want);
    genEditMsg(want ? `Código ${want}${SHIFT_TIMES[want] ? ' (' + SHIFT_TIMES[want] + ')' : ''} · ${nm} · ${dlabel}` : `Código removido · ${nm} · ${dlabel}`, true);
    schedEditRefresh({ pid, d });
    return;
  }

  const checkAdd = () => {
    if(cnt >= MAX_OFF_DAYS_PER_MONTH){ genEditMsg(`${nm} já tem ${MAX_OFF_DAYS_PER_MONTH} folgas no mês (máximo). Tire outra antes de adicionar.`); return false; }
    const clash = coverageConflictsFor(pid, ds);
    if(clash.length){
      genEditMsg(`Não pode: ${joinNamesPT(clash)} já ${clash.length > 1 ? 'estão' : 'está'} de folga em ${dlabel} (restrição de folga).`);
      return false;
    }
    // aviso: a folga deixa a Limpeza abaixo do mínimo do dia? Pergunta antes de confirmar.
    const a = dayAvailability(ds, pid);
    const isClean = person && genGroupOf(person) === 'limpeza';
    if(isClean && a.clean < GEN_CLEAN_MIN){
      if(!confirm(`Com a folga de ${nm} em ${dlabel}, ficam só ${a.clean} da Limpeza disponíveis (o mínimo é ${GEN_CLEAN_MIN}). Marcar mesmo assim?`)) return false;
    }
    return true;
  };

  if(schedEdit.tool === 'req'){
    if(wasOff){
      schedEdit.undo.push(rec);
      if(wasReq){ unmarkRequestedOff(pid, ds); genEditMsg(`Marcação de desejada removida · ${nm} · ${dlabel}`, true); }
      else { markRequestedOff(pid, ds); genEditMsg(`Folga desejada marcada · ${nm} · ${dlabel}`, true); }
    }else{
      if(!checkAdd()) return;
      schedEdit.undo.push(rec);
      toggleOffDay(pid, ds);
      markRequestedOff(pid, ds);
      genEditMsg(`Folga desejada criada · ${nm} · ${dlabel} · ${availText(dayAvailability(ds))}`, true);
    }
    schedEditRefresh({ pid, d });
    return;
  }

  // ferramenta "Folga": toque alterna marcar / tirar
  if(wasOff){
    const minOffs = minOffsFor(pid, y, m);
    if(cnt <= minOffs){ genEditMsg(`${nm} fica com o mínimo de ${minOffs} folgas no mês. Não dá para tirar mais uma.`); return; }
    if(wasReq && !confirm(`Remover a folga desejada de ${dlabel}?`)) return;
    schedEdit.undo.push(rec);
    toggleOffDay(pid, ds);
    genEditMsg(`Folga removida · ${nm} · ${dlabel}`, true);
    schedEditRefresh({ pid, d });
    // o dia virou dia de trabalho: confere o limite de dias seguidos (pode desfazer)
    warnIfConsecutiveViolation(pid, ds, () => {
      schedEdit.undo.pop();
      toggleOffDay(pid, ds);
      if(wasReq) markRequestedOff(pid, ds);
      schedEditRefresh({ pid, d });
    });
  }else{
    if(!checkAdd()) return;
    schedEdit.undo.push(rec);
    toggleOffDay(pid, ds);
    genEditMsg(`Folga marcada · ${nm} · ${dlabel} · ${availText(dayAvailability(ds))}`, true);
    schedEditRefresh({ pid, d });
  }
}
function schedEditUndo(){
  const r = schedEdit.undo.pop();
  if(!r) return;
  if(r.kind === 'code'){
    setShiftCode(r.pid, r.ds, r.prev || null);
    const pp = state.people.find(x => x.id === r.pid);
    genEditMsg(`Desfeito · ${pp ? pp.name : ''} · ${formatDateBR(r.ds)}`, true);
    schedEditRefresh({ pid: r.pid, d: parseInt(r.ds.slice(8, 10), 10) - 1 });
    return;
  }
  if(!state.offDays[r.pid]) state.offDays[r.pid] = [];
  const arr = state.offDays[r.pid];
  const i = arr.indexOf(r.ds);
  if(r.off && i < 0) arr.push(r.ds);
  if(!r.off && i >= 0) arr.splice(i, 1);
  if(r.req) markRequestedOff(r.pid, r.ds); else unmarkRequestedOff(r.pid, r.ds);
  if(!r.off && r.code) setShiftCode(r.pid, r.ds, r.code);
  saveState();
  const person = state.people.find(x => x.id === r.pid);
  genEditMsg(`Desfeito · ${person ? person.name : ''} · ${formatDateBR(r.ds)}`, true);
  schedEditRefresh({ pid: r.pid, d: parseInt(r.ds.slice(8, 10), 10) - 1 });
}

// ---- acrescentar pessoa à escala já feita ----
function genMonthHasSchedule(year, month){
  return state.people.some(p => offDaysCountInMonth(p.id, year, month) > 0);
}
function genAppendCandidates(){
  return sortPeople(state.people.filter(p => offDaysCountInMonth(p.id, gen.year, gen.month) === 0));
}
function genAppendExisting(){
  return sortPeople(state.people.filter(p => offDaysCountInMonth(p.id, gen.year, gen.month) > 0));
}
function genAppendStartDefault(){
  const t = new Date();
  return (t.getFullYear() === gen.year && t.getMonth() === gen.month) ? t.getDate() : 1;
}
function genAppendPeak(){
  const { D } = genDayInfo(gen.year, gen.month);
  const prefix = monthKey(gen.year, gen.month) + '-';
  const load = new Array(D).fill(0);
  genAppendExisting().forEach(p => (state.offDays[p.id] || []).forEach(ds => {
    if(ds.startsWith(prefix)){ const d = parseInt(ds.slice(8, 10), 10); if(d >= 1 && d <= D) load[d - 1]++; }
  }));
  return Math.max(1, ...load);
}
function genAppendOffsVal(){
  if(gen.appendOffs != null) return gen.appendOffs;
  const { D } = genDayInfo(gen.year, gen.month);
  const ex = genAppendExisting();
  const total = ex.reduce((s, p) => s + offDaysCountInMonth(p.id, gen.year, gen.month), 0);
  const avg = ex.length ? total / ex.length : 8;
  const rem = D - (gen.appendStart - 1);
  return genClamp(Math.round(avg * rem / D), 1, 9); // proporcional aos dias que faltam
}
function genAppendMVal(){
  const peak = genAppendPeak();
  return gen.appendM != null ? Math.max(gen.appendM, peak) : peak + 1; // sugestão: um a mais que o dia mais cheio de hoje
}
function genBuildAppendConfig(){
  const { D, dows } = genDayInfo(gen.year, gen.month);
  const prefix = monthKey(gen.year, gen.month) + '-';
  const startIdx = genClamp(gen.appendStart, 1, D) - 1;
  const newList = sortPeople(state.people.filter(p => gen.appendSel.has(p.id)));
  const oldList = genAppendExisting().filter(p => !gen.appendSel.has(p.id));
  const dayList = (arr) => (arr || []).filter(ds => ds.startsWith(prefix)).map(ds => parseInt(ds.slice(8, 10), 10)).filter(d => d >= 1 && d <= D);
  const offsVal = genAppendOffsVal();
  const mkNew = p => {
    const none = new Array(D).fill(false);
    return { id: p.id, name: p.name, forced: none.slice(), fixedMask: none.slice(), reqMask: none.slice(), forcedCount: 0, forcedSundays: 0,
      sunRule: true, faMode: genIsNoFaPerson(p) ? 'free' : 'must', carryWork: 0, carrySun: 0, K: offsVal, isNew: true, startDay: startIdx };
  };
  const mkOld = p => {
    const forced = new Array(D).fill(false), req = new Array(D).fill(false);
    dayList(state.offDays[p.id]).forEach(d => { forced[d - 1] = true; });
    dayList((state.requestedOffDays || {})[p.id]).forEach(d => { req[d - 1] = true; });
    let n = 0, sun = 0;
    forced.forEach((v, d) => { if(v){ n++; if(dows[d] === 0) sun++; } });
    return { id: p.id, name: p.name, forced, fixedMask: new Array(D).fill(false), reqMask: req, forcedCount: n, forcedSundays: sun,
      sunRule: true, faMode: 'must', carryWork: 0, carrySun: 0, K: n, frozen: true };
  };
  const ordered = newList.concat(oldList);
  const people = newList.map(mkNew).concat(oldList.map(mkOld));
  const ids = ordered.map(p => p.id);
  const groups = genActiveGroups(ids).map(g => g.map(id => ids.indexOf(id)));
  const cleanIdx = ordered.map((p, i) => genGroupOf(p) === 'limpeza' ? i : -1).filter(i => i >= 0);
  return {
    year: gen.year, month: gen.month, D, dows, people, groups, cleanIdx,
    W: GEN_MAX_WORK, SW: gen.rules.maxSun, M: genAppendMVal(),
    rules: { offs: offsVal }, maxOffs: MAX_OFF_DAYS_PER_MONTH, append: true
  };
}

function genAppendStep0(){
  const cands = genAppendCandidates();
  const { D } = genDayInfo(gen.year, gen.month);
  let html = `<p class="gen-lead">Quem <b>entrou</b> depois que a escala de <b>${capFirst(genMonthName())}</b> foi feita? As folgas de quem já está na escala <b>não serão alteradas</b>.</p>`;
  html += `<div class="gen-pills">${cands.map(p => `<button class="gen-pill ${gen.appendSel.has(p.id) ? 'on' : ''}" data-act="appendToggle" data-pid="${p.id}"><span class="gen-check">✓</span>${genEsc(p.name)}</button>`).join('')}</div>`;
  let opts = '';
  for(let d = 1; d <= D; d++){
    const w = DOW[new Date(gen.year, gen.month, d).getDay()];
    opts += `<option value="${d}" ${d === gen.appendStart ? 'selected' : ''}>${d} de ${genMonthName()} (${w})</option>`;
  }
  html += `<div class="gen-sec-title">Primeiro dia na escala</div>
    <div class="gen-month-row"><select class="gen-select" id="genAppendStart">${opts}</select></div>
    <p class="mini-hint">As folgas dela(e) só entram a partir desse dia.</p>`;
  return html;
}

function genAppendStep1(){
  const { D } = genDayInfo(gen.year, gen.month);
  const rem = D - (gen.appendStart - 1);
  const peak = genAppendPeak();
  const stepper = (key, val) => `<div class="gen-stepper">
      <button data-act="step" data-key="${key}" data-d="-1">−</button><span class="val">${val}</span><button data-act="step" data-key="${key}" data-d="1">+</button>
    </div>`;
  return `<p class="gen-lead">As folgas de todo mundo que já está na escala ficam <b>exatamente como estão</b>. Só a pessoa nova é encaixada, respeitando as mesmas regras (dias seguidos, FA, domingo, restrições).</p>
    <div class="gen-rule">
      <div class="rtext"><div class="rtitle">Folgas até o fim do mês</div><div class="rhint">Restam ${rem} dia${rem > 1 ? 's' : ''}. Sugestão proporcional aos dias que faltam; quem entra no meio do mês não precisa chegar a ${MIN_OFF_DAYS_PER_MONTH} folgas.</div></div>
      ${stepper('appendOffs', genAppendOffsVal())}
    </div>
    <div class="gen-rule">
      <div class="rtext"><div class="rtitle">Máx. pessoas de folga no mesmo dia</div><div class="rhint">Hoje o dia mais cheio tem ${peak}. Mínimo: ${peak}.</div></div>
      ${stepper('appendM', genAppendMVal())}
    </div>`;
}

// ---- gerar / aplicar ----
async function genGenerate(animate){
  if(!gen) return;
  const token = ++gen.runToken;
  gen.result = null;
  genRender(!!animate);
  await genTick();
  await new Promise(r => setTimeout(r, 450)); // deixa a animação de carregamento respirar
  if(!gen || token !== gen.runToken) return;
  let result;
  try{
    const append = gen.mode === 'append';
    const cfg = append ? genBuildAppendConfig() : genBuildConfig();
    const problems = append ? genPrecheckAppend(cfg) : genPrecheckFast(cfg).concat(genPrecheckDeep(cfg));
    if(problems.length){
      result = { cfg, options: [], active: 0, error: { problems } };
    }else{
      const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
      let run = await genRun(cfg, seed, { want: 3 });
      if(!gen || token !== gen.runToken) return;
      let usedCfg = cfg;
      if(!run.options.length && cfg.groups && cfg.groups.length){
        // Não dá para cumprir todas as restrições de "não folgar junto": gera assim mesmo,
        // com o mínimo de dias juntos, e a tela avisa quais restrições ficaram incompletas.
        genSetLoadingSub('Encaixando as restrições da melhor forma…');
        const soft = Object.assign({}, cfg, { softGroups: true });
        const run2 = await genRun(soft, seed + 13, { want: 3 });
        if(!gen || token !== gen.runToken) return;
        if(run2.options.length){ run = run2; usedCfg = soft; }
      }
      if(run.options.length){
        result = { cfg: usedCfg, options: run.options, active: 0, error: null };
      }else{
        genSetLoadingSub('Analisando o que está impedindo…');
        const items = await genDiagnoseRun(cfg, run.bestBad, seed);
        if(!gen || token !== gen.runToken) return;
        result = { cfg, options: [], active: 0, error: { problems: items } };
      }
    }
  }catch(err){
    console.error('Falha ao gerar escala:', err);
    if(gen){ showToast('Não consegui gerar a escala. Confira as opções e tente de novo.'); genGo(genRulesStep(), -1); }
    return;
  }
  if(!gen || token !== gen.runToken) return;
  gen.result = result;
  genRender(false);
  document.getElementById('genBody').scrollTop = 0;
}

function genApply(){
  if(!gen || !gen.result || !gen.result.options.length) return;
  const cfg = gen.result.cfg;
  const sol = gen.result.options[gen.result.active];
  const { year, month } = cfg;
  const key = monthKey(year, month);
  const prefix = key + '-';
  const hasExisting = cfg.people.some(P => !P.frozen && (state.offDays[P.id] || []).some(ds => ds.startsWith(prefix)));
  if(hasExisting && !confirm(`Isso vai substituir as folgas atuais das pessoas selecionadas em ${MONTHS[month]} de ${year}. Continuar?`)) return;

  if(!state.publishedMonths) state.publishedMonths = [];
  if(!state.publishedMonths.includes(key)) state.publishedMonths.push(key);
  if(!state.monthRosters) state.monthRosters = {};
  if(!state.monthRosters[key]) state.monthRosters[key] = [];
  if(!state.requestedOffDays) state.requestedOffDays = {};
  if(!state.faMonths) state.faMonths = {};
  const selectedIds = cfg.people.filter(P => !P.frozen).map(P => P.id);
  const faIds = cfg.people.filter((P, i) => !P.frozen && genFaFirstDays(sol.offs[i], cfg.dows).length > 0).map(P => P.id);
  state.faMonths[key] = (state.faMonths[key] || []).filter(id => !selectedIds.includes(id)).concat(faIds);
  if(!state.midMonthJoiners) state.midMonthJoiners = {};
  {
    const joiners = (state.midMonthJoiners[key] || []).filter(id => !selectedIds.includes(id));
    if(cfg.append) cfg.people.forEach(P => { if(P.isNew && !P.frozen) joiners.push(P.id); });
    if(joiners.length) state.midMonthJoiners[key] = joiners; else delete state.midMonthJoiners[key];
  }

  cfg.people.forEach((P, i) => {
    if(P.frozen) return; // quem já estava na escala fica exatamente como está
    const keepOther = (state.offDays[P.id] || []).filter(ds => !ds.startsWith(prefix));
    const newDays = [];
    sol.offs[i].forEach((isOffDay, d) => { if(isOffDay) newDays.push(iso(year, month, d + 1)); });
    state.offDays[P.id] = keepOther.concat(newDays);

    const reqKeep = (state.requestedOffDays[P.id] || []).filter(ds => !ds.startsWith(prefix));
    const reqNew = (gen.requests[P.id] ? [...gen.requests[P.id]] : [])
      .filter(day => day >= 1 && day <= cfg.D && sol.offs[i][day - 1])
      .map(day => iso(year, month, day));
    const reqAll = reqKeep.concat(reqNew);
    if(reqAll.length) state.requestedOffDays[P.id] = reqAll; else delete state.requestedOffDays[P.id];

    if(!state.monthRosters[key].includes(P.id)) state.monthRosters[key].push(P.id);
  });

  saveState();
  calYear = year; calMonth = month;
  saveUiState();
  render();
  gen.applied = true;
  genClearDraft();
  requestCloseOverlay('genOverlay');
  showToast(cfg.append ? 'Pessoa acrescentada à escala ✓' : 'Escala gerada e aplicada ✓');
}

function genResultStep(){ return gen && gen.mode === 'append' ? 2 : GEN_STEP_RESULT; }
function genRulesStep(){ return gen && gen.mode === 'append' ? 1 : GEN_STEP_RULES; }
function genGo(step, dir){
  if(!gen) return;
  gen.dir = dir;
  gen.step = step;
  gen.runToken++;
  genSaveDraft();
  if(step === genResultStep()){ genGenerate(true); return; }
  genRender(true);
}

// ---- eventos (delegação: ligados uma vez só) ----
(function genWireEvents(){
  const body = document.getElementById('genBody');
  const foot = document.getElementById('genFoot');

  document.getElementById('genCloseBtn').addEventListener('click', ()=>{
    requestCloseOverlay('genOverlay');
  });

  foot.addEventListener('click', (e)=>{
    if(!gen) return;
    const btn = e.target.closest('[data-nav]');
    if(!btn || btn.disabled) return;
    switch(btn.dataset.nav){
      case 'close':    requestCloseOverlay('genOverlay'); break;
      case 'resume':
        genRestoreDraft(gen.resumePrompt);
        gen.resumePrompt = null;
        gen.dir = 1;
        genRender(true);
        break;
      case 'fresh':
        genClearDraft();
        gen.resumePrompt = null;
        gen.dir = 1;
        genRender(true);
        break;
      case 'next':     genGo(gen.step + 1, 1); break;

(function genWireFull(){
  const f = document.getElementById('genFull');
  document.getElementById('genFullClose').addEventListener('click', () => requestCloseOverlay('genFull'));
  document.getElementById('genRotBtn').addEventListener('click', () => {
    genFullAuto = f.classList.toggle('force-land');
    genFullLayout();
  });
  document.getElementById('genFullHost').addEventListener('click', genCellClick);

  // Tela expandida / edição: a tabela só rola para os lados OU para cima/baixo, nunca na diagonal.
  // O primeiro movimento do dedo decide o eixo e ele fica travado até soltar. Mantém a inércia ao soltar.
  (function wireFullAxisLock(){
    const host = document.getElementById('genFullHost');
    const full = document.getElementById('genFull');
    let tracking = false, axis = null, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, vel = 0, raf = 0, suppressUntil = 0;
    // em force-land a tela está girada 90°: troca os eixos do dedo pelos eixos da tabela
    const toContent = (dx, dy) => full.classList.contains('force-land')
      ? (full.classList.contains('ccw') ? { x: -dy, y: dx } : { x: dy, y: -dx })
      : { x: dx, y: dy };
    const stopInertia = () => { if(raf){ cancelAnimationFrame(raf); raf = 0; } };
    const scrollBy = (a, amount) => { if(a === 'x') host.scrollLeft -= amount; else host.scrollTop -= amount; };

    host.addEventListener('touchstart', (e) => {
      stopInertia();
      if(e.touches.length !== 1){ tracking = false; return; }
      tracking = true; axis = null; vel = 0;
      sx = lx = e.touches[0].clientX; sy = ly = e.touches[0].clientY; lt = e.timeStamp;
    }, { passive: true });

    host.addEventListener('touchmove', (e) => {
      if(!tracking) return;
      if(e.touches.length !== 1){ tracking = false; return; }
      e.preventDefault();
      const t = e.touches[0];
      if(!axis){
        const tot = toContent(t.clientX - sx, t.clientY - sy);
        if(Math.max(Math.abs(tot.x), Math.abs(tot.y)) < 6) return; // ainda não decidiu
        axis = Math.abs(tot.x) > Math.abs(tot.y) ? 'x' : 'y';
        lx = sx; ly = sy; // conta o deslocamento desde o início do gesto
      }
      const d = toContent(t.clientX - lx, t.clientY - ly);
      const amount = axis === 'x' ? d.x : d.y;
      scrollBy(axis, amount);
      const dt = Math.max(1, e.timeStamp - lt);
      vel = 0.8 * vel + 0.2 * (amount / dt); // px por ms (suavizado)
      lx = t.clientX; ly = t.clientY; lt = e.timeStamp;
      suppressUntil = Date.now() + 350; // depois de arrastar, o toque não conta como clique numa célula
    }, { passive: false });

    const end = () => {
      if(!tracking) return;
      tracking = false;
      const a = axis;
      if(!a || Math.abs(vel) < 0.05) return;
      let last = performance.now();
      const step = (now) => {
        const dt = now - last; last = now;
        scrollBy(a, vel * dt);
        vel *= Math.pow(0.995, dt); // atrito
        if(Math.abs(vel) > 0.02) raf = requestAnimationFrame(step); else raf = 0;
      };
      raf = requestAnimationFrame(step);
    };
    host.addEventListener('touchend', end, { passive: true });
    host.addEventListener('touchcancel', end, { passive: true });

    host.addEventListener('click', (e) => {
      if(Date.now() < suppressUntil){ e.stopPropagation(); e.preventDefault(); }
    }, true);
  })();
  (function wireCodeStrip(){
    const strip = document.getElementById('genCodeStrip');
    const full = document.getElementById('genFull');
    let tracking = false, lx = 0, ly = 0, sx = 0, sy = 0, suppressUntil = 0;
    // no modo girado, o eixo horizontal da faixa é o vertical (ou o inverso) do dedo
    const toX = (dx, dy) => full.classList.contains('force-land') ? (full.classList.contains('ccw') ? -dy : dy) : dx;
    strip.addEventListener('touchstart', (e) => {
      tracking = e.touches.length === 1;
      if(tracking){ sx = lx = e.touches[0].clientX; sy = ly = e.touches[0].clientY; }
    }, { passive: true });
    strip.addEventListener('touchmove', (e) => {
      if(!tracking) return;
      e.preventDefault();
      const t = e.touches[0];
      strip.scrollLeft -= toX(t.clientX - lx, t.clientY - ly);
      lx = t.clientX; ly = t.clientY;
      if(Math.abs(t.clientX - sx) + Math.abs(t.clientY - sy) > 8) suppressUntil = Date.now() + 300;
    }, { passive: false });
    strip.addEventListener('touchend', () => { tracking = false; }, { passive: true });
    strip.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
    strip.addEventListener('click', (e) => {
      if(Date.now() < suppressUntil){ e.stopPropagation(); e.preventDefault(); return; }
      const b = e.target.closest('[data-edcode]');
      if(!b || !schedEdit.active) return;
      schedEdit.code = b.dataset.edcode;
      genEditMsg('');
      schedEditSyncStrip();
    });
  })();
  document.getElementById('genFullTabs').addEventListener('click', (e) => {
    if(!schedEdit.active) return;
    const tool = e.target.closest('[data-edtool]');
    if(tool){ schedEdit.tool = tool.dataset.edtool; genEditMsg(''); schedEditSyncStrip(); schedEditRefresh(); return; }
    if(e.target.closest('[data-edundo]')) schedEditUndo();
  });
  f.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act="optPick"]');
    if(b) genShowOption(parseInt(b.dataset.i, 10));
  });
  window.addEventListener('resize', () => {
    if(!f.classList.contains('open')) return;
    const portrait = window.innerHeight > window.innerWidth;
    if(!portrait){ f.classList.remove('force-land', 'ccw'); } // girou o aparelho: já está na horizontal de verdade
    else if(genFullAuto) f.classList.add('force-land');      // voltou para em pé: deita a escala de novo
    genFullLayout();
  });
})();

// ---------- Exportar a escala do mês em Excel (.xlsx) ----------
// Gerador próprio de .xlsx (zip sem compressão + XML), sem biblioteca externa, funciona offline.
// Segue o layout da "Escala de Revezamento": cabeçalho, dias da semana, F / FA e códigos de turno.
const XLSX_CRC = (()=>{
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function xlsxCrc32(b){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < b.length; i++) c = XLSX_CRC[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function xlsxZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = xlsxCrc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 33, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 33, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  const all = [...parts, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
  let o = 0;
  all.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}
function xlsxEsc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function xlsxCol(n){ // 0-based -> A, B, ... AA
  let s = '';
  n++;
  while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function XlsxStyles(){
  this.fonts = ['<font><sz val="9"/><color rgb="FF000000"/><name val="Calibri"/></font>'];
  this.fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
  this.borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
  this.xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
  this.map = {};
}
XlsxStyles.prototype.get = function(o){
  const key = JSON.stringify(o);
  if(this.map[key] != null) return this.map[key];
  const idx = (arr, x) => { let i = arr.indexOf(x); if(i < 0){ arr.push(x); i = arr.length - 1; } return i; };
  const font = `<font>${o.b ? '<b/>' : ''}${o.i ? '<i/>' : ''}<sz val="${o.sz || 9}"/><color rgb="FF${o.color || '000000'}"/><name val="Calibri"/></font>`;
  const fill = o.fill ? `<fill><patternFill patternType="solid"><fgColor rgb="FF${o.fill}"/><bgColor indexed="64"/></patternFill></fill>` : null;
  const side = n => o.bd ? `<${n} style="thin"><color rgb="FF${o.bd}"/></${n}>` : `<${n}/>`;
  const border = `<border>${side('left')}${side('right')}${side('top')}${side('bottom')}<diagonal/></border>`;
  const fid = idx(this.fonts, font), flid = fill ? idx(this.fills, fill) : 0, bid = idx(this.borders, border);
  const al = `<alignment${o.h ? ` horizontal="${o.h}"` : ''} vertical="${o.v || 'center'}"${o.rot ? ` textRotation="${o.rot}"` : ''}${o.wrap ? ' wrapText="1"' : ''}/>`;
  this.xfs.push(`<xf numFmtId="${o.nf || 0}" fontId="${fid}" fillId="${flid}" borderId="${bid}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${al}</xf>`);
  this.map[key] = this.xfs.length - 1;
  return this.map[key];
};
XlsxStyles.prototype.xml = function(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="00"/></numFmts>' +
    `<fonts count="${this.fonts.length}">${this.fonts.join('')}</fonts>` +
    `<fills count="${this.fills.length}">${this.fills.join('')}</fills>` +
    `<borders count="${this.borders.length}">${this.borders.join('')}</borders>` +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    `<cellXfs count="${this.xfs.length}">${this.xfs.join('')}</cellXfs>` +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';
};

function XlsxSheet(){ this.cells = {}; this.merges = []; this.heights = {}; this.widths = []; this.freeze = null; }
XlsxSheet.prototype.put = function(r, c, v, s){ this.cells[r + ',' + c] = { r, c, v, s }; };
XlsxSheet.prototype.xml = function(){
  const rows = {};
  Object.values(this.cells).forEach(x => { (rows[x.r] = rows[x.r] || []).push(x); });
  const rowNums = Object.keys(rows).map(Number).sort((a, b) => a - b);
  let sd = '';
  rowNums.forEach(r => {
    const ht = this.heights[r] ? ` ht="${this.heights[r]}" customHeight="1"` : '';
    sd += `<row r="${r + 1}"${ht}>`;
    rows[r].sort((a, b) => a.c - b.c).forEach(x => {
      const ref = xlsxCol(x.c) + (r + 1);
      if(x.v == null || x.v === '') sd += `<c r="${ref}" s="${x.s}"/>`;
      else if(typeof x.v === 'object' && x.v.f) sd += `<c r="${ref}" s="${x.s}"><f>${xlsxEsc(x.v.f)}</f><v>${x.v.v}</v></c>`;
      else if(typeof x.v === 'number') sd += `<c r="${ref}" s="${x.s}"><v>${x.v}</v></c>`;
      else sd += `<c r="${ref}" s="${x.s}" t="inlineStr"><is><t xml:space="preserve">${xlsxEsc(x.v)}</t></is></c>`;
    });
    sd += '</row>';
  });
  const cols = this.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  const pane = this.freeze
    ? `<pane xSplit="${this.freeze.c}" ySplit="${this.freeze.r}" topLeftCell="${xlsxCol(this.freeze.c)}${this.freeze.r + 1}" activePane="bottomRight" state="frozen"/><selection pane="bottomRight"/>`
    : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
    `<sheetViews><sheetView showGridLines="0" workbookViewId="0">${pane}</sheetView></sheetViews>` +
    '<sheetFormatPr defaultRowHeight="15"/>' +
    `<cols>${cols}</cols><sheetData>${sd}</sheetData>` +
    (this.merges.length ? `<mergeCells count="${this.merges.length}">${this.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '') +
    '<pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/>' +
    '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
    '</worksheet>';
};

function buildEscalaXlsx(year, month){
  const roster = sortPeople(rosterPeopleFor(year, month));
  if(!roster.length) return null;
  const D = new Date(year, month + 1, 0).getDate();
  const dows = [];
  for(let d = 1; d <= D; d++) dows.push(new Date(year, month, d).getDay());

  const groups = [];
  [...GEN_GROUP_ORDER, 'none'].forEach(gid => {
    const list = roster.filter(p => genGroupOf(p) === gid);
    if(list.length) groups.push({ gid, fn: fnById(gid), list });
  });

  const info = {};
  roster.forEach(p => {
    const offs = [], codes = [];
    for(let d = 1; d <= D; d++){
      const ds = iso(year, month, d);
      const off = isOff(p.id, ds);
      offs.push(off);
      codes.push(off ? null : getShiftCode(p.id, ds));
    }
    info[p.id] = { offs, codes, faSet: new Set(genFaLabelDays(offs, dows)), total: offs.filter(Boolean).length };
  });

  const CARGO = { lider: 'AUXILIAR LÍDER DE RAMPA', operador: 'OPERADOR DE EQUIPAMENTOS' };
  const DOWX = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
  const TEAL = '00A99D', GREEN = '0B5D4A', GREY = 'A6A6A6', PURPLE = 'B4A7D6', BD = 'BFBFBF';
  const st = new XlsxStyles(), sh = new XlsxSheet();

  const c0 = 8;                       // primeira coluna de dia (A..H são fixas)
  const cF = c0 + D, cH = cF + 1, cT = cF + 2;   // folgas, horas trab., horário
  const lastCol = cT;
  const rng = (r1, c1, r2, c2, s) => { for(let r = r1; r <= r2; r++) for(let c = c1; c <= c2; c++) sh.put(r, c, null, s); };
  const mg = (r1, c1, r2, c2, v, s) => {
    rng(r1, c1, r2, c2, s);
    sh.put(r1, c1, v, s);
    if(r1 !== r2 || c1 !== c2) sh.merges.push(`${xlsxCol(c1)}${r1 + 1}:${xlsxCol(c2)}${r2 + 1}`);
  };

  // larguras e alturas
  sh.widths = [10, 34, 27, 6, 7, 7, 8, 6];
  for(let d = 0; d < D; d++) sh.widths.push(3.8);
  sh.widths.push(6.5, 8.5, 17);
  sh.heights[0] = 30; sh.heights[1] = 18; sh.heights[2] = 6; sh.heights[3] = 14; sh.heights[4] = 34; sh.heights[5] = 16;

  // ---- cabeçalho (logo, título, base / setor / turno / mês) ----
  mg(0, 0, 0, 2, 'dnata', st.get({ b: 1, i: 1, sz: 22, color: TEAL, h: 'left' }));
  mg(1, 0, 1, 2, String(year), st.get({ b: 1, sz: 10, color: 'FFFFFF', fill: GREEN, h: 'right' }));
  const bc0 = c0 + D - 16;            // as 4 caixinhas ocupam as 16 últimas colunas de dia
  mg(0, 3, 0, bc0 - 1, 'ENDEREÇO: PRAÇA SANTOS DUMONT /100 -BOA VISTA', st.get({ b: 1, sz: 8, color: '1F6FB5', h: 'center' }));
  mg(1, 3, 1, bc0 - 1, 'ESCALA DE REVEZAMENTO', st.get({ b: 1, sz: 14, color: '1F6FB5', h: 'center' }));
  const boxes = [['BASE', 'BVB'], ['SETOR', 'RAMPA'], ['TURNO', 'GERAL'], ['MÊS', MONTHS[month].toUpperCase()]];
  boxes.forEach((b, i) => {
    const a = bc0 + i * 4, z = a + 3;
    mg(0, a, 0, z, b[0], st.get({ b: 1, sz: 7, color: 'FFFFFF', fill: '808080', h: 'center', bd: 'FFFFFF' }));
    const last = i === 3;
    mg(1, a, 1, z, b[1], st.get({ b: 1, sz: 9, color: last ? 'FFFFFF' : '000000', fill: last ? GREEN : 'F2F2F2', h: 'center', bd: 'FFFFFF' }));
  });

  // ---- faixa "dias da semana" + cabeçalho das colunas ----
  rng(3, 0, 3, lastCol, st.get({ fill: GREY }));
  mg(3, c0, 3, c0 + D - 1, 'DIAS DA SEMANA', st.get({ b: 1, sz: 7, color: 'FFFFFF', fill: GREY, h: 'center' }));
  const hdr = st.get({ b: 1, sz: 8, color: 'FFFFFF', fill: TEAL, h: 'center', wrap: 1, bd: 'FFFFFF' });
  const hdrRot = st.get({ b: 1, sz: 8, color: 'FFFFFF', fill: TEAL, h: 'center', rot: 90, bd: 'FFFFFF' });
  ['MATRICULA', 'COLABORADOR', 'CARGO', 'JORN.', 'EQUIPE', 'ESCALA', 'CÓD. HORÁRIO', 'TURNO'].forEach((t, c) => mg(4, c, 5, c, t, hdr));
  mg(4, cF, 5, cF, 'FOLGAS', hdrRot);
  mg(4, cH, 5, cH, 'HORAS TRAB.', hdrRot);
  mg(4, cT, 5, cT, 'HORÁRIO', hdr);
  for(let d = 0; d < D; d++){
    const w = dows[d];
    const fill = w === 0 ? PURPLE : (w === 6 ? '8C8C8C' : GREY);
    sh.put(4, c0 + d, DOWX[w], st.get({ b: 1, sz: 8, color: 'FFFFFF', fill, h: 'center', rot: 90, bd: 'FFFFFF' }));
    sh.put(5, c0 + d, d + 1, st.get({ b: 1, sz: 9, color: '000000', fill, h: 'center', nf: 164, bd: 'FFFFFF' }));
  }

  // ---- linhas ----
  let r = 6;
  const firstPersonRow = r;
  const blank = st.get({ sz: 8, h: 'center', bd: BD });
  const cellMatr = st.get({ sz: 8, fill: 'DDEBF7', h: 'center', bd: BD });
  const cellName = st.get({ sz: 8, fill: 'DDEBF7', h: 'left', bd: BD });
  const cellCargo = st.get({ sz: 8, h: 'left', bd: BD });
  const cellTot = st.get({ b: 1, sz: 8, h: 'center', bd: BD });
  const cellHor = st.get({ sz: 8, fill: 'FCE4D6', h: 'center', bd: BD });
  const dayStyle = w => st.get({ b: 1, sz: 9, h: 'center', bd: BD, fill: w === 0 ? 'D9D2E9' : (w === 6 ? 'D9D9D9' : null) });

  groups.forEach(g => {
    // sem linha de categoria (Líder, Porão, Limpeza...): só as pessoas, com matrícula e nome
    g.list.forEach(p => {
      const inf = info[p.id];
      sh.heights[r] = 17;
      sh.put(r, 0, (p.registration || '').trim(), cellMatr);
      sh.put(r, 1, String(p.name || '').toUpperCase(), cellName);
      sh.put(r, 2, CARGO[g.gid] || 'AUXILIAR DE RAMPA', cellCargo);
      for(let c = 3; c < c0; c++) sh.put(r, c, null, blank);
      for(let d = 0; d < D; d++){
        let label = null;
        if(inf.offs[d]) label = inf.faSet.has(d) ? 'FA' : 'F';
        else if(inf.codes[d]) label = inf.codes[d];
        sh.put(r, c0 + d, label, dayStyle(dows[d]));
      }
      // total de folgas como fórmula: recalcula sozinho se você trocar um F por trabalho (e vice-versa)
      const rowRng = `${xlsxCol(c0)}${r + 1}:${xlsxCol(c0 + D - 1)}${r + 1}`;
      sh.put(r, cF, { f: `COUNTIF(${rowRng},"F")+COUNTIF(${rowRng},"FA")`, v: inf.total }, cellTot);
      sh.put(r, cH, null, blank);
      sh.put(r, cT, null, cellHor);
      r++;
    });
  });

  // ---- rodapé: quantas pessoas folgam em cada dia ----
  const foot = st.get({ b: 1, sz: 8, fill: 'E5E7EB', h: 'center', bd: BD });
  mg(r, 0, r, c0 - 1, 'FOLGAM', st.get({ b: 1, sz: 8, fill: 'E5E7EB', h: 'left', bd: BD }));
  let sum = 0;
  for(let d = 0; d < D; d++){
    const n = roster.filter(p => info[p.id].offs[d]).length;
    sum += n;
    const colRng = `${xlsxCol(c0 + d)}${firstPersonRow + 1}:${xlsxCol(c0 + d)}${r}`; // linhas das pessoas, deste dia
    sh.put(r, c0 + d, { f: `COUNTIF(${colRng},"F")+COUNTIF(${colRng},"FA")`, v: n }, foot);
  }
  sh.put(r, cF, { f: `SUM(${xlsxCol(c0)}${r + 1}:${xlsxCol(c0 + D - 1)}${r + 1})`, v: sum }, foot);
  sh.put(r, cH, null, foot);
  sh.put(r, cT, null, foot);
  sh.heights[r] = 16;

  sh.freeze = { c: 2, r: 6 };

  const sheetName = `Escala ${capFirst(MONTHS[month])}`;
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const files = [
    { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${REL}"><sheets><sheet name="${xlsxEsc(sheetName)}" sheetId="1" r:id="rId1"/></sheets><calcPr fullCalcOnLoad="1"/></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: st.xml() },
    { name: 'xl/worksheets/sheet1.xml', data: sh.xml() }
  ];
  return { bytes: xlsxZip(files), filename: `escala-${normalizeText(MONTHS[month])}-${year}.xlsx` };
}

function downloadXlsxBytes(bytes, filename){
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function exportXlsxForMonth(y, m){
  try{
    const res = buildEscalaXlsx(y, m);
    if(!res){
      showToast('Ninguém está incluído na escala deste mês ainda.');
      return;
    }
    downloadXlsxBytes(res.bytes, res.filename);
    showToast('Excel da escala gerado ✓');
  }catch(err){
    console.error('Falha ao exportar Excel:', err);
    showToast('Não consegui gerar o Excel. Tente de novo.');
  }
}

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((e) => {
      console.error('Falha ao registrar service worker', e);
    });
  });
