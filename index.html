<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>Escala — Operações de Pátio</title>
<meta name="theme-color" content="#0F1720">
<meta name="description" content="Escala de equipe de Operações de Pátio">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escala Pátio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1720;
    --surface: #161F2A;
    --surface-2: #1D2836;
    --surface-3: #253345;
    --border: #2B3A4C;
    --text: #EDF1F5;
    --text-dim: #8B98A5;
    --text-faint: #5C6B7A;
    --accent: #FF6B35;
    --accent-dim: #b84e26;

    --c-porao: #5B7FFF;
    --c-limpeza: #2DD4BF;
    --c-operador: #FBBF24;
    --c-triagem: #A78BFA;
    --c-lider: #FF6B35;
    --c-hoje: #FFD60A;

    --c-disponivel: #34D399;
    --c-folga: #64748B;
    --c-falta: #F87171;
    --c-desejada: #38BDF8;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    touch-action: pan-x pan-y;
  }

  *{
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  input, textarea{
    -webkit-user-select: text;
    -moz-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  h1,h2,h3, .num, .display{
    font-family: 'Space Grotesk', sans-serif;
  }

  /* Runway texture strip */

  header{
    padding: 20px 20px 16px;
    max-width: 960px;
    margin: 0 auto;
  }

  header .eyebrow{
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  header h1{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header p.sub{
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 4px;
  }

  nav.tabs{
    max-width: 960px;
    margin: 8px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 6px;
  }

  nav.tabs button{
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 8px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  nav.tabs button.active{
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  nav.tabs button:hover:not(.active){ color: var(--text); }

  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    touch-action: pan-y;
    min-height: calc(100vh - 120px);
  }

  .view{ display: none; }
  .view.active{ display: block; }

  /* --- Calendar --- */
  .month-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
  }

  .month-bar h2{
    font-size: 20px;
    font-weight: 600;
    flex: 1;
    text-align: center;
    cursor: pointer;
  }
  .month-bar h2:active{ opacity: 0.6; }

  .month-nav{ display: flex; gap: 8px; }

  .icon-btn{
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover{ background: var(--surface-2); border-color: var(--accent); }
  .dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .swipe-viewport{
    overflow: hidden;
    position: relative;
    touch-action: pan-y;
  }

  #calViewport{
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
  }

  /* --- Day panel (sheet) --- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(6,10,15,0.6);
    backdrop-filter: blur(2px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.active{ display: flex; }

  @media (min-width: 640px){
    .overlay{ align-items: center; }
  }

  .sheet{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 22px 20px 28px;
    animation: slideUp 0.22s ease;
  }
  @media (min-width: 640px){
    .sheet{ border-radius: 20px; max-height: 80vh; }
  }
  @keyframes slideUp{
    from{ transform: translateY(24px); opacity: 0; }
    to{ transform: translateY(0); opacity: 1; }
  }

  .sheet-head{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .sheet-head h3{ font-size: 19px; font-weight: 700; text-transform: capitalize; }
  .sheet-head p{ color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .close-btn{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
  }
  .close-btn:hover{ color: var(--text); }

  .section-label{
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    margin: 18px 0 8px;
    letter-spacing: 0.02em;
  }
  .section-label:first-child{ margin-top: 0; }

  .person-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 10px;
    margin-bottom: 6px;
    border-left: 3px solid var(--c-disponivel);
  }
  .person-row.folga{ border-left-color: var(--c-folga); opacity: 0.6; }
  .person-row.falta{ border-left-color: var(--c-falta); }

  .person-info{ display: flex; flex-direction: column; gap: 3px; }
  .person-name{ font-size: 14px; font-weight: 600; }
  .person-name.clickable-name{ cursor: pointer; }
  .person-name.clickable-name:active{ opacity: 0.6; }
  .person-reg{ font-size: 12px; font-weight: 500; color: var(--text-faint); }
  .person-reg-wrap{ display:inline-flex; align-items:center; gap:6px; }
  .team-card .person-reg{ font-size: 15px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.3px; }
  .team-card .copy-reg-btn{ width: 32px; height: 32px; font-size: 16px; border-radius: 8px; }
  .copy-reg-btn{
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 22px; height: 22px;
    font-size: 12px;
    line-height: 1;
    display:inline-flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
  }
  .copy-reg-btn:hover{ border-color: var(--c-disponivel); }
  .copy-reg-btn:active{ transform: scale(0.92); }
  .fn-chips{ display: flex; gap: 5px; flex-wrap: wrap; }
  .fn-chip{
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 6px;
    color: #0F1720;
  }

  .status-tag{
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .falta-toggle{
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .falta-toggle:hover{ border-color: var(--c-falta); color: var(--c-falta); }
  .falta-toggle.active{
    background: rgba(248,113,113,0.15);
    border-color: var(--c-falta);
    color: var(--c-falta);
  }
  .shift-tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .shift-tabs button{ flex:1; }
  .shift-tabs button.on{ border-color: #A78BFA; color: #A78BFA; background: rgba(167,139,250,0.15); }
  .shift-grid{ display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; max-height:40vh; overflow-y:auto; }
  .shift-grid button{
    background: var(--surface-3); border:1px solid var(--border); color: var(--text);
    font-size: 14px; font-weight: 700; padding: 10px 0; border-radius: 8px; cursor:pointer;
  }
  .shift-grid button.on{ background:#A78BFA; border-color:#A78BFA; color:#0F1720; }

  .roster-toggle{
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .roster-toggle:hover{ border-color: var(--c-disponivel); color: var(--c-disponivel); }
  .roster-toggle.active{
    background: rgba(52,211,153,0.15);
    border-color: var(--c-disponivel);
    color: var(--c-disponivel);
  }

  .escala-month-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .escala-month-bar h3{
    font-size: 16px;
    font-weight: 600;
  }

  .empty-note{
    color: var(--text-faint);
    font-size: 13px;
    padding: 14px 0;
    text-align: center;
  }

  /* --- Equipe view --- */
  .btn-primary{
    background: var(--accent);
    color: #0F1720;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-primary:hover{ background: #ff7d4d; }

  .btn-secondary{
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-secondary:hover{ border-color: var(--accent); }

  .team-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .team-head h2{ font-size: 20px; font-weight: 600; }

  .team-list{ display: flex; flex-direction: column; gap: 8px; }

  .team-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .team-card .info{ display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .team-card .name{ font-size: 15px; font-weight: 600; }

  .team-card .actions{ display: flex; gap: 6px; flex-shrink: 0; }

  .icon-btn-sm{
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 13px;
  }
  .icon-btn-sm:hover{ border-color: var(--accent); color: var(--text); }

  .imp-title{
    display: flex; align-items: center; gap: 8px; margin: 2px 0 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint);
  }
  .imp-title span{
    padding: 1px 8px; border-radius: 999px; letter-spacing: 0;
    color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border);
  }
  .imp-card{ align-items: flex-start; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; }
  .imp-card .info{ flex: 1; gap: 8px; }
  .imp-card .name{ font-size: 14.5px; }
  .imp-chips{ display: flex; flex-wrap: wrap; gap: 4px; }
  .imp-chip{
    min-width: 28px; padding: 2px 8px; text-align: center;
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
  }
  .imp-chip.new{ color: var(--text); background: rgba(255,107,53,0.18); border-color: var(--accent); }
  .imp-chip.gone{ color: var(--c-falta); background: transparent; border-color: rgba(248,113,113,0.45); text-decoration: line-through; opacity: 0.85; }
  .imp-title .imp-warn{ margin-left: auto; padding: 1px 8px; border-radius: 999px; letter-spacing: 0; text-transform: none; color: var(--accent); background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.4); }
  .imp-title .imp-ok{ margin-left: auto; letter-spacing: 0; text-transform: none; color: var(--c-disponivel); }
  .imp-grid{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .imp-day{
    padding: 7px 0; font-size: 12px; font-weight: 600; cursor: pointer;
    color: var(--text-dim); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .imp-day.on{ color: var(--text); background: rgba(100,116,139,0.45); border-color: var(--c-folga); }

  .empty-state{
    text-align: center;
    padding: 48px 20px;
    color: var(--text-faint);
  }
  .empty-state p{ font-size: 14px; margin-top: 6px; }

  /* --- Modal (add/edit person, off-days editor) --- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(6,10,15,0.65);
    backdrop-filter: blur(2px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .modal-overlay.active{ display: flex; }

  .modal{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal h3{ font-size: 18px; font-weight: 700; margin-bottom: 18px; }

  .field{ margin-bottom: 16px; }
  .field label{
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 7px;
  }
  .field input[type="text"]{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 13px;
    border-radius: 10px;
    outline: none;
  }
  .field input[type="text"]:focus{ border-color: var(--accent); }
  .field select{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 13px;
    border-radius: 10px;
    outline: none;
  }
  .field select:focus{ border-color: var(--accent); }

  .search-input-wrap{ position: relative; margin-bottom: 16px; }
  .search-input-wrap .search-icon{
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: 14px;
    display: flex;
    pointer-events: none;
  }
  .search-input{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 11px 13px 11px 36px;
    border-radius: 10px;
    outline: none;
  }
  .search-input:focus{ border-color: var(--accent); }
  .search-input::placeholder{ color: var(--text-faint); }

  .fn-options{ display: flex; flex-direction: column; gap: 8px; }
  .fn-option{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .fn-option.checked{ border-color: var(--fn-color, var(--accent)); background: var(--surface-3); }
  .fn-option input{ accent-color: var(--accent); width: 16px; height: 16px; }
  .fn-option .fn-dot{ width: 10px; height: 10px; border-radius: 3px; }
  .fn-option span.lbl{ font-size: 14px; font-weight: 500; }

  .modal-actions{
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .modal-actions button{ flex: 1; }

  .danger-link{
    color: var(--c-falta);
    background: none;
    border: 1px solid rgba(248,113,113,0.45);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    padding: 12px;
    margin-top: 28px; /* bem separado de Cancelar/Salvar pra não tocar sem querer */
  }
  .danger-link:active{ background: rgba(248,113,113,0.12); }

  /* Off-days mini calendar inside modal */
  #shiftOverlay{ z-index: 70; }

  #coverageConflictBanner{ margin-top: 16px; }
  .conflict-banner-item{
    color: var(--c-falta);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    padding: 10px 14px;
    background: rgba(248,113,113,0.10);
    border: 1px solid rgba(248,113,113,0.35);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .mini-hint{ font-size: 12px; color: var(--text-faint); margin-bottom: 14px; }

  .toast{
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  /* --- Gerador automático de escala --- */
  .btn-magic{
    background: linear-gradient(135deg, var(--accent), #ff9a3d);
    color: #0F1720;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    white-space: nowrap;
  }
  .btn-magic:hover{ filter: brightness(1.08); }
  .btn-magic:active{ transform: scale(0.97); }

  .gen-modal{
    width: 100%;
    max-width: 560px;
    height: min(90vh, 780px);
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: max-width 0.35s ease;
  }
  .gen-modal.wide{ max-width: 980px; }
  .modal-overlay.active .gen-modal{ animation: genPop 0.3s cubic-bezier(.2,.8,.2,1); }
  @keyframes genPop{
    from{ opacity: 0; transform: translateY(18px) scale(0.98); }
    to{ opacity: 1; transform: none; }
  }

  .gen-head{ padding: 18px 20px 12px; flex-shrink: 0; }
  .gen-head-top{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .gen-eyebrow{ font-size: 11.5px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
  .gen-title{ font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-top: 2px; }
  .gen-progress{ display: flex; gap: 5px; }
  .gen-progress span{
    flex: 1; height: 4px; border-radius: 4px;
    background: var(--surface-3);
    position: relative; overflow: hidden;
  }
  .gen-progress span::after{
    content: ''; position: absolute; inset: 0;
    background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s ease;
  }
  .gen-progress span.done::after{ transform: scaleX(1); }

  .gen-body{ flex: 1; overflow-y: auto; padding: 4px 20px 16px; overscroll-behavior: contain; }
  .gen-step.anim-fwd{ animation: genInFwd 0.32s cubic-bezier(.2,.8,.2,1); }
  .gen-step.anim-back{ animation: genInBack 0.32s cubic-bezier(.2,.8,.2,1); }
  @keyframes genInFwd{ from{ opacity: 0; transform: translateX(26px); } to{ opacity: 1; transform: none; } }
  @keyframes genInBack{ from{ opacity: 0; transform: translateX(-26px); } to{ opacity: 1; transform: none; } }

  .gen-foot{
    display: flex; gap: 8px;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .gen-foot button{ flex: 1; padding-left: 10px; padding-right: 10px; }
  .gen-foot .btn-primary{ flex: 1.5; }
  .gen-foot button:disabled{ opacity: 0.45; cursor: not-allowed; }

  .gen-lead{ font-size: 14px; color: var(--text-dim); line-height: 1.5; margin: 4px 0 16px; }
  .gen-lead b{ color: var(--text); font-weight: 600; }

  .gen-month-row{ display: flex; gap: 8px; margin-bottom: 16px; }
  .gen-select{
    flex: 1;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 14px;
    outline: none;
  }
  .gen-select:focus{ border-color: var(--accent); }
  .gen-year-input{
    width: 92px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 14px;
    outline: none;
  }
  .gen-year-input:focus{ border-color: var(--accent); }

  .gen-group{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .gen-group-head{ display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .gen-group-head .dot{ width: 10px; height: 10px; border-radius: 3px; }
  .gen-group-head .gname{ font-size: 14px; font-weight: 700; flex: 1; }
  .gen-group-head .gcount{ font-size: 12px; color: var(--text-faint); font-weight: 600; }
  .gen-link-btn{
    background: none; border: none; color: var(--accent);
    font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 6px;
  }
  .gen-pills{ display: flex; flex-wrap: wrap; gap: 7px; }
  .gen-pill{
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  .gen-pill:active{ transform: scale(0.95); }
  .gen-pill .gen-check{
    width: 0; opacity: 0; overflow: hidden; font-size: 12px;
    transition: width 0.18s ease, opacity 0.18s ease;
  }
  .gen-pill.on{ background: rgba(255,107,53,0.16); border-color: var(--accent); color: var(--text); }
  .gen-pill.on .gen-check{ width: 12px; opacity: 1; color: var(--accent); }

  .gen-summary{
    margin-top: 12px; padding: 10px 12px;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--surface-2); border: 1px dashed var(--border);
    color: var(--text-dim);
  }
  .gen-summary b{ color: var(--accent); }

  .gen-acc{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  .gen-acc.open{ border-color: var(--c-desejada); }
  .gen-acc-head{
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; cursor: pointer;
  }
  .gen-acc-head .aname{ flex: 1; font-size: 14px; font-weight: 600; min-width: 0; }
  .gen-badge{
    font-size: 11.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-3); color: var(--text-faint);
    transition: background 0.2s ease, color 0.2s ease;
  }
  .gen-badge.has{ background: rgba(56,189,248,0.18); color: var(--c-desejada); }
  .gen-chev{ color: var(--text-faint); font-size: 12px; transition: transform 0.25s ease; }
  .gen-acc.open .gen-chev{ transform: rotate(180deg); }
  .gen-acc-body{ max-height: 0; overflow: hidden; transition: max-height 0.32s ease; }
  .gen-acc.open .gen-acc-body{ max-height: 420px; }
  .gen-acc-inner{ padding: 2px 12px 14px; }

  .gen-cal{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .gen-cal .dow{ text-align: center; font-size: 10.5px; font-weight: 700; color: var(--text-faint); padding-bottom: 2px; }
  .gen-cal button, .gen-cal .blank{ aspect-ratio: 1 / 1; border-radius: 8px; }
  .gen-cal button{
    border: 1px solid var(--border);
    background: var(--surface-3);
    color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease, border-color 0.15s ease;
  }
  .gen-cal button.wk{ color: var(--text); }
  .gen-cal button:active{ transform: scale(0.9); }
  .gen-cal button.on{ background: var(--c-desejada); border-color: var(--c-desejada); color: #0F1720; }
  @keyframes genRowIn{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: none; } }

  .gen-add-btn{
    width: 100%;
    background: none;
    border: 1.5px dashed var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 13px; border-radius: 12px; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .gen-add-btn:hover{ border-color: var(--accent); color: var(--text); }

  .gen-sec-title{ font-size: 12px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.04em; text-transform: uppercase; margin: 18px 0 8px; }
  .gen-sec-title:first-child{ margin-top: 4px; }

  .gen-check-row{
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.18s ease, opacity 0.18s ease;
  }
  .gen-check-row.off{ opacity: 0.5; }
  .gen-check-row.on{ border-color: var(--accent); }
  .gen-check-row .ctext{ flex: 1; font-size: 13.5px; font-weight: 600; line-height: 1.4; min-width: 0; }
  .gen-tick{
    width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent; font-weight: 700;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  .gen-check-row.on .gen-tick{ background: var(--accent); border-color: var(--accent); color: #0F1720; }
  .gen-x{
    background: none; border: none; color: var(--text-faint);
    font-size: 15px; cursor: pointer; padding: 4px 6px; flex-shrink: 0;
  }
  .gen-x:hover{ color: var(--c-falta); }
  .gen-warn-note{
    font-size: 12px; font-weight: 600; color: #FBBF24;
    background: rgba(251,191,36,0.10); border: 1px solid rgba(251,191,36,0.3);
    border-radius: 10px; padding: 8px 10px; margin: -2px 0 8px; line-height: 1.4;
  }
  .gen-draft{
    background: var(--surface-2); border: 1px solid var(--accent);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
    animation: genRowIn 0.25s ease;
  }
  .gen-draft .gen-draft-actions{ display: flex; gap: 8px; margin-top: 12px; }
  .gen-draft .gen-draft-actions button{ flex: 1; padding: 10px; }

  .gen-rule{
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .gen-rule .rtext{ flex: 1; min-width: 0; }
  .gen-rule .rtitle{ font-size: 13.5px; font-weight: 600; }
  .gen-rule .rhint{ font-size: 11.5px; color: var(--text-faint); margin-top: 2px; line-height: 1.35; }
  .gen-stepper{ display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .gen-stepper button{
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-3); color: var(--text);
    font-size: 17px; font-weight: 600; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.12s ease;
  }
  .gen-stepper button:hover{ border-color: var(--accent); }
  .gen-stepper button:active{ transform: scale(0.9); }
  .gen-stepper .val{
    min-width: 34px; text-align: center;
    font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700;
  }
  .gen-rule.fixed .rtitle::after{ content: ' · fixa'; color: var(--text-faint); font-weight: 500; }

  /* tela de geração */
  .gen-loading{ text-align: center; padding: 64px 20px; }
  .gen-spinner{
    width: 54px; height: 54px; margin: 0 auto 18px;
    border-radius: 50%;
    border: 4px solid var(--surface-3);
    border-top-color: var(--accent);
    animation: genSpin 0.8s linear infinite;
  }
  @keyframes genSpin{ to{ transform: rotate(360deg); } }
  .gen-loading p{ font-size: 14px; color: var(--text-dim); font-weight: 500; }
  .gen-loading .sub{ font-size: 12px; color: var(--text-faint); margin-top: 4px; }

  /* resultado */
  .gen-verdict{
    display: flex; gap: 12px; align-items: flex-start;
    border-radius: 12px; padding: 12px 14px; margin: 4px 0 14px;
    animation: genRowIn 0.3s ease;
  }
  .gen-verdict.ok{ background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.4); }
  .gen-verdict.alert{ background: rgba(248,113,113,0.10); border: 1px solid rgba(248,113,113,0.45); }
  .gen-verdict .vgrp{ margin-top: 10px; font-size: 13px; line-height: 1.5; }
  .gen-verdict .vdays{ margin: 4px 0 6px; padding-left: 10px; font-size: 12.5px; color: var(--text-dim); }
  .gen-verdict .vwhy, .gen-verdict .vfix{ font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .gen-verdict.warn{ background: rgba(251,191,36,0.10); border: 1px solid rgba(251,191,36,0.35); }
  .gen-verdict .vicon{ font-size: 20px; font-weight: 800; line-height: 1.2; min-width: 22px; text-align: center; animation: genPopIcon 0.45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes genPopIcon{ from{ transform: scale(0); } to{ transform: scale(1); } }
  .gen-verdict .vtitle{ font-size: 14px; font-weight: 700; }
  .gen-verdict .vlist{ margin-top: 6px; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .gen-verdict .vlist div{ padding-left: 12px; position: relative; }
  .gen-verdict .vlist div::before{ content: '•'; position: absolute; left: 0; color: #FBBF24; }

  .gen-table-wrap{
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    -webkit-overflow-scrolling: touch;
  }
  table.gen-table{ border-collapse: separate; border-spacing: 0; font-size: 11px; width: max-content; min-width: 100%; }
  .gen-table th, .gen-table td{ text-align: center; padding: 0; border-bottom: 1px solid var(--border); }
  .gen-table tr:last-child td, .gen-table tr:last-child th{ border-bottom: none; }
  .gen-table th.nm, .gen-table td.nm{
    position: sticky; left: 0; z-index: 2;
    background: var(--surface);
    text-align: left; padding: 0 10px;
    min-width: 112px; max-width: 112px;
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-right: 1px solid var(--border);
  }
  /* barrinha vertical à esquerda do nome, na cor da função (Líder, Operador, Porão, Limpeza, Triagem) */
  .gen-table td.nm.fnbar{ padding-left: 16px; }
  .gen-table td.nm.fnbar::before{
    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 4px;
    border-radius: 2px; background: var(--fn, transparent);
  }
  .gen-table th.dh{ font-weight: 600; color: var(--text-dim); padding: 6px 0; min-width: 26px; background: var(--surface-2); }
  .gen-table th.dh .dn{ display: block; font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: var(--text); }
  .gen-table th.dh .dw{ display: block; font-size: 9.5px; text-transform: uppercase; }
  .gen-table th.dh.wknd{ background: rgba(255,107,53,0.14); }
  .gen-table th.nm{ background: var(--surface-2); }
  .gen-table td.c{ height: 30px; min-width: 26px; }
  .gen-table td.c.wknd{ background: rgba(255,107,53,0.06); }
  .gen-table td.tot{ min-width: 34px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; padding: 0 6px; }
  .gen-table th.tot{ min-width: 34px; background: var(--surface-2); font-size: 10px; color: var(--text-dim); padding: 6px 4px; }
  .gen-table td.tot.bad{ color: var(--c-falta); }
  .gen-cell{
    display: block; margin: 3px auto; width: 22px; height: 22px; line-height: 22px;
    border-radius: 6px; font-size: 10.5px; font-weight: 700;
    background: var(--c-folga); color: #fff;
    animation: genCellIn 0.35s ease backwards;
  }
  .gen-cell.req{ background: var(--c-desejada); color: #0F1720; }
  .gen-cell.fa{ background: var(--accent); color: #0F1720; }
  .gen-cell.sel{ outline: 2px solid #fff; outline-offset: 1px; }
  .gen-full-host .gen-table td.c[data-p]{ cursor: pointer; }
  .gen-full-msg{
    display:none; flex-shrink:0; margin:0 14px 8px; padding:8px 10px; font-size:12.5px; font-weight:600; line-height:1.4;
    color:#F87171; background:rgba(248,113,113,.10); border:1px solid rgba(248,113,113,.4); border-radius:10px;
  }
  .gen-full-msg.show{ display:block; }
  @keyframes genCellIn{ from{ opacity: 0; transform: scale(0.4); } to{ opacity: 1; transform: none; } }
  .gen-table tr.foot td{ background: var(--surface-2); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11.5px; height: 26px; color: var(--text-dim); }
  .gen-table tr.foot td.nm{ background: var(--surface-2); font-family: 'Inter', sans-serif; font-size: 11px; }
  .gen-table tr.foot td.over{ color: var(--c-falta); }
  .gen-table tr.foot.clean td{ background: rgba(45,212,191,0.10); color: var(--c-limpeza); font-size: 12.5px; }
  /* fundo opaco (camada translúcida sobre a cor da superfície): os números que rolam por baixo não aparecem por cima do nome */
  .gen-table tr.foot.clean td.nm{ background: linear-gradient(rgba(45,212,191,0.16), rgba(45,212,191,0.16)), var(--surface-2); color: var(--c-limpeza); font-weight: 600; }
  /* coluna do dia de hoje */
  .gen-table td.c.today{ background: rgba(255,214,10,0.10); box-shadow: inset 1px 0 0 rgba(255,214,10,0.45), inset -1px 0 0 rgba(255,214,10,0.45); }
  .gen-table th.dh.boost{ background: rgba(96,165,250,0.22); }
  .gen-table th.dh.boost .dn{ color: #60A5FA; }
  .gen-cal.boost button.on{ background: #60A5FA; border-color: #60A5FA; color: #0F1720; }
  .gen-table th.dh.today{ background: rgba(255,214,10,0.20); box-shadow: inset 0 2px 0 var(--c-hoje); }
  .gen-table th.dh.today .dn{ color: var(--c-hoje); }
  .gen-table tr.foot td.today{ background: rgba(255,214,10,0.14); box-shadow: inset 1px 0 0 rgba(255,214,10,0.45), inset -1px 0 0 rgba(255,214,10,0.45); }
  .gen-table tr.foot.clean td.cl-low{ color: var(--c-falta); }
  .gen-legend{ display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: 11.5px; color: var(--text-dim); }
  .gen-legend span{ display: inline-flex; align-items: center; gap: 6px; }
  .gen-legend i{ width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .gen-legend i.fnb{ width: 4px; height: 14px; border-radius: 2px; }
  .gen-legend.fnleg{ margin-top: 12px; margin-bottom: -4px; }

  /* --- Opções de escala, diagnóstico e tela expandida --- */
  .gen-opt-bar{ display:flex; align-items:center; gap:8px; margin:2px 0 10px; }
  .gen-opt-tabs{ display:flex; gap:6px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .gen-opt-tabs::-webkit-scrollbar{ display:none; }
  .gen-opt-tab{
    flex:0 0 auto; background:var(--surface-2); color:var(--text-dim);
    border:1px solid var(--border); border-radius:999px; padding:8px 14px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:700; cursor:pointer;
    transition:background .22s ease, color .22s ease, border-color .22s ease, transform .12s ease;
  }
  .gen-opt-tab:active{ transform:scale(.95); }
  .gen-opt-tab.on{ background:rgba(255,107,53,.16); border-color:var(--accent); color:var(--text); }
  .gen-expand-btn{
    flex:0 0 auto; background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:10px; padding:8px 12px;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:700; cursor:pointer;
    transition:border-color .18s ease, transform .12s ease;
  }
  .gen-expand-btn.sq{ width:38px; height:38px; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:16px; line-height:1; }
  .cal-schedule{ margin-top:16px; }
  .cal-sched-bar{ display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:0 0 8px; }
  .gen-expand-btn.edit{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px; }
  /* modo de edição da tabela */
  .gen-full.editing .gen-full-host{ border-color:var(--accent); box-shadow:0 0 0 1px rgba(255,107,53,.35), 0 0 24px rgba(255,107,53,.12); }
  .gen-full.editing .gen-table td.c[data-p]{
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    background-image:radial-gradient(circle, rgba(255,255,255,.16) 1.5px, transparent 2.2px);
    background-repeat:no-repeat; background-position:center;
  }
  .gen-full.editing .gen-table td.c[data-p]:active{ background-color:rgba(255,107,53,.18); }
  .gen-table td.c.ed-flash{ animation:edFlash .8s ease; }
  .gen-table-wrap.noanim td.ed-flash .gen-cell{ animation:edPop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes edFlash{ 0%{ background-color:rgba(255,107,53,.5); } 100%{ background-color:transparent; } }
  @keyframes edPop{ from{ transform:scale(.4); opacity:.4; } to{ transform:none; opacity:1; } }
  .gen-edit-hint{ padding:10px 12px 0; font-size:12px; line-height:1.45; color:var(--text-dim); }
  .gen-edit-hint b{ color:var(--text); }
  .gen-opt-tab:disabled{ opacity:.4; cursor:not-allowed; }
  .gen-full-msg.ok{ color:#34D399; background:rgba(52,211,153,.10); border-color:rgba(52,211,153,.4); }
  .gen-expand-btn:hover{ border-color:var(--accent); }
  .gen-expand-btn:active{ transform:scale(.95); }
  .gen-opt-note{ font-size:12px; color:var(--text-faint); margin:-2px 0 10px; line-height:1.4; }
  .gen-opt-host{ transition:opacity .16s ease, transform .16s ease; }
  .gen-opt-host.swap-out{ opacity:0; transform:translateY(6px); }
  .gen-opt-host.swap-in{ opacity:0; transform:translateY(-6px); transition:none; }
  .gen-opt-meta{ font-size:12px; color:var(--text-dim); margin:0 0 10px; }
  .gen-table-wrap.noanim .gen-cell{ animation:none; }
  .gen-verdict.bad{ background:rgba(248,113,113,0.10); border:1px solid rgba(248,113,113,0.4); }
  .gen-issue{
    background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--c-falta);
    border-radius:12px; padding:12px 14px; margin-bottom:8px; animation:genRowIn .25s ease backwards;
  }
  .gen-issue .it{ font-size:13.5px; font-weight:700; }
  .gen-issue .id{ font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.45; }
  .gen-issue .if{ font-size:12.5px; color:var(--text); margin-top:6px; line-height:1.45; font-weight:600; }

  .gen-full{
    position:fixed; inset:0; z-index:80; background:var(--bg); overflow:hidden;
    touch-action:none; overscroll-behavior:none; /* a tela expandida não rola/gira em nenhuma direção por conta própria */
    opacity:0; visibility:hidden; transform:scale(.97);
    transition:opacity .28s ease, transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s linear .3s;
  }
  .gen-full.open{ opacity:1; visibility:visible; transform:none; transition-delay:0s; }
  .gen-full-inner{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .gen-full.force-land .gen-full-inner{ inset:auto; top:0; left:100%; transform-origin:0 0; transform:rotate(90deg); }
  /* celular girado para o outro lado (sensor de inclinação): deita a escala no sentido contrário */
  .shift-grid button small{ display:block; font-size:8.5px; font-weight:500; opacity:.8; line-height:1.2; }
  /* faixa de códigos de turno (modo edição, ferramenta Código) */
  .gen-code-strip{
    display:none; flex-shrink:0; gap:6px; overflow-x:auto; scrollbar-width:none; touch-action:none;
    margin:0 calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px)); padding:2px 0;
  }
  .gen-code-strip::-webkit-scrollbar{ display:none; }

<script>
// ---------- Config ----------
const FUNCTIONS = [
  { id: 'porao', name: 'Porão', color: 'var(--c-porao)', hex: '#5B7FFF' },
  { id: 'limpeza', name: 'Limpeza', color: 'var(--c-limpeza)', hex: '#2DD4BF' },
  { id: 'operador', name: 'Operador', color: 'var(--c-operador)', hex: '#FBBF24' },
  { id: 'triagem', name: 'Triagem', color: 'var(--c-triagem)', hex: '#A78BFA' },
  { id: 'lider', name: 'Líder', color: 'var(--c-lider)', hex: '#FF6B35' },
];
const DOW = ['dom','seg','ter','qua','qui','sex','sáb'];
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function capFirst(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
const DEFAULT_STATE = { people: [], offDays: {}, requestedOffDays: {}, absences: {}, dayAssignments: {}, publishedMonths: [], monthRosters: {}, coveragePairs: [], faMonths: {}, shiftCodes: {}, midMonthJoiners: {} };

// ---------- State ----------
let state = Object.assign({}, DEFAULT_STATE);
let calYear, calMonth; // 0-indexed month
let editingPersonId = null;
let importPrefillActive = false; // true enquanto o modal de pessoa foi aberto a partir da revisão de importação de PDF
let sheetDateStr = null;

const todayObj = new Date();
calYear = todayObj.getFullYear();

// ---------- Back button / gesture navigation for modals & cards ----------
// Every overlay (modal or day sheet) is registered here with the function
// that actually performs its closing logic (hiding it + any cleanup).
// Opening an overlay pushes a history entry; the hardware/gesture "back"
// action then just pops that entry instead of leaving the app, and our
// popstate listener runs the real close function.
const overlayRegistry = {};
let overlayStack = [];
let suppressPopstate = false;

function registerOverlay(id, closeFn){
  overlayRegistry[id] = closeFn;
}

function pushOverlay(id){
  overlayStack.push(id);
  history.pushState({ overlay: id, depth: overlayStack.length }, '');
}

// Call this instead of the raw close function whenever the user closes an
// overlay via UI (X button, tapping outside, Cancelar, or after Salvar).
// It triggers history.back() so the browser/OS back gesture and our own
// close buttons stay perfectly in sync with a single source of truth.
function requestCloseOverlay(id){
  const topIndex = overlayStack.lastIndexOf(id);
  if(topIndex === -1){
    // Not tracked (shouldn't normally happen) — just close directly.
    if(overlayRegistry[id]) overlayRegistry[id]();
    return;
  }
  suppressPopstate = false;
  history.back();
}

window.addEventListener('popstate', ()=>{
  if(suppressPopstate){ suppressPopstate = false; return; }
  if(overlayStack.length){
    const id = overlayStack.pop();
    if(overlayRegistry[id]) overlayRegistry[id]();
  }
});

calMonth = todayObj.getMonth();

// ---------- Posição de navegação (aba + mês) ----------
// O sistema (Android/iOS) pode descarregar a aba do app da memória quando ela
// fica em segundo plano por um tempo — isso é uma limitação da plataforma,
// não do app, e nenhum site consegue impedir totalmente. O que dá pra fazer é
// lembrar onde o usuário estava e devolvê-lo pro mesmo lugar ao reabrir, em
// vez de sempre cair na tela inicial — assim a sensação de "reiniciar" some.
const UI_STATE_KEY = 'escalaUiState';
function saveUiState(){
  try{
    const activeBtn = document.querySelector('nav.tabs button.active');
    localStorage.setItem(UI_STATE_KEY, JSON.stringify({
      tab: activeBtn ? activeBtn.dataset.tab : 'calendario',
      calYear, calMonth
    }));
  }catch(e){ /* localStorage indisponível — ignora silenciosamente */ }
}
function restoreUiState(){
  try{
    const raw = localStorage.getItem(UI_STATE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(Number.isInteger(saved.calYear) && Number.isInteger(saved.calMonth)){
      calYear = saved.calYear;
      calMonth = saved.calMonth;
    }
    if(saved.tab && TAB_ORDER.includes(saved.tab)){
      setActiveTabInstant(saved.tab);
    }
  }catch(e){ /* dado salvo corrompido — segue com o padrão (hoje) */ }
}

function fnById(id){ return FUNCTIONS.find(f => f.id === id); }
function pickableFunctions(p){
  // Líder não é mais coringa: mostra e atua somente com a etiqueta "Líder".
  return p.functions||[];
}

// ---------- Ordenação padrão da equipe ----------
// Líder sempre primeiro, depois Operador, depois o restante —
// e dentro de cada grupo, ordenado por matrícula crescente.
function priorityRank(p){
  const fns = p.functions||[];
  if(fns.includes('lider')) return 0;
  if(fns.includes('operador')) return 1;
  return 2;
}
function matriculaNum(p){
  const n = parseInt((p.registration||'').replace(/\D/g,''), 10);
  return isNaN(n) ? Infinity : n;
}
function sortPeople(list){
  return [...list].sort((a,b)=>{
    const ra = priorityRank(a), rb = priorityRank(b);
    if(ra !== rb) return ra - rb;
    const ma = matriculaNum(a), mb = matriculaNum(b);
    if(ma !== mb) return ma - mb;
    return (a.registration||'').localeCompare(b.registration||'');
  });
}
// Ordem da aba "Escala": Líder, Operador, Triagem, Limpeza e, por fim, o restante
// (Porão e quem não tem função), cada grupo em ordem alfabética pelo nome.
const ESCALA_FN_ORDER = ['lider','operador','triagem','limpeza'];
function escalaRank(p){
  const fns = p.functions||[];
  const i = ESCALA_FN_ORDER.findIndex(id => fns.includes(id));
  return i === -1 ? ESCALA_FN_ORDER.length : i;
}
function sortPeopleEscala(list){
  return [...list].sort((a,b)=>{
    const ra = escalaRank(a), rb = escalaRank(b);
    if(ra !== rb) return ra - rb;
    const byName = (a.name||'').localeCompare(b.name||'', 'pt-BR', { sensitivity: 'base' });
    if(byName !== 0) return byName;
    return matriculaNum(a) - matriculaNum(b);
  });
}
// Ordem da tabela de folgas (tela principal): a mesma ordem de funções da aba Escala
// (Líder, Operador, Triagem, Limpeza e, por fim, o restante), mas com matrícula crescente dentro de cada função.
function sortPeopleTabela(list){
  return [...list].sort((a,b)=>{
    const ra = escalaRank(a), rb = escalaRank(b);
    if(ra !== rb) return ra - rb;
    const ma = matriculaNum(a), mb = matriculaNum(b);
    if(ma !== mb) return ma - mb;
    return (a.name||'').localeCompare(b.name||'', 'pt-BR', { sensitivity: 'base' });
  });
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function iso(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function monthKey(y,m){ return `${y}-${pad(m+1)}`; }
function isMonthPublished(y,m){ return (state.publishedMonths||[]).includes(monthKey(y,m)); }
function publishMonth(y,m){
  if(!state.publishedMonths) state.publishedMonths = [];
  const key = monthKey(y,m);
  if(!state.publishedMonths.includes(key)) state.publishedMonths.push(key);
  // Um mês novo sempre começa sem ninguém escalado — a equipe precisa ser
  // incluída manualmente na aba "Escala", mês a mês.
  if(!state.monthRosters) state.monthRosters = {};
  if(!state.monthRosters[key]) state.monthRosters[key] = [];
  saveState();
  renderCalendar();
  renderEscalaList();
  showToast('Escala criada. Vá na aba "Escala" e inclua quem participa deste mês.');
}

// ---------- Roster (quem participa da escala de cada mês) ----------
function isInRoster(personId, y, m){
  const key = monthKey(y,m);
  return (state.monthRosters[key] || []).includes(personId);
}
function toggleRosterMember(personId, y, m){
  if(!state.monthRosters) state.monthRosters = {};
  const key = monthKey(y,m);
  if(!state.monthRosters[key]) state.monthRosters[key] = [];
  const arr = state.monthRosters[key];
  const idx = arr.indexOf(personId);
  if(idx >= 0) arr.splice(idx,1);
  else arr.push(personId);
  saveState();
  renderEscalaList();
  renderCalendar();
}
function rosterPeopleFor(y, m){
  const ids = (state.monthRosters || {})[monthKey(y,m)] || [];
  return state.people.filter(p => ids.includes(p.id));
}

// ---------- Storage (Firebase Firestore) ----------
// Um único documento guarda todo o estado do app, compartilhado por toda a equipe.
// firebase-config.js (carregado antes deste script) define window.firebaseConfig.
firebase.initializeApp(window.firebaseConfig);
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
const db = firebase.firestore();
// Mantém uma cópia local (IndexedDB) dos dados. Assim, ao reabrir o app depois
// que o sistema operacional descarregou a aba da memória, a tela aparece
// quase instantaneamente com os últimos dados conhecidos, em vez de ficar
// esperando a rede — reduzindo a sensação de "reiniciar do zero".
db.enablePersistence({ synchronizeTabs: true }).catch((err)=>{
  console.warn('Firestore offline persistence indisponível:', err.code);
});
const stateDocRef = db.collection('escala').doc('ops-data');

let applyingRemoteState = false;

function loadState(){
  stateDocRef.onSnapshot(
    (doc) => {
      applyingRemoteState = true;
      if(doc.exists){
        state = Object.assign({}, DEFAULT_STATE, doc.data());
      }else{
        state = Object.assign({}, DEFAULT_STATE);
      }
      // migração: a função "Reestituição" virou "Triagem" (troca o id guardado nos dados salvos)
      let fnMigrated = false;
      (state.people || []).forEach(p => {
        if(Array.isArray(p.functions) && p.functions.includes('restituicao')){
          p.functions = [...new Set(p.functions.map(f => f === 'restituicao' ? 'triagem' : f))];
          fnMigrated = true;
        }
      });
      applyingRemoteState = false;
      render();
      if(fnMigrated) saveState();
    },
    (err) => {
      console.error('Firestore onSnapshot error', err);
      showToast('Sem conexão com o banco de dados.');
    }
  );
}

async function saveState(){
  // Evita re-salvar o que acabamos de receber do servidor (loop desnecessário).
  if(applyingRemoteState) return;
  try{
    // JSON round-trip remove campos "undefined", que o Firestore não aceita.
    const payload = JSON.parse(JSON.stringify(state));
    await stateDocRef.set(payload);
  }catch(e){
    console.error('Firestore save error', e);
    showToast('Erro ao salvar. Verifique sua conexão.');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ---------- Availability logic ----------
function isOff(personId, dateStr){
  const arr = state.offDays[personId] || [];
  return arr.includes(dateStr);
}
function isRequestedOff(personId, dateStr){
  const arr = state.requestedOffDays[personId] || [];
  return arr.includes(dateStr);
}
function markRequestedOff(personId, dateStr){
  if(!state.requestedOffDays[personId]) state.requestedOffDays[personId] = [];
  const arr = state.requestedOffDays[personId];
  if(!arr.includes(dateStr)) arr.push(dateStr);
  saveState();
}
function unmarkRequestedOff(personId, dateStr){
  if(!state.requestedOffDays[personId]) return;
  state.requestedOffDays[personId] = state.requestedOffDays[personId].filter(d=>d!==dateStr);
  if(state.requestedOffDays[personId].length===0) delete state.requestedOffDays[personId];
  saveState();
}
function isAbsent(personId, dateStr){
  const arr = state.absences[dateStr] || [];
  return arr.includes(personId);
}
function toggleAbsence(personId, dateStr){
  if(!state.absences[dateStr]) state.absences[dateStr] = [];
  const arr = state.absences[dateStr];
  const idx = arr.indexOf(personId);
  if(idx >= 0) arr.splice(idx,1);
  else arr.push(personId);
  if(arr.length === 0) delete state.absences[dateStr];
  saveState();
  renderDaySheet(dateStr);
  renderCalendar();
}
// Horários conhecidos de cada código (escala de revezamento). Os que não aparecem aqui ficam sem horário.
const SHIFT_TIMES = {
  A:'10:00–16:00', A1:'11:00–15:00', A2:'12:00–15:00', A3:'11:20–15:20', A10:'12:45–18:45',
  B:'22:00–04:00', B1:'23:00–03:00', B2:'23:15–02:15', B3:'21:15–03:15', B4:'23:15–03:15'
};
// Únicos códigos de turno usados: aparecem nos seletores e são os reconhecidos na importação do PDF.
const SHIFT_CODES = ['A','A1','A2','A3','A10','B','B1','B2','B3','B4'];
// ---------- Código de turno (A, A1…A25 = dia · B, B1…B25 = noite) ----------
// A pessoa continua TRABALHANDO nesse dia (não é folga e conta nos dias seguidos), só que num turno
// diferente. Código B = turno da noite: ela não fica disponível para o turno do dia.
function getShiftCode(personId, dateStr){
  return ((state.shiftCodes || {})[dateStr] || {})[personId] || null;
}
function isNightShift(personId, dateStr){
  const c = getShiftCode(personId, dateStr);
  return !!c && c.charAt(0) === 'B';
}
function setShiftCode(personId, dateStr, code){
  if(!state.shiftCodes) state.shiftCodes = {};
  if(code){
    if(!state.shiftCodes[dateStr]) state.shiftCodes[dateStr] = {};
    state.shiftCodes[dateStr][personId] = code;
  }else if(state.shiftCodes[dateStr]){
    delete state.shiftCodes[dateStr][personId];
    if(Object.keys(state.shiftCodes[dateStr]).length === 0) delete state.shiftCodes[dateStr];
  }
  saveState();
}
function getAssignedFn(personId, dateStr){
  return (state.dayAssignments[dateStr] || {})[personId] || null;
}
function setAssignedFn(personId, dateStr, fid){
  if(!state.dayAssignments[dateStr]) state.dayAssignments[dateStr] = {};
  const current = state.dayAssignments[dateStr][personId];
  if(current === fid){
    delete state.dayAssignments[dateStr][personId]; // toggle off = "não definido"
  }else{
    state.dayAssignments[dateStr][personId] = fid;
  }
  if(Object.keys(state.dayAssignments[dateStr]).length === 0) delete state.dayAssignments[dateStr];
  saveState();
  renderDaySheet(dateStr);
  renderCalendar();
}
function toggleOffDay(personId, dateStr){
  if(!state.offDays[personId]) state.offDays[personId] = [];
  const arr = state.offDays[personId];
  const idx = arr.indexOf(dateStr);
  if(idx >= 0){
    arr.splice(idx,1);
    unmarkRequestedOff(personId, dateStr);
  }else{
    arr.push(dateStr);
    if(getShiftCode(personId, dateStr)) setShiftCode(personId, dateStr, null); // folga e turno diferente não convivem
  }
  saveState();
}

// ---------- Regra da empresa: máximo de dias de trabalho seguidos ----------
// No 7º dia seguido (útil ou não), a folga é obrigatória. Isso é checado sempre
// que uma alteração torna um dia "de trabalho" para alguém (remover folga,
// remover falta), para pegar erros de troca antes que virem 7 dias seguidos.
const MAX_CONSECUTIVE_WORK_DAYS = 6;
// Regra da empresa: cada pessoa precisa ter entre 8 e 9 folgas por mês.
const MIN_OFF_DAYS_PER_MONTH = 8;
const MAX_OFF_DAYS_PER_MONTH = 9;
// Quem entra no meio do mês (acrescentado à escala já feita) não precisa ter o mínimo de folgas:
// recebe só o que couber nos dias que restam. Isso fica guardado por mês.
function isMidMonthJoiner(personId, y, m){
  return ((state.midMonthJoiners || {})[monthKey(y, m)] || []).includes(personId);
}
function minOffsFor(personId, y, m){
  return isMidMonthJoiner(personId, y, m) ? 0 : MIN_OFF_DAYS_PER_MONTH;
}

function offDaysCountInMonth(personId, year, month){ // month 0-indexado
  const arr = state.offDays[personId] || [];
  return arr.filter(dateStr=>{
    const [y, m] = dateStr.split('-').map(Number);
    return y === year && (m-1) === month;
  }).length;
}

function addDaysToIso(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  return iso(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function formatDateBR(dateStr){
  const [, m, d] = dateStr.split('-');
  return `${d}/${m}`;
}
function isRosteredOnDate(personId, dateStr){
  const [y, m] = dateStr.split('-').map(Number);
  return isInRoster(personId, y, m-1);
}
function isWorkingDay(personId, dateStr){
  return isRosteredOnDate(personId, dateStr) && !isOff(personId, dateStr) && !isAbsent(personId, dateStr);
}
// Retorna { start, end, length } da sequência de dias de trabalho seguidos que
// contém dateStr, ou null se dateStr não é um dia de trabalho para essa pessoa.
// Só conta como "dia de trabalho" se o mês dessa pessoa já tem escala lançada (pelo menos uma folga).
// Mês vazio = escala ainda não feita; senão ele contaria como 30 dias seguidos trabalhando.
function monthHasSchedule(personId, dateStr){
  const [y, m] = dateStr.split('-').map(Number);
  return offDaysCountInMonth(personId, y, m - 1) > 0;
}
function consecutiveWorkStreak(personId, dateStr){
  const wd = ds => isWorkingDay(personId, ds) && monthHasSchedule(personId, ds);
  if(!wd(dateStr)) return null;
  let start = dateStr, end = dateStr, length = 1;
  let cursor = addDaysToIso(dateStr, -1);
  while(wd(cursor) && length < 60){ start = cursor; length++; cursor = addDaysToIso(cursor, -1); }
  cursor = addDaysToIso(dateStr, 1);
  while(wd(cursor) && length < 60){ end = cursor; length++; cursor = addDaysToIso(cursor, 1); }
  return { start, end, length };
}
// Chamar logo depois de uma alteração que TRANSFORMOU dateStr num dia de trabalho
// para personId (removeu folga ou removeu falta). Se isso estourar o limite de
// dias seguidos, avisa e oferece desfazer a alteração via revertFn.
function warnIfConsecutiveViolation(personId, dateStr, revertFn){
  const streak = consecutiveWorkStreak(personId, dateStr);
  if(!streak || streak.length <= MAX_CONSECUTIVE_WORK_DAYS) return;
  const person = state.people.find(p=>p.id===personId);
  const name = person ? person.name : 'Essa pessoa';
  const keep = confirm(
    `Atenção: com essa alteração, ${name} vai trabalhar ${streak.length} dias seguidos `+
    `(${formatDateBR(streak.start)} a ${formatDateBR(streak.end)}) — passa do limite de ${MAX_CONSECUTIVE_WORK_DAYS}.\n\n`+
    `Manter mesmo assim?`
  );
  if(!keep && typeof revertFn === 'function'){
    revertFn();
    showToast('Alteração desfeita para respeitar o limite de dias seguidos.');
  }else if(keep){
    showToast('Alteração mantida — atenção ao limite de dias seguidos.');
  }
}

// ---------- Duplas de cobertura: pessoas que não podem folgar no mesmo dia ----------
// Cada restrição é um grupo de 2 ou mais pessoas que não podem folgar no mesmo dia.
// Restrições antigas (formato {a, b}) continuam funcionando.
function pairMembers(pair){
  if(Array.isArray(pair.members)) return pair.members;
  return [pair.a, pair.b].filter(Boolean);
}
// Regra automática: os operadores nunca folgam juntos (sempre precisa ter ao menos um
// operador disponível). Vale mesmo sem restrição cadastrada. Obs.: hoje só o turno do dia
// é escalado; o turno da noite ainda não é tratado (ver pergunta pendente sobre troca dia/noite).
function operatorAutoGroup(){
  return state.people.filter(p => (p.functions||[]).includes('operador')).map(p => p.id);
}
// Restrições cadastradas + a regra automática dos operadores (sem repetir grupos iguais).
function allCoverageGroups(){
  const seen = new Set(), out = [];
  const add = (members) => {
    if(members.length < 2) return;
    const key = [...members].sort().join('|');
    if(seen.has(key)) return;
    seen.add(key); out.push(members);
  };
  (state.coveragePairs || []).forEach(pair => add(pairMembers(pair)));
  add(operatorAutoGroup());
  return out;
}
function pairPartnersOf(personId){
  const partners = new Set();
  allCoverageGroups().forEach(members=>{
    if(members.includes(personId)) members.forEach(m=>{ if(m !== personId) partners.add(m); });
  });
  return [...partners];
}
function joinNamesPT(ids){
  const names = ids.map(personName);
  if(names.length <= 1) return names.join('');
  return names.slice(0, -1).join(', ') + ' e ' + names[names.length-1];
}
function personName(personId){
  const p = state.people.find(p=>p.id===personId);
  return p ? p.name : 'Essa pessoa';
}
// Quantas pessoas ficam disponíveis (e quantas da Limpeza) num dia, considerando quem está na escala do mês.
// offPid: pessoa que está sendo marcada de folga agora (se ainda não estiver marcada), para prever o resultado.
function dayAvailability(dateStr, offPid){
  const y = parseInt(dateStr.slice(0,4),10), m = parseInt(dateStr.slice(5,7),10) - 1;
  const roster = rosterPeopleFor(y, m);
  // Mesma regra do rodapé "Disponíveis" da tabela: só contam Triagem, Limpeza e Porão
  // (Líder e Operador ficam de fora). Escala sem ninguém dessas funções: conta todo mundo.
  const ramp = roster.filter(p => GEN_RAMP_GROUPS.includes(genGroupOf(p)));
  const counted = ramp.length ? ramp : roster;
  const working = counted.filter(p => p.id !== offPid && !isOff(p.id, dateStr));
  const clean = roster.filter(p => genGroupOf(p) === 'limpeza');
  const cleanWorking = clean.filter(p => p.id !== offPid && !isOff(p.id, dateStr));
  return { total: working.length, roster: roster.length, clean: cleanWorking.length, cleanRoster: clean.length };
}
function availText(a){
  return `${a.total} disponíve${a.total === 1 ? 'l' : 'is'} no dia` + (a.cleanRoster ? ` (${a.clean} da Limpeza)` : '');
}
// Retorna os IDs dos parceiros de dupla que também estão de folga em dateStr.
function coverageConflictsFor(personId, dateStr){
  // só vale para quem está na escala do mês desse dia
  const y = parseInt(dateStr.slice(0,4),10), m = parseInt(dateStr.slice(5,7),10) - 1;
  const rosterIds = new Set(rosterPeopleFor(y, m).map(p => p.id));
  return pairPartnersOf(personId).filter(pid => rosterIds.has(pid) && isOff(pid, dateStr));
}


function renderCalendar(){

// Lista, em vermelho, todo dia do mês em que uma dupla de cobertura folga junto.
function renderCoverageConflictBanner(){
  const el = document.getElementById('coverageConflictBanner');
  if(!el) return;
  el.innerHTML = '';
  const groups = allCoverageGroups();
  if(!isMonthPublished(calYear, calMonth) || !groups.length) return;
  const rosterIds = new Set(rosterPeopleFor(calYear, calMonth).map(p => p.id));
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = iso(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());
  const items = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = iso(calYear, calMonth, d);
    if(dateStr < todayStr) continue; // dia já passou — não mostra mais o aviso
    groups.forEach(members=>{
      // só conta quem está na escala deste mês (ex.: se um operador não entrou, não há conflito)
      const inRoster = members.filter(pid => rosterIds.has(pid));
      if(inRoster.length < 2) return;
      const offTogether = inRoster.filter(pid => isOff(pid, dateStr));
      if(offTogether.length >= 2){
        items.push(`${joinNamesPT(offTogether)} estão de folga no dia ${formatDateBR(dateStr)}`);
      }
    });
  }
  el.innerHTML = items.map(txt => `<div class="conflict-banner-item">${txt}</div>`).join('');
}

// ---------- Month transition animation + swipe navigation ----------
// direction: 'next' (content slides out to the left, new content enters from the right)
//            'prev' (content slides out to the right, new content enters from the left)
function animateMonthChange(el, direction, updateFn){
  if(!el || el.dataset.animating === '1') return;
  el.dataset.animating = '1';

  const OUT_MS = 140;
  const IN_MS = 240;
  const exitX = direction === 'next' ? -22 : 22;
  const enterX = direction === 'next' ? 22 : -22;

  el.style.transition = `transform ${OUT_MS}ms cubic-bezier(.4,0,1,1), opacity ${OUT_MS}ms ease`;
  el.style.transform = `translateX(${exitX}px)`;
  el.style.opacity = '0';

  setTimeout(()=>{
    updateFn();

    el.style.transition = 'none';
    el.style.transform = `translateX(${enterX}px)`;
    el.style.opacity = '0';

    // force reflow so the next transition actually animates
    void el.offsetWidth;

    el.style.transition = `transform ${IN_MS}ms cubic-bezier(.22,.61,.36,1), opacity ${IN_MS}ms ease`;
    el.style.transform = 'translateX(0)';
    el.style.opacity = '1';

    setTimeout(()=>{ el.dataset.animating = '0'; }, IN_MS);
  }, OUT_MS);
}

function stepMonth(direction){
  if(direction === 'next'){ calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } }
  else { calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } }
  saveUiState();
}

}
function goEscala(direction){

    renderEscalaList();

}

function renderDaySheet(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dateObj = new Date(y, m-1, d);
  const weekday = dateObj.toLocaleDateString('pt-BR', { weekday: 'long' });
  document.getElementById('sheetTitle').textContent = `${d} de ${MONTHS[m-1]}`;
  document.getElementById('sheetSubtitle').textContent = weekday.charAt(0).toUpperCase()+weekday.slice(1);

  const body = document.getElementById('sheetBody');
  let html = '';

  const rosterPeople = rosterPeopleFor(y, m-1);

  if(state.people.length === 0){
    html += `<div class="empty-note">Nenhuma pessoa cadastrada ainda. Adicione sua equipe na aba "Equipe".</div>`;
    body.innerHTML = html;
    return;
  }
  if(rosterPeople.length === 0){
    html += `<div class="empty-note">Ninguém foi incluído na escala de ${MONTHS[m-1]} ainda. Vá na aba "Escala" e inclua sua equipe neste mês.</div>`;
    body.innerHTML = html;
    return;
  }

  const disponiveis = [];
  const folgas = [];
  const noturnos = [];
  sortPeopleEscala(rosterPeople).forEach(p=>{
    const off = isOff(p.id, dateStr);
    const absent = isAbsent(p.id, dateStr);
    if(off && !absent) folgas.push(p);
    else if(!absent && isNightShift(p.id, dateStr)) noturnos.push(p);
    else disponiveis.push(p);
  });

  function chipHtml(p, interactive){
    const assigned = interactive ? getAssignedFn(p.id, dateStr) : null;
    const pickable = pickableFunctions(p);
    const baseList = pickable;
    return baseList.map(fid=>{
      const f = fnById(fid);
      if(!f) return '';
      if(interactive && baseList.length > 1){
        const isActive = assigned === fid;
        const dim = assigned && !isActive;
        return `<span class="fn-chip fn-chip-pick ${isActive?'picked':''}" data-pid="${p.id}" data-fid="${fid}" style="background:${f.hex}; ${dim?'opacity:0.4;':''} cursor:pointer;">${f.name}${isActive?' ✓':''}</span>`;
      }
      return `<span class="fn-chip" style="background:${f.hex}">${f.name}</span>`;
    }).join('');
  }

  function rowHtml(p, kind){
    const off = isOff(p.id, dateStr);
    const absent = isAbsent(p.id, dateStr);
    const code = getShiftCode(p.id, dateStr);
    const available = !off && !absent && !(code && code.charAt(0) === 'B');
    let rowClass = 'person-row';
    let statusText = '';
    if(off && !absent){ rowClass += ' folga'; statusText = 'Folga'; }
    if(absent){ rowClass += ' falta'; statusText = off ? 'Falta (folga)' : 'Falta'; }
    if(code && !off && !absent) statusText = `Turno ${code}`;
    const multi = pickableFunctions(p).length > 1;
    const showFaltaBtn = !off || absent; // esconde "Marcar falta" quando a pessoa está de folga (e ainda não tem falta marcada)
    return `<div class="${rowClass}">
      <div class="person-info">
        <span class="person-name clickable-name" data-pid="${p.id}">${p.name}</span>
        ${p.registration ? `<span class="person-reg-wrap"><span class="person-reg">${p.registration}</span><button class="copy-reg-btn" data-reg="${p.registration}" title="Copiar matrícula" aria-label="Copiar matrícula"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></span>` : ''}
        <div class="fn-chips">${chipHtml(p, available)}</div>
        ${(available && multi) ? '<span class="status-tag" style="color:var(--text-faint);">Toque na função de hoje</span>' : ''}
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${statusText ? `<span class="status-tag">${statusText}</span>` : ''}
        ${showFaltaBtn ? `<button class="falta-toggle ${absent?'active':''}" data-pid="${p.id}">${absent ? 'Remover falta' : 'Marcar falta'}</button>` : ''}
      </div>
    </div>`;
  }

  html += `<div class="section-label">Disponíveis (${disponiveis.filter(p=>!isAbsent(p.id,dateStr)).length})</div>`;
  html += disponiveis.length ? disponiveis.map(p=>rowHtml(p,'disp')).join('') : `<div class="empty-note">Ninguém disponível.</div>`;

  if(noturnos.length){
    html += `<div class="section-label">Em outro turno (${noturnos.length})</div>`;
    html += noturnos.map(p=>rowHtml(p,'noturno')).join('');
  }
  if(folgas.length){
    html += `<div class="section-label">De folga (${folgas.length})</div>`;
    html += folgas.map(p=>rowHtml(p,'folga')).join('');
  }

  body.innerHTML = html;
  body.querySelectorAll('.falta-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.dataset.pid;
      const wasAbsent = isAbsent(pid, dateStr);
      toggleAbsence(pid, dateStr);
      if(wasAbsent){
        // "Remover falta" — a pessoa volta a trabalhar nesse dia, checamos a regra.
        warnIfConsecutiveViolation(pid, dateStr, ()=> toggleAbsence(pid, dateStr));
      }
    });
  });
  body.querySelectorAll('.fn-chip-pick').forEach(chip=>{
    chip.addEventListener('click', ()=> setAssignedFn(chip.dataset.pid, dateStr, chip.dataset.fid) );
  });
  body.querySelectorAll('.copy-reg-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const reg = btn.dataset.reg;
      try{
        await navigator.clipboard.writeText(reg);
        showToast('Matrícula copiada.');
      }catch(e){
        showToast('Não foi possível copiar. Tente novamente.');
      }
    });
  });
}

// ---------- Seletor de código de turno ----------
let shiftPid = null, shiftDate = null, shiftSeries = 'A';
function renderShiftPicker(){

// ---------- Tabs ----------
const TAB_ORDER = ['calendario', 'escala', 'equipe'];

function setActiveTabInstant(tabName){
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab === tabName));
  document.querySelectorAll('.view').forEach(v=> v.classList.toggle('active', v.id === 'view-'+tabName));
  saveUiState();
}

// Slides the outgoing tab out and the incoming tab in — same fluid-but-snappy
// timing as the month transitions. This is the ONLY place swipe navigation acts:
// moving between tabs, never between months inside a tab.
function animateTabChange(tabName, direction){
  const mainEl = document.querySelector('main');
  if(mainEl.dataset.animating === '1') return;
  const currentView = document.querySelector('.view.active');
  if(!currentView || currentView.id === 'view-'+tabName) return;
  mainEl.dataset.animating = '1';

  const OUT_MS = 140;
  const IN_MS = 240;
  const exitX = direction === 'next' ? -26 : 26;
  const enterX = direction === 'next' ? 26 : -26;

  currentView.style.transition = `transform ${OUT_MS}ms cubic-bezier(.4,0,1,1), opacity ${OUT_MS}ms ease`;
  currentView.style.transform = `translateX(${exitX}px)`;
  currentView.style.opacity = '0';

  setTimeout(()=>{
    setActiveTabInstant(tabName);
    currentView.style.transition = '';
    currentView.style.transform = '';
    currentView.style.opacity = '';

    const newView = document.querySelector('.view.active');
    newView.style.transition = 'none';
    newView.style.transform = `translateX(${enterX}px)`;
    newView.style.opacity = '0';
    void newView.offsetWidth; // force reflow so the transition below actually animates

    newView.style.transition = `transform ${IN_MS}ms cubic-bezier(.22,.61,.36,1), opacity ${IN_MS}ms ease`;
    newView.style.transform = 'translateX(0)';
    newView.style.opacity = '1';

    setTimeout(()=>{ mainEl.dataset.animating = '0'; }, IN_MS);
  }, OUT_MS);
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const targetTab = btn.dataset.tab;
    const currentTab = document.querySelector('nav.tabs button.active').dataset.tab;
    if(targetTab === currentTab) return;
    const direction = TAB_ORDER.indexOf(targetTab) > TAB_ORDER.indexOf(currentTab) ? 'next' : 'prev';
    animateTabChange(targetTab, direction);
  });
});
