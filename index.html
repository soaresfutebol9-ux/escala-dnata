// ---------- Importar escala de um PDF (dnata) ----------
// Lê o PDF inteiramente no navegador (nenhum dado sai do celular), localiza a
// linha de cabeçalho com os números dos dias (01, 02, 03...), localiza cada
// colaborador pela matrícula e procura, na linha dele, células cujo texto seja
// EXATAMENTE "F" (folga regulamentar) ou "FA" (folga agrupada). Também reconhece os
// códigos de turno (A, A1…A25 = dia · B, B1…B25 = noite) escritos nas células dos dias e
// guarda cada um no dia e no colaborador certos. Qualquer outro texto (J, CH, etc.) é ignorado.
const MONTH_NAMES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

async function extractPdfTextItems(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const items = [];
  for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });
    // disableCombineTextItems: o pdf.js não junta células vizinhas num texto só (ex.: "B4 B4 B4 F"),
    // que fazia perder folgas e códigos quando as células ficam coladas no PDF.
    const content = await page.getTextContent({ disableCombineTextItems: true });
    content.items.forEach(it=>{
      const raw = it.str || '';
      const text = raw.trim();
      if(!text) return;
      const x0 = it.transform[4], w0 = it.width || 0;
      const top = viewport.height - it.transform[5]; // topo->baixo, igual pdfplumber
      // Garantia extra: se mesmo assim vier "B4 F" num texto só, separa em um item por célula
      // (só quando todas as partes são F, FA ou código de turno), com a posição proporcional.
      const toks = text.split(/\s+/);
      if(toks.length > 1 && w0 > 0 && toks.every(t => /^(F|FA|[ABab]\d{0,2})$/.test(t))){
        const lead = raw.length - raw.replace(/^\s+/, '').length;
        let pos = 0;
        const full = raw.length || 1;
        toks.forEach(t => {
          const at = raw.indexOf(t, lead + pos);
          items.push({ text: t, x: x0 + w0 * (at / full), w: w0 * (t.length / full), top, page: pageNum });
          pos = (at - lead) + t.length;
        });
        return;
      }
      items.push({ text, x: x0, w: w0, top, page: pageNum });
    });
  }
  return items;
}

function groupItemsIntoRows(items, tolerance){
  // Encadeamento: cada item entra na linha se estiver perto do ÚLTIMO item já
  // agrupado nela (não sempre do primeiro). Isso evita que uma linha se
  // "quebre" em duas quando o conteúdo da célula (matrícula, código de turno
  // etc.) fica alguns pontos acima ou abaixo do restante da mesma linha visual.
  const sorted = [...items].sort((a,b)=> a.page - b.page || a.top - b.top || a.x - b.x);
  const rows = [];
  let current = null;
  sorted.forEach(it=>{
    if(current && current.page === it.page && Math.abs(it.top - current.lastTop) <= tolerance){
      current.items.push(it);
      current.lastTop = it.top;
    } else {
      current = { page: it.page, top: it.top, lastTop: it.top, items: [it] };
      rows.push(current);
    }
  });
  return rows;
}

function findDayHeaderRow(rows){
  let best = null;
  rows.forEach(row=>{
    const nums = row.items
      .filter(it => /^\d{1,2}$/.test(it.text))
      .map(it => ({ day: parseInt(it.text,10), x: it.x, cx: it.x + (it.w || 0) / 2 }))
      .sort((a,b)=> a.x - b.x);
    if(nums.length < 15) return;
    // valida que forma uma sequência crescente 1,2,3... (permite pequenas falhas)
    let hits = 0;
    nums.forEach((n,i)=>{ if(n.day === i+1) hits++; });
    if(hits >= nums.length - 2 && nums[0].day === 1 && (!best || nums.length > best.nums.length)){
      best = { row, nums };
    }
  });
  return best;
}

function detectMonthYear(items){
  let month = null, year = null;
  for(const it of items){
    const lower = it.text.toLowerCase();
    const idx = MONTH_NAMES_PT.findIndex(m => lower === m || lower.startsWith(m.slice(0,4)));
    if(idx >= 0){ month = idx; break; }
  }
  const yearItem = items.find(it => /^20\d{2}$/.test(it.text));
  if(yearItem) year = parseInt(yearItem.text, 10);
  return { month, year };
}

// Código de turno válido: A ou B, com número de 1 a 25 (aceita zero à esquerda: A01 vira A1).
const SHIFT_CODE_RE = /^([AB])(?:0?([1-9])|(1\d|2[0-5]))?$/;
function normalizeShiftCode(text){
  const m = SHIFT_CODE_RE.exec(String(text == null ? '' : text).replace(/\s+/g, '').toUpperCase());
  const code = m ? m[1] + (m[2] || m[3] || '') : null;
  return code && SHIFT_CODES.includes(code) ? code : null;
}
// Alguns PDFs separam a letra e o número em dois pedaços de texto colados ("A" + "1"): junta os dois.
function mergeSplitCodeItems(rowItems){
  const sorted = [...rowItems].sort((a, b) => a.x - b.x);
  const out = [];
  for(let i = 0; i < sorted.length; i++){
    const cur = sorted[i], nxt = sorted[i + 1];
    if(nxt && /^[ABab]$/.test(cur.text) && /^\d{1,2}$/.test(nxt.text) && (cur.w || 0) > 0 && (nxt.x - (cur.x + cur.w)) <= 1.5){
      out.push({ text: cur.text + nxt.text, x: cur.x, w: cur.w + (nxt.w || 0), top: cur.top, page: cur.page });
      i++;
    }else{
      out.push(cur);
    }
  }
  return out;
}

async function parseEscalaPdf(file){
  const items = await extractPdfTextItems(file);
  return parseEscalaItems(items);
}
function parseEscalaItems(items){
  const rows = groupItemsIntoRows(items, 3);
  const headerInfo = findDayHeaderRow(rows);
  if(!headerInfo) throw new Error('Não encontrei a linha com os números dos dias (01, 02, 03...) nesse PDF.');
  const dayCols = headerInfo.nums; // [{day, x}], já ordenado por x
  const spacing = dayCols.length > 1
    ? (dayCols[dayCols.length-1].x - dayCols[0].x) / (dayCols[dayCols.length-1].day - dayCols[0].day)
    : 9;
  const tolerance = spacing / 2;
  const totalDaysInPdf = dayCols[dayCols.length-1].day;

  const { month: detectedMonth, year: detectedYear } = detectMonthYear(items);

  const peopleFound = []; // { registration, name, days:[int,...] }
  rows.forEach(row=>{
    if(row.page !== headerInfo.row.page) return;
    if(row.top <= headerInfo.row.top) return; // só linhas abaixo do cabeçalho
    // matrícula fica sempre bem à esquerda da tabela — usamos a posição x do
    // primeiro item numérico de 5 a 7 dígitos entre os itens mais à esquerda da linha.
    const leftMost = [...row.items].sort((a,b)=>a.x-b.x)[0];
    const matriculaItem = /^\d{5,7}$/.test(leftMost?.text) ? leftMost : null;
    if(!matriculaItem) return;
    const registration = matriculaItem.text;
    const nameItems = row.items
      .filter(it => it.x > matriculaItem.x && it.x < dayCols[0].x - spacing*2 && /[A-Za-zÀ-ÿ]/.test(it.text))
      .sort((a,b)=>a.x-b.x);
    const name = nameItems.map(it=>it.text).join(' ');

    const fDays = [];
    row.items.forEach(it=>{
      if(it.text !== 'F' && it.text !== 'FA') return;
      let closest = null, closestDist = Infinity;
      dayCols.forEach(dc=>{
        const dist = Math.abs(dc.x - it.x);
        if(dist < closestDist){ closestDist = dist; closest = dc; }
      });
      if(closest && closestDist <= tolerance) fDays.push(closest.day);
    });
    // códigos de turno (A, A1…A25 = dia · B, B1…B25 = noite) escritos nas células dos dias
    // A coluna do dia é escolhida pelo CENTRO do texto (códigos de 1, 2 ou 3 caracteres têm larguras diferentes).
    const codes = {};
    mergeSplitCodeItems(row.items).forEach(it=>{
      const t = normalizeShiftCode(it.text);
      if(!t) return;
      const cx = it.x + (it.w || 0) / 2;
      let closest = null, closestDist = Infinity;
      dayCols.forEach(dc=>{
        const dist = Math.abs(dc.cx - cx);
        if(dist < closestDist){ closestDist = dist; closest = dc; }
      });
      if(closest && closestDist <= tolerance && !fDays.includes(closest.day)) codes[closest.day] = t;
    });
    if(fDays.length || Object.keys(codes).length){
      const existing = peopleFound.find(p=>p.registration===registration);
      if(existing){ existing.days.push(...fDays); Object.assign(existing.codes, codes); }
      else peopleFound.push({ registration, name, days: [...new Set(fDays)].sort((a,b)=>a-b), codes });
    }
  });

  return { peopleFound, detectedMonth, detectedYear, totalDaysInPdf };
}

// Compara os dias de folga do PDF com os que já estão salvos no app para aquele mês.
// added = no PDF e ainda não salvos · removed = salvos no app mas ausentes no PDF.
function importDiff(person, pdfDays, year, month){
  const prefix = monthKey(year, month) + '-';
  const saved = (state.offDays[person.id] || []).filter(ds => ds.startsWith(prefix))
    .map(ds => parseInt(ds.slice(8, 10), 10)).filter(Number.isInteger);
  const pdf = new Set(pdfDays), cur = new Set(saved);
  return {
    added: [...pdf].filter(d => !cur.has(d)).sort((a,b)=>a-b),
    removed: [...cur].filter(d => !pdf.has(d)).sort((a,b)=>a-b)
  };
}
function isPersonInRosterForMonth(personId, year, month){
  return ((state.monthRosters||{})[monthKey(year, month)] || []).includes(personId);
}

function renderImportMatchedList(){
  const monthSel = document.getElementById('importMonthSelect');
  const yearInput = document.getElementById('importYearInput');
  const container = document.getElementById('importMatchedList');
  if(!monthSel || !container || !pendingImport) return;
  const month = parseInt(monthSel.value, 10);
  const year = parseInt(yearInput.value, 10);
  const matched = pendingImport.matched;

  if(!matched.length){
    container.innerHTML = `<p class="mini-hint">Nenhuma folga (F/FA) encontrada pra ninguém já cadastrado. Confira se é o PDF certo.</p>`;
    return;
  }
  const validYear = Number.isInteger(year) && year >= 2020 && year <= 2100 && Number.isInteger(month);
  const daysInMonth = validYear ? new Date(year, month + 1, 0).getDate() : 31;

  const rows = matched.map(m=>{
    const days = [...new Set(m.days)].filter(d => d >= 1 && d <= daysInMonth).sort((a,b)=>a-b);
    const diff = validYear ? importDiff(m.person, days, year, month) : { added: [], removed: [] };
    return { m, days, diff, changed: diff.added.length + diff.removed.length > 0 };
  });
  const divergent = rows.filter(r => r.changed).length;

  let html = `<div class="imp-title">Folgas encontradas <span>${matched.length}</span>${
    divergent ? `<span class="imp-warn">${divergent} com divergência</span>` : `<span class="imp-ok">✓ tudo igual à escala</span>`}</div>`;
  rows.forEach(({ m, days, diff, changed })=>{
    const editing = importEditingReg === m.reg;
    const inRoster = validYear && isPersonInRosterForMonth(m.person.id, year, month);
    const name = genEsc(m.person.name);

    let body;
    if(editing){
      let grid = '';
      for(let d = 1; d <= daysInMonth; d++){
        grid += `<button type="button" class="imp-day ${days.includes(d) ? 'on' : ''}" data-imp-day="${d}" data-imp-reg="${m.reg}">${d}</button>`;
      }
      body = `<div class="imp-grid">${grid}</div>`;
    }else{
      const all = [...new Set([...days, ...diff.removed])].sort((a,b)=>a-b);
      const chips = all.map(d => {
        const cls = diff.added.includes(d) ? 'new' : (diff.removed.includes(d) ? 'gone' : '');
        return `<span class="imp-chip ${cls}">${d}</span>`;
      }).join('');
      body = chips ? `<div class="imp-chips">${chips}</div>` : `<span class="status-tag" style="color:var(--text-faint);">Sem folgas</span>`;
      if(changed){
        const parts = [];
        if(diff.added.length) parts.push(`<span style="color:var(--accent);">+${diff.added.length} nova${diff.added.length > 1 ? 's' : ''}</span>`);
        if(diff.removed.length) parts.push(`<span style="color:var(--c-falta);">−${diff.removed.length} removida${diff.removed.length > 1 ? 's' : ''}</span>`);
        body += `<span class="status-tag">${parts.join(' · ')}</span>`;
      }else if(days.length){
        body += `<span class="status-tag" style="color:var(--c-disponivel);">✓ igual à escala</span>`;
      }
    }
    const codeDays = Object.keys(m.codes || {}).map(Number).filter(d => d >= 1 && d <= daysInMonth && !days.includes(d)).sort((a,b)=>a-b);
    if(codeDays.length && !editing){
      body += `<div class="imp-chips">${codeDays.map(d => `<span class="imp-chip" style="background:rgba(167,139,250,0.18); color:#A78BFA;">${d} · ${m.codes[d]}</span>`).join('')}</div><span class="status-tag" style="color:#A78BFA;">${codeDays.length} código${codeDays.length > 1 ? 's' : ''} de turno</span>`;
    }
    const rosterNote = (!inRoster && (days.length || codeDays.length) && !editing)
      ? `<span class="status-tag" style="color:var(--c-desejada);">Entra na escala do mês</span>` : '';
    html += `<div class="team-card imp-card">
      <div class="info">
        <span class="name">${name}</span>
        ${body}
        ${rosterNote}
      </div>
      <button type="button" class="icon-btn-sm" data-imp-edit="${m.reg}" title="${editing ? 'Concluir' : 'Editar folgas'}" aria-label="${editing ? 'Concluir edição de' : 'Editar folgas de'} ${name}">${editing ? '✓' : '✎'}</button>
    </div>`;
  });
  container.innerHTML = html;
}

function renderImportReviewBody(result){
  const { peopleFound, detectedMonth, detectedYear, totalDaysInPdf } = result;

  // Se já existe seleção de mês/ano na tela (ex: usuário mudou, ou estamos
  // re-renderizando após cadastrar alguém), preserva o que já estava escolhido.
  const prevMonthSel = document.getElementById('importMonthSelect');
  const prevYearInput = document.getElementById('importYearInput');
  const currentMonth = prevMonthSel ? parseInt(prevMonthSel.value, 10) : detectedMonth;
  const currentYear = prevYearInput ? parseInt(prevYearInput.value, 10) : (detectedYear || todayObj.getFullYear());

  // Casa cada matrícula encontrada no PDF com uma pessoa já cadastrada no app.
  const matched = [];
  const unmatchedRegs = [];
  const normalize = s => (s||'').replace(/\D/g, '');
  peopleFound.forEach(pf=>{
    const person = state.people.find(p => normalize(p.registration) === normalize(pf.registration))
      || state.people.find(p => p.id === importRegAlias[normalize(pf.registration)]);
    if(person){
      const reg = normalize(pf.registration);
      const days = importDayEdits[reg] ? importDayEdits[reg] : pf.days;
      matched.push({ person, reg, days: [...days], codes: { ...(pf.codes || {}) }, pdfName: pf.name });
    }
    else unmatchedRegs.push(pf);
  });
  const matchedIds = new Set(matched.map(m=>m.person.id));
  const noDataFound = state.people.filter(p => p.registration && !matchedIds.has(p.id));

  pendingImport = { matched, month: currentMonth, year: currentYear, totalDaysInPdf, result };

  const monthOptions = MONTH_NAMES_PT.map((m,i)=>
    `<option value="${i}" ${i===currentMonth?'selected':''}>${m.charAt(0).toUpperCase()+m.slice(1)}</option>`
  ).join('');

  let html = `
    <div style="margin-bottom:14px;">
      <label style="font-size:12px; color:var(--text-faint); display:block; margin-bottom:4px;">Mês detectado no PDF</label>
      <div style="display:flex; gap:8px;">
        <select id="importMonthSelect" style="flex:1; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px;">${monthOptions}</select>
        <input type="number" id="importYearInput" value="${currentYear}" style="width:90px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px;">
      </div>
    </div>
  `;


  html += `<div id="importMatchedList"></div>`;

  if(noDataFound.length){
    html += `<p style="font-weight:600; margin:14px 0 8px; color:var(--c-falta);">Sem dados no PDF pra ${noDataFound.length} pessoa(s) já cadastrada(s)</p>`;
    html += `<p class="mini-hint" style="margin-bottom:8px;">${noDataFound.map(p=>p.name).join(', ')}</p>`;
  }

  if(unmatchedRegs.length){
    html += `<p style="font-weight:600; margin:14px 0 8px; color:var(--text-faint);">Matrículas no PDF sem cadastro no app — cadastre pra incluir as folgas dela(s)</p>`;
    unmatchedRegs.forEach(u=>{
      html += `<div class="team-card" style="margin-bottom:8px;">
        <div class="info">
          <span class="name">${u.name || 'Sem nome'}</span>
          <span class="status-tag" style="color:var(--text-faint);">Matrícula ${u.registration} · ${u.days.length} dia(s) de folga no PDF</span>
        </div>
        <button class="btn-secondary" data-add-reg="${u.registration}" data-add-name="${u.name||''}">+ Cadastrar</button>
      </div>`;
    });
  }

  document.getElementById('importReviewBody').innerHTML = html;
  renderImportMatchedList();
  document.getElementById('importMonthSelect').addEventListener('change', renderImportMatchedList);
  document.getElementById('importYearInput').addEventListener('input', renderImportMatchedList);
  document.getElementById('importReviewBody').querySelectorAll('[data-add-reg]').forEach(btn=>{
    btn.addEventListener('click', ()=> openPersonModalForImport(btn.dataset.addReg, btn.dataset.addName));
  });
}

  importDayEdits = {};

  importRegAlias = {};
  renderImportReviewBody(result);
  document.getElementById('importReviewModalOverlay').classList.add('active');
  pushOverlay('importReviewModalOverlay');
  // pessoas do PDF que ainda não estão cadastradas: pergunta uma a uma se quer adicionar
  const norm = x => String(x || '').replace(/\D/g, '');
  importAskQueue = (result.peopleFound || []).filter(pf => !state.people.some(p => norm(p.registration) === norm(pf.registration)));
  importAskResume = false;
  if(importAskQueue.length) setTimeout(importAskNext, 350);
}

document.getElementById('confirmImportBtn').addEventListener('click', ()=>{
  if(!pendingImport || !pendingImport.matched.length){
    showToast('Nada pra importar.');
    return;
  }
  const month = parseInt(document.getElementById('importMonthSelect').value, 10);
  const year = parseInt(document.getElementById('importYearInput').value, 10);
  if(!Number.isInteger(month) || !Number.isInteger(year) || year < 2020 || year > 2100){
    showToast('Confira o mês e o ano antes de confirmar.');
    return;
  }
  const daysInTargetMonth = new Date(year, month+1, 0).getDate();
  const key = monthKey(year, month);
  const prefix = key + '-';

  // As folgas do mês de cada pessoa passam a ser exatamente as do PDF (já com as
  // correções feitas no lápis). Folgas de outros meses não são tocadas.
  let addedTotal = 0, removedTotal = 0, codesTotal = 0;
  pendingImport.matched.forEach(m=>{
    const pdfDays = [...new Set(m.days)].filter(d => d >= 1 && d <= daysInTargetMonth).sort((a,b)=>a-b);
    const current = state.offDays[m.person.id] || [];
    const currentMonth = current.filter(ds => ds.startsWith(prefix));
    const next = pdfDays.map(d => iso(year, month, d));
    addedTotal += next.filter(ds => !currentMonth.includes(ds)).length;
    removedTotal += currentMonth.filter(ds => !next.includes(ds)).length;
    state.offDays[m.person.id] = current.filter(ds => !ds.startsWith(prefix)).concat(next);
    // Códigos de turno do PDF: só acrescenta/atualiza os que vieram no PDF (não apaga os que você já marcou)
    const pdfCodes = Object.keys(m.codes || {}).map(Number)
      .filter(d => d >= 1 && d <= daysInTargetMonth && !pdfDays.includes(d));
    pdfCodes.forEach(d => {
      const ds = iso(year, month, d);
      if(!state.shiftCodes) state.shiftCodes = {};
      if(!state.shiftCodes[ds]) state.shiftCodes[ds] = {};
      if(state.shiftCodes[ds][m.person.id] !== m.codes[d]) codesTotal++;
      state.shiftCodes[ds][m.person.id] = m.codes[d];
    });
    // folga e turno diferente não convivem: se o dia virou folga, tira o código
    pdfDays.forEach(d => {
      const ds = iso(year, month, d);
      if(state.shiftCodes && state.shiftCodes[ds] && state.shiftCodes[ds][m.person.id]){
        delete state.shiftCodes[ds][m.person.id];
        if(!Object.keys(state.shiftCodes[ds]).length) delete state.shiftCodes[ds];
      }
    });
    if(next.length || pdfCodes.length){
      // Garante que essa pessoa também participa da escala desse mês.
      if(!state.monthRosters) state.monthRosters = {};
      if(!state.monthRosters[key]) state.monthRosters[key] = [];
      if(!state.monthRosters[key].includes(m.person.id)) state.monthRosters[key].push(m.person.id);
    }
  });

  saveState();
  calYear = year; calMonth = month;
  renderCalendar();
  renderEscalaList();
  renderTeam();
  const codesTxt = codesTotal ? `, ${codesTotal} código${codesTotal === 1 ? '' : 's'} de turno` : '';
  if(!addedTotal && !removedTotal && !codesTotal) showToast('Nada mudou: a escala já estava igual ao PDF.');
  else showToast(`Aplicado: ${addedTotal} folga${addedTotal === 1 ? '' : 's'} nova${addedTotal === 1 ? '' : 's'}, ${removedTotal} removida${removedTotal === 1 ? '' : 's'}${codesTxt}.`);
  requestCloseOverlay('importReviewModalOverlay');
});

// ---------- Gerador automático de escala: motor ----------
// O motor não mexe na tela nem no estado do app: recebe uma "config" pronta e
// devolve as folgas de cada pessoa. Para cada pessoa ele resolve, por
// programação dinâmica, o melhor padrão de folgas possível (respeitando as
// regras duras) dado o que as outras pessoas já têm — e repete isso em rodadas
// até a escala se estabilizar. Assim a carga de folgas fica equilibrada entre
// os dias e as restrições de "não folgar junto" são evitadas.
const GEN_INF = 1e12;
let _genBuf = null;
const genTick = () => new Promise(r => setTimeout(r, 0));

function genMulberry(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function genDayInfo(year, month){
  const D = new Date(year, month + 1, 0).getDate();
  const dows = [];
  for(let d = 1; d <= D; d++) dows.push(new Date(year, month, d).getDay());
  return { D, dows };
}

// Melhor padrão de folgas para UMA pessoa, dado o custo de folgar em cada dia.
// Regras duras: meta de folgas, máx. de dias seguidos, domingo, e folga agrupada (FA).
// FA = 2 folgas seguidas em sáb+dom ou dom+seg. O dia da FA é o SÁBADO (sáb+dom) ou a
// SEGUNDA (dom+seg). Em sáb+dom, o sábado (FA) já zera a contagem de dias seguidos.
// Em dom+seg, o domingo ainda conta na sequência e a segunda (FA) zera. Fora da FA,
// ninguém folga 2 dias seguidos. Exceção: se um dos dois dias é um dia específico pedido, pode.
// Nunca 3 folgas seguidas (o máximo é 2).
// relax: 0 = todas as regras; 1 = (sem uso); 2 = solta a regra do domingo;
// 3 = FA deixa de ser obrigatória; 4 = permite folgas coladas fora da FA (com custo);
// 5 = permite 1 dia seguido a mais. Retorna array de booleanos (true = folga) ou null.
function genBestPattern(P, cfg, costOff, relax){
  const D = cfg.D, dows = cfg.dows;
  const K = Math.min(P.K, 12); // a meta de folgas é exata: nunca sobe, nem afrouxando as outras regras
  const W = cfg.W + (relax >= 5 ? 1 : 0);
  const SW = cfg.SW;
  const sunRule = P.sunRule && relax < 2;
  const maxSun = sunRule ? Math.max(1, P.forcedSundays) : 0;
  const faEnabled = P.faMode === 'must';
  const mustEnd = faEnabled && relax < 3;
  const adjOk = relax >= 4;
  const O = K + 1, R = W + 1, S = maxSun + 1, T = SW + 1, F = 4, A = faEnabled ? 2 : 1;
  // índice do estado: o (folgas), r (dias seguidos), s (domingos de folga), t (domingos seguidos
  // trabalhados), f (0 = ontem trabalhou, 1 = ontem folga solta, 2 = ontem foi o 1º dia da FA, 3 = ontem fechou um par de folgas), a (FA já usada)
  const sF = A, sT = F * A, sS = T * sT, sR = S * sS, sO = R * sR;
  const size = O * sO;
  const need = (D + 1) * size;
  if(!_genBuf || _genBuf.length < need) _genBuf = new Float64Array(need);
  const V = _genBuf;

  const endBase = D * size;
  for(let o = 0; o < O; o++) for(let r = 0; r < R; r++) for(let s = 0; s < S; s++) for(let t = 0; t < T; t++) for(let f = 0; f < F; f++) for(let a = 0; a < A; a++){
    const ok = (o === K) && (!sunRule || s >= 1) && (!mustEnd || a === 1) && f !== 2;
    V[endBase + o*sO + r*sR + s*sS + t*sT + f*sF + a] = ok ? 0 : GEN_INF;
  }

  const res = new Float64Array(6); // [custoFolga, idxFolga, custoFA, idxFA, custoTrab, idxTrab]
  function evalState(d, o, r, s, t, f, a){
    const nxt = (d + 1) * size;
    const dow = dows[d], isSun = dow === 0;
    const forced = P.forced[d];
    const sunOffOk = !sunRule || !isSun || s < maxSun;
    const ns = (sunRule && isSun) ? s + 1 : s;
    const nt = (sunRule && isSun) ? 0 : t;
    res[0] = GEN_INF; res[2] = GEN_INF; res[4] = GEN_INF;
    // folga comum (ou 2º dia da FA, quando f === 2). Nunca 3 folgas seguidas: o máximo são 2,
    // e o par só vale se for FA ou se um dos dois dias for um dia específico pedido.
    // f: 0 = ontem trabalhou, 1 = ontem folga solta, 2 = ontem 1º dia da FA, 3 = ontem fechou um par de folgas
    if(o < K && sunOffOk){
      let ok = false, pen = 0, nf = 1;
      if(f === 0) ok = true;
      else if(f === 2){ ok = true; nf = 3; }
      else if(f === 1){
        if(forced && d > 0 && P.forced[d-1]){ ok = true; nf = 3; }                 // pedidos colados: o usuário quis assim
        else if(forced || (d > 0 && P.forced[d-1])){ ok = true; pen = 30; nf = 3; } // exceção: um dos dois é dia específico
        else if(adjOk){ ok = true; pen = 150; nf = 3; }
      }else if(f === 3){
        if(forced && d > 1 && P.forced[d-1] && P.forced[d-2]){ ok = true; nf = 3; } // sequência toda pedida pelo usuário
      }
      if(ok){
        const idx = (o+1)*sO + 0*sR + ns*sS + nt*sT + nf*sF + a;
        const v = V[nxt + idx];
        if(v < GEN_INF){ res[0] = costOff[d] + pen + v; res[1] = idx; }
      }
    }
    // 1º dia da FA. Sábado (sáb+dom): é o dia da FA e zera a contagem de dias seguidos.
    // Domingo (dom+seg): ainda conta na sequência; quem zera é a segunda (FA).
    if(faEnabled && a === 0 && f === 0 && o < K && sunOffOk && (dow === 6 || dow === 0) && d + 1 < D && (dow === 6 || r < W)){
      const idx = (o+1)*sO + (dow === 6 ? 0 : r+1)*sR + ns*sS + nt*sT + 2*sF + 1;
      const v = V[nxt + idx];
      if(v < GEN_INF){ res[2] = costOff[d] + v; res[3] = idx; }
    }
    // trabalho
    if(f !== 2 && !forced && r < W && (!sunRule || !isSun || t < SW)){
      const wt = (sunRule && isSun) ? t + 1 : t;
      const idx = o*sO + (r+1)*sR + s*sS + wt*sT + 0*sF + a;
      const v = V[nxt + idx];
      if(v < GEN_INF){ res[4] = v; res[5] = idx; }
    }
  }

  for(let d = D - 1; d >= 0; d--){
    const base = d * size;
    // só vale calcular estados alcançáveis: não dá para ter mais folgas que dias passados
    // nem faltar mais folgas do que dias restantes. O resto fica como inviável.
    V.fill(GEN_INF, base, base + size);
    const oLo = Math.max(0, K - (D - d)), oHi = Math.min(K, d);
    for(let o = oLo; o <= oHi; o++) for(let r = 0; r < R; r++) for(let s = 0; s < S; s++) for(let t = 0; t < T; t++) for(let f = 0; f < F; f++) for(let a = 0; a < A; a++){
      evalState(d, o, r, s, t, f, a);
      let best = res[0];
      if(res[2] < best) best = res[2];
      if(res[4] < best) best = res[4];
      V[base + o*sO + r*sR + s*sS + t*sT + f*sF + a] = best;
    }
  }

  let o = 0, r = Math.min(P.carryWork, W), s = 0, t = sunRule ? Math.min(P.carrySun, SW) : 0, f = 0, a = 0;
  if(V[o*sO + r*sR + s*sS + t*sT + f*sF + a] >= GEN_INF) return null;
  const off = new Array(D).fill(false);
  for(let d = 0; d < D; d++){
    evalState(d, o, r, s, t, f, a);
    let idx, isOff;
    if(res[0] <= res[2] && res[0] <= res[4] && res[0] < GEN_INF){ idx = res[1]; isOff = true; }
    else if(res[2] <= res[4] && res[2] < GEN_INF){ idx = res[3]; isOff = true; }
    else if(res[4] < GEN_INF){ idx = res[5]; isOff = false; }
    else return null; // não deveria acontecer se o estado inicial era viável
    off[d] = isOff;
    o = Math.floor(idx / sO); let rem = idx - o * sO;
    r = Math.floor(rem / sR); rem -= r * sR;
    s = Math.floor(rem / sS); rem -= s * sS;
    t = Math.floor(rem / sT); rem -= t * sT;
    f = Math.floor(rem / sF); a = rem - f * sF;
  }
  return off;
}

// Dia (índice) em que cai o rótulo "FA": sábado, quando a FA é sáb+dom; segunda, quando é dom+seg.
function genFaLabelDays(a, dows){
  return genFaFirstDays(a, dows).map(d => dows[d] === 6 ? d : d + 1);
}
// Dias que são o 1º dia de uma FA (duas folgas seguidas em sáb+dom ou dom+seg).
function genFaFirstDays(a, dows){
  const out = [];
  for(let d = 0; d < a.length - 1; d++){
    if(a[d] && a[d+1] && (dows[d] === 6 || dows[d] === 0)) out.push(d);
  }
  return out;
}

function genValidate(cfg, offs){
  const issues = [];
  const D = cfg.D, dows = cfg.dows;
  cfg.people.forEach((P, i) => {
    if(P.frozen) return; // quem já estava na escala não é reavaliado
    const s = P.startDay || 0; // quem entra no meio do mês: só vale do dia de início em diante
    const a = s ? offs[i].slice(s) : offs[i];
    const dws = s ? dows.slice(s) : dows;
    const forced = s ? P.forced.slice(s) : P.forced;
    const DD = a.length;
    const need = P.isNew ? P.K : cfg.rules.offs;
    const faMode = P._faRelaxed ? 'none' : P.faMode;
    const sunRule = P.sunRule && !P._sunRelaxed;
    const count = a.filter(Boolean).length;
    if(count < need) issues.push(`${P.name}: ${count} folga(s), abaixo da meta de ${need}`);
    if(count > P.K) issues.push(`${P.name}: ${count} folgas, acima das ${P.K} definidas`);

    const faDays = genFaFirstDays(a, dws);
    const isFaFirst = new Array(DD).fill(false);
    faDays.forEach(d => { isFaFirst[d] = true; });

    // dias seguidos: o sábado da FA (sáb+dom) zera; o domingo da FA (dom+seg) ainda conta,
    // e a segunda (FA) zera
    let run = P.carryWork;
    for(let d = 0; d < DD; d++){
      if(a[d] && (!isFaFirst[d] || dws[d] === 6)) run = 0;
      else { run++; if(run > cfg.W){ issues.push(`${P.name}: passa de ${cfg.W} dias seguidos (dia ${d+1+s})`); break; } }
    }

    // nunca 3 folgas seguidas (só se os 3 dias foram pedidos)
    for(let d = 0; d < DD - 2; d++){
      if(a[d] && a[d+1] && a[d+2] && !(forced[d] && forced[d+1] && forced[d+2])){
        issues.push(`${P.name}: 3 folgas seguidas nos dias ${d+1+s} a ${d+3+s}`);
        break;
      }
    }
    // folgas coladas fora da FA
    for(let d = 0; d < DD - 1; d++){
      if(a[d] && a[d+1] && !isFaFirst[d] && !(forced[d] || forced[d+1]) && !(d > 0 && isFaFirst[d-1])){
        issues.push(`${P.name}: folgas coladas nos dias ${d+1+s} e ${d+2+s} fora de uma FA`);
        break;
      }
    }
    if(faMode === 'must' && faDays.length === 0) issues.push(`${P.name}: ficou sem FA neste mês`);
    if(faMode === 'must' && faDays.length > 1) issues.push(`${P.name}: mais de uma FA no mês`);
    if(faMode === 'never' && faDays.length > 0 && !faDays.every(d => forced[d] && forced[d+1])){
      issues.push(`${P.name}: ganhou FA, mas já teve no mês passado`);
    }

    if(sunRule){
      let sunOff = 0, t = P.carrySun, chainBroken = false;
      for(let d = 0; d < DD; d++){
        if(dws[d] !== 0) continue;
        if(a[d]) { sunOff++; t = 0; }
        else { t++; if(t > cfg.SW && !chainBroken){ chainBroken = true; issues.push(`${P.name}: passa de ${cfg.SW} domingos seguidos sem folga (dia ${d+1+s})`); } }
      }
      const allowed = Math.max(1, P.forcedSundays);
      if(sunOff === 0) issues.push(`${P.name}: nenhum domingo de folga no mês`);
      else if(sunOff > allowed) issues.push(`${P.name}: ${sunOff} domingos de folga (o certo é 1)`);
    }
  });
  for(let d = 0; d < D; d++){
    let n = 0, anyNew = false;
    for(let i = 0; i < offs.length; i++) if(offs[i][d]){ n++; if(!cfg.people[i].frozen) anyNew = true; }
    if(n > cfg.M && anyNew) issues.push(`Dia ${d+1}: ${n} pessoas de folga (limite ${cfg.M})`);
  }
  (cfg.softGroups ? [] : cfg.groups).forEach(g => {
    for(let d = 0; d < D; d++){
      const together = g.filter(i => offs[i][d]);
      if(together.length >= 2 && together.some(i => !cfg.people[i].frozen)){
        issues.push(`${together.map(i => cfg.people[i].name).join(', ')} folgam juntos no dia ${d+1}`);
      }
    }
  });
  return issues;
}

// Dias em que pessoas de uma mesma restrição folgam juntas: [{ names, days: [{ day, who }] }]
function genGroupClashes(cfg, offs){
  const out = [];
  cfg.groups.forEach(g => {
    const days = [];
    for(let d = 0; d < cfg.D; d++){
      const tg = g.filter(i => offs[i][d]);
      if(tg.length >= 2 && tg.some(i => !cfg.people[i].frozen)) days.push({ day: d + 1, who: tg.map(i => cfg.people[i].name) });
    }
    if(days.length) out.push({ g, names: g.map(i => cfg.people[i].name), days });
  });
  return out;
}

function genClashExplain(cfg, g){
  const r = genGroupProblems(cfg, g);
  const need = g.reduce((sum, i) => sum + cfg.people[i].K, 0);
  if(need > cfg.D) return {
    why: `juntas, essas ${g.length} pessoas precisam de ${need} folgas e o mês só tem ${cfg.D} dias. Não tem como cada uma folgar num dia diferente.`,
    fix: 'Diminua as folgas por pessoa ou tire alguém dessa restrição.'
  };
  if(r.length) return {
    why: `${r[0]}.`,
    fix: 'Mude um dos pedidos de folga ou tire alguém dessa restrição.'
  };
  return {
    why: 'as outras regras (limite de pessoas de folga por dia, FA, domingo e dias seguidos de trabalho) não deixaram espaço para separar todo mundo.',
    fix: 'Aumente o limite de pessoas de folga por dia no passo “Regras”, ou tire alguém dessa restrição.'
  };
}

const GEN_MAX_WORK = 5; // regra fixa: no máximo 5 dias seguidos trabalhando
const GEN_CLEAN_MIN = 3; // meta: pelo menos 3 da Limpeza disponíveis em cada dia

// Quem entra no meio do mês: o padrão é calculado só do dia de início em diante.
// Se as regras de FA/domingo não cabem no que sobrou do mês, elas são soltas na ordem
// FA -> domingo, e isso fica marcado na pessoa para a tela avisar.
function genBestPatternFrom(P, cfg, costOff, s){
  const D2 = cfg.D - s;
  if(D2 < 1) return null;
  const dows2 = cfg.dows.slice(s);
  const cfg2 = Object.assign({}, cfg, { D: D2, dows: dows2 });
  const forced2 = P.forced.slice(s);
  let fc = 0, fs = 0;
  forced2.forEach((v, k) => { if(v){ fc++; if(dows2[k] === 0) fs++; } });
  const cost2 = costOff.slice(s);
  const hasSun = dows2.some(w => w === 0);
  const variants = [
    { sunRule: P.sunRule && hasSun, faMode: P.faMode },
    { sunRule: P.sunRule && hasSun, faMode: 'never' },
    { sunRule: false, faMode: 'never' }
  ];
  for(const v of variants){
    const P2 = Object.assign({}, P, { forced: forced2, forcedCount: fc, forcedSundays: fs, carryWork: 0, carrySun: 0, sunRule: v.sunRule, faMode: v.faMode });
    const pat = genBestPattern(P2, cfg2, cost2, 0);
    if(pat){
      P._sunRelaxed = !!P.sunRule && !v.sunRule;
      P._faRelaxed = P.faMode === 'must' && v.faMode !== 'must';
      return new Array(s).fill(false).concat(pat);
    }
  }
  return null;
}

function genSolveOnce(cfg, rng){
  const N = cfg.people.length, D = cfg.D;
  const load = new Int32Array(D);
  const groupCnt = cfg.groups.map(() => new Int32Array(D));
  const cleanIdx = cfg.cleanIdx || [];
  const nClean = cleanIdx.length;
  const isClean = new Array(N).fill(false);
  cleanIdx.forEach(i => { isClean[i] = true; });
  const cleanOff = new Int32Array(D); // quantos da Limpeza estão de folga em cada dia
  const personGroups = cfg.people.map((_, i) => {
    const out = [];
    cfg.groups.forEach((g, gi) => { if(g.includes(i)) out.push(gi); });
    return out;
  });
  const offs = new Array(N).fill(null);
  // Líder e operador não entram na contagem de "gente disponível" do calendário.
  // regLoad = só o pessoal comum de folga em cada dia. Os operadores folgam nos dias
  // em que sobra mais gente comum, para estarem presentes nos dias com menos gente.
  const kindOf = cfg.people.map(P => {
    const sp = state.people.find(x => x.id === P.id);
    const g = sp ? genGroupOf(sp) : 'none';
    return g === 'operador' ? 'op' : (g === 'lider' ? 'lead' : null);
  });
  const regLoad = new Int32Array(D);
  const isRamp = new Array(N).fill(false);
  (cfg.rampIdx || []).forEach(i => { isRamp[i] = true; });
  const rampOff = new Int32Array(D); // quantas pessoas das rampas estão de folga em cada dia

  function removePerson(i){
    const a = offs[i]; if(!a) return;
    for(let d = 0; d < D; d++) if(a[d]){ load[d]--; if(!kindOf[i]) regLoad[d]--; if(isClean[i]) cleanOff[d]--; if(isRamp[i]) rampOff[d]--; personGroups[i].forEach(g => groupCnt[g][d]--); }
    offs[i] = null;
  }
  function addPerson(i, a){
    offs[i] = a;
    for(let d = 0; d < D; d++) if(a[d]){ load[d]++; if(!kindOf[i]) regLoad[d]++; if(isClean[i]) cleanOff[d]++; if(isRamp[i]) rampOff[d]++; personGroups[i].forEach(g => groupCnt[g][d]++); }
  }
  // MODO RÍGIDO: usa só o nível 0 das regras (nada é afrouxado em silêncio).
  // Se a pessoa não tem padrão possível, devolve null e a geração é recusada.
  function place(i, noiseAmp){
    const costOff = new Float64Array(D);
    for(let d = 0; d < D; d++){
      // Ao acrescentar alguém, encaixar nos dias mais vazios é regra dominante (peso 40x maior),
      // para não criar dia com muita gente de folga ao lado de dia com pouca.
      // operador: peso alto e olha só o pessoal comum (folga onde há mais gente disponível)
      const lv = kindOf[i] === 'lead' ? load[d] : regLoad[d];
      const wt = (cfg.append || kindOf[i] === 'op') ? 400 : 10;
      let c = wt * (2 * lv + 1); // equilibra a carga entre os dias
      if(load[d] + 1 > cfg.M) c += 50000;             // passou do limite por dia
      if(cfg.boost && cfg.boost[d] && isRamp[i]){      // dia de maior demanda: o mínimo de disponíveis nas rampas tem prioridade
        c += 600;
        if(rampOff[d] + 1 > cfg.boostMax[d]) c += 55000 * (rampOff[d] + 1 - cfg.boostMax[d]); // acima do limite por dia (50000), abaixo das restrições de grupo (60000)
      }
      for(const g of personGroups[i]){
        c += 60000 * groupCnt[g][d]; // folgaria junto de alguém do grupo
        // Espaça as folgas do grupo: evita colar na folga de outra pessoa do mesmo grupo,
        // para sobrar o menor número possível de dias sem ninguém do grupo de folga.
        for(let k = 1; k <= 2; k++){
          const pen = k === 1 ? 1500 : 600;
          if(d - k >= 0 && groupCnt[g][d - k] > 0) c += pen;
          if(d + k < D && groupCnt[g][d + k] > 0) c += pen;
        }
      }
      if(isClean[i]){
        const allowed = Math.max(0, nClean - GEN_CLEAN_MIN);
        const over = cleanOff[d] + 1 - allowed;
        if(over > 0) c += 3000 * over * over;
        else c += 25 * (-over);
      }
      if(noiseAmp) c += rng() * noiseAmp;
      costOff[d] = c;
    }
    const Pi = cfg.people[i];
    const pat = Pi.isNew ? genBestPatternFrom(Pi, cfg, costOff, Pi.startDay || 0) : genBestPattern(Pi, cfg, costOff, 0);
    if(!pat) return null;
    addPerson(i, pat);
    return pat;
  }

  // mais travados primeiro (quem tem pedidos/folgas fixas), com desempate aleatório
  // pessoas congeladas (já estavam na escala) entram na conta, mas nunca são refeitas
  cfg.people.forEach((P, i) => { if(P.frozen) addPerson(i, P.forced.slice()); });
  const order = cfg.people.map((P, i) => ({ i, k: P.forcedCount + rng() * 0.9, fz: !!P.frozen }))
    .filter(x => !x.fz).sort((a, b) => b.k - a.k).map(x => x.i);
  for(const i of order){
    if(!place(i, 40)) return { fail: true, person: i };
  }

  for(let round = 0; round < 6; round++){
    let changed = false;
    const idx = order.slice();
    for(let k = idx.length - 1; k > 0; k--){ const j = Math.floor(rng() * (k + 1)); [idx[k], idx[j]] = [idx[j], idx[k]]; }
    idx.forEach(i => {
      const old = offs[i];
      removePerson(i);
      const pat = place(i, round < 2 ? 6 : 0);
      if(!pat){ addPerson(i, old); return; }
      if(pat.some((v, d) => v !== old[d])) changed = true;
    });
    if(!changed) break;
  }

  const issues = genValidate(cfg, offs);
  let balance = 0;
  for(let d = 0; d < D; d++) balance += load[d] * load[d];
  let cleanPen = 0;
  if(nClean){
    for(let d = 0; d < D; d++){
      const avail = nClean - cleanOff[d];
      if(avail < GEN_CLEAN_MIN) cleanPen += 400 * (GEN_CLEAN_MIN - avail) * (GEN_CLEAN_MIN - avail);
      else if(avail > GEN_CLEAN_MIN) cleanPen += 40 * (avail - GEN_CLEAN_MIN);
    }
  }
  let boostPen = 0;
  if(cfg.boost){
    for(let d = 0; d < D; d++) if(cfg.boost[d]) boostPen += 300 * rampOff[d] + 30000 * Math.max(0, rampOff[d] - cfg.boostMax[d]);
  }
  let clash = 0;
  if(cfg.softGroups) genGroupClashes(cfg, offs).forEach(c => { clash += c.days.length; });
  // Cobertura das restrições: o ideal é sempre ter alguém do grupo de folga. Só conta como
  // falha o dia sem ninguém que dava para evitar (se o grupo tem menos folgas que dias do mês,
  // alguns dias vazios são inevitáveis). Dias vazios seguidos também pesam, para ficarem espalhados.
  let coverPen = 0;
  cfg.groups.forEach(g => {
    const cover = new Array(D).fill(false);
    let total = 0;
    g.forEach(i => { const a = offs[i]; if(!a) return; for(let d = 0; d < D; d++) if(a[d]){ total++; cover[d] = true; } });
    const zeros = cover.filter(v => !v).length;
    coverPen += 8000 * Math.max(0, zeros - Math.max(0, D - total));
    let run = 0;
    for(let d = 0; d < D; d++){
      if(!cover[d]) run++; else { coverPen += 150 * run * run; run = 0; }
    }
    coverPen += 150 * run * run;
  });
  return { offs, issues, clash, load: Array.from(load), cleanOff: Array.from(cleanOff), score: issues.length * 100000 + clash * 20000 + balance + cleanPen + coverPen + boostPen };
}

function genDiffCount(a, b){
  let n = 0;
  for(let i = 0; i < a.offs.length; i++){
    const x = a.offs[i], y = b.offs[i];
    for(let d = 0; d < x.length; d++) if(x[d] !== y[d]) n++;
  }
  return n;
}

// Procura escalas 100% válidas e diferentes entre si (até "want", padrão 3).
// Só entram escalas SEM nenhum ponto de atenção. Devolve também a "menos pior"
// para o diagnóstico quando nenhuma fecha.
async function genRun(cfg, seed, opt){
  opt = opt || {};
  const want = opt.want || 3, maxTries = opt.maxTries || 40, budget = opt.budget || 7000;
  const rng = genMulberry(seed);
  const t0 = Date.now();
  const found = [];
  let bestBad = null, stale = 0;
  const minDiff = cfg.append ? 2 : Math.max(4, Math.round(cfg.people.length * cfg.D * 0.03));
  const soft = !!cfg.softGroups, cap = soft ? want * 3 : want;
  for(let k = 0; k < maxTries && found.length < cap; k++){
    const sol = genSolveOnce(cfg, rng);
    if(sol.fail) break;
    if(sol.issues.length === 0){
      if(found.every(f => genDiffCount(f, sol) >= minDiff)){ found.push(sol); stale = 0; } else stale++;
    }else{
      stale++;
      if(!bestBad || sol.score < bestBad.score) bestBad = sol;
    }
    if(Date.now() - t0 > budget) break;
    if(found.length && stale >= 12) break; // já não aparece nada novo
    await genTick();
  }
  found.sort((a, b) => a.score - b.score);
  if(soft && found.length){
    const minClash = Math.min(...found.map(f => f.clash || 0));
    const best = found.filter(f => (f.clash || 0) === minClash).slice(0, want);
    return { options: best, bestBad };
  }
  return { options: found, bestBad };
}

// ---- Checagens que explicam POR QUE não dá para gerar ----
// Cada item: { title, detail, fix }. Só entram condições realmente impossíveis.
function genPrecheckFast(cfg){
  const items = [];
  const D = cfg.D, N = cfg.people.length, offs = cfg.rules.offs, M = cfg.M;
  cfg.people.forEach(P => {
    if(P.forcedCount > offs){
      items.push({
        title: P.name,
        detail: `pediu ${P.forcedCount} dias de folga, mas a regra está em ${offs} folgas por pessoa.`,
        fix: P.forcedCount <= 9
          ? `Aumente “Folgas por pessoa” para ${P.forcedCount} ou tire ${P.forcedCount - offs} pedido(s) dessa pessoa.`
          : `Tire pedidos dessa pessoa: o máximo permitido é 9 folgas no mês.`
      });
    }
  });
  const total = N * offs;
  if(total > D * M){
    items.push({
      title: 'Limite de pessoas de folga por dia',
      detail: `${N} pessoas × ${offs} folgas = ${total} folgas, mas ${M} por dia × ${D} dias = ${D * M}.`,
      fix: `Aumente “Máx. pessoas de folga no mesmo dia” para pelo menos ${Math.ceil(total / D)} ou diminua as folgas por pessoa.`
    });
  }
  const crowded = [];
  for(let d = 0; d < D; d++){
    let n = 0;
    cfg.people.forEach(P => { if(P.forced[d]) n++; });
    if(n > M) crowded.push({ day: d + 1, n });
  }
  if(crowded.length){
    const c = crowded[0];
    items.push({
      title: 'Pedidos de folga no mesmo dia',
      detail: `no dia ${c.day}, ${c.n} pessoas pediram folga e o limite é ${M} por dia${crowded.length > 1 ? ` (e mais ${crowded.length - 1} dia(s) assim)` : ''}.`,
      fix: `Aumente o máximo por dia para ${Math.max(...crowded.map(x => x.n))} ou mude alguns pedidos.`
    });
  }
  const sundays = cfg.dows.filter(w => w === 0).length;
  const needSun = cfg.people.reduce((s, P) => s + (P.sunRule ? Math.max(1, P.forcedSundays) : 0), 0);
  if(sundays && needSun > sundays * M){
    items.push({
      title: 'Domingos de folga',
      detail: `${needSun} domingos de folga são necessários (1 por pessoa), mas o mês tem ${sundays} domingos × ${M} por dia = ${sundays * M}.`,
      fix: `Aumente o máximo por dia para pelo menos ${Math.ceil(needSun / sundays)}.`
    });
  }
  return items;
}

// Testa cada pessoa sozinha: se nem sozinha ela consegue cumprir as regras, o problema é dela.
// Pessoas com o mesmo motivo viram um item só.
function genPrecheckDeep(cfg){
  const zero = new Float64Array(cfg.D);
  const labels = {
    2: 'a regra do domingo (1 domingo de folga no mês)',
    3: 'a FA (folga agrupada) junto com o domingo',
    4: 'a regra de não ter folgas coladas fora da FA',
    5: `o limite de ${cfg.W} dias seguidos trabalhando`
  };
  const groups = {};
  cfg.people.forEach(P => {
    if(P.forcedCount > cfg.rules.offs) return; // já explicado em genPrecheckFast
    if(genBestPattern(P, cfg, zero, 0)) return;
    let why = 'as regras juntas';
    for(const r of [2, 3, 4, 5]){
      if(genBestPattern(P, cfg, zero, r)){ why = labels[r]; break; }
    }
    const works = k => k >= P.forcedCount && !!genBestPattern(Object.assign({}, P, { K: k }), cfg, zero, 0);
    let sug = null;
    for(let k = cfg.rules.offs + 1; k <= 9 && !sug; k++) if(works(k)) sug = k;
    for(let k = cfg.rules.offs - 1; k >= MIN_OFF_DAYS_PER_MONTH && !sug; k--) if(works(k)) sug = k;
    const key = why + '|' + sug;
    (groups[key] = groups[key] || { why, sug, names: [] }).names.push(P.name);
  });
  return Object.values(groups).map(g => {
    const many = g.names.length > 1;
    return {
      title: genJoinNames(g.names),
      detail: `com ${cfg.rules.offs} folgas ${many ? 'não dá' : 'não dá'} para respeitar ${g.why} junto com as outras regras (pedidos, FA, domingo e ${cfg.W} dias seguidos).`,
      fix: g.sug
        ? `Com ${g.sug} folgas por pessoa ${many ? 'essas pessoas fecham' : 'essa pessoa fecha'}. Ajuste “Folgas por pessoa” ou revise os pedidos ${many ? 'delas' : 'dela'}.`
        : `Revise os pedidos de folga ${many ? 'dessas pessoas' : 'dessa pessoa'} e o mês anterior.`
    };
  });
}

function genPrecheckAppend(cfg){
  const items = [];
  const zero = new Float64Array(cfg.D);
  cfg.people.forEach(P => {
    if(!P.isNew) return;
    const rem = cfg.D - (P.startDay || 0);
    if(rem < 1){ items.push({ title: P.name, detail: 'o dia de início está fora do mês.', fix: 'Escolha um dia de início dentro do mês.' }); return; }
    if(genBestPatternFrom(P, cfg, zero, P.startDay || 0)) return;
    const works = k => !!genBestPatternFrom(Object.assign({}, P, { K: k }), cfg, zero, P.startDay || 0);
    let sug = null;
    for(let k = P.K + 1; k <= 9 && !sug; k++) if(works(k)) sug = k;
    for(let k = P.K - 1; k >= 1 && !sug; k--) if(works(k)) sug = k;
    items.push({
      title: P.name,
      detail: `com ${P.K} folga${P.K > 1 ? 's' : ''} em ${rem} dia${rem > 1 ? 's' : ''} restantes não dá para respeitar o limite de ${cfg.W} dias seguidos trabalhando.`,
      fix: sug ? `Com ${sug} folga${sug > 1 ? 's' : ''} fecha. Ajuste “Folgas” no passo anterior ou mude o dia de início.` : 'Mude o dia de início ou o número de folgas.'
    });
  });
  return items;
}

// Quando nenhuma escala válida foi achada, tenta descobrir qual filtro está pesando
// (testando "e se eu aumentasse o limite por dia?" e "e se eu tirasse essa restrição?").
async function genDiagnoseRun(cfg, bad, seed){
  const items = [];
  const generic = { title: 'Não encontrei uma combinação válida', detail: 'Com esses filtros juntos, nenhuma escala passou em todas as regras.', fix: 'Diminua as folgas por pessoa, tire pedidos ou restrições, ou aumente o máximo de pessoas de folga por dia.' };
  if(!bad) return [generic];
  const quick = async c => (await genRun(c, seed + 7, { want: 1, maxTries: 10, budget: 1200 })).options.length > 0;
  const over = [];
  for(let d = 0; d < cfg.D; d++) if(bad.load[d] > cfg.M) over.push(d + 1);
  const conflicts = cfg.groups.map(g => {
    let n = 0;
    for(let d = 0; d < cfg.D; d++){ const tg = g.filter(i => bad.offs[i][d]); if(tg.length >= 2 && tg.some(i => !cfg.people[i].frozen)) n++; }
    return { g, n };
  }).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  const rest = bad.issues.filter(t => !/^Dia \d+:/.test(t) && !/folgam juntos/.test(t));

  if(over.length){
    let okM = null;
    for(let j = 1; j <= 3 && !okM; j++){
      if(await quick(Object.assign({}, cfg, { M: cfg.M + j }))) okM = cfg.M + j;
    }
    items.push({
      title: 'Limite de pessoas de folga por dia',
      detail: `com no máximo ${cfg.M} por dia, não consegui encaixar todo mundo (ex.: dia ${over.slice(0, 3).join(', ')}).`,
      fix: okM ? `Com ${okM} pessoas por dia a escala sai. Aumente “Máx. pessoas de folga no mesmo dia”.` : 'Aumente o máximo por dia ou diminua as folgas por pessoa.'
    });
  }
  for(const c of conflicts.slice(0, 3)){
    const ok = await quick(Object.assign({}, cfg, { groups: cfg.groups.filter(x => x !== c.g) }));
    const nm = genJoinNames(c.g.map(i => cfg.people[i].name));
    items.push({
      title: `Restrição ${nm}`,
      detail: `não consegui evitar que folguem no mesmo dia (${c.n} dia${c.n > 1 ? 's' : ''}) respeitando as outras regras.`,
      fix: ok ? 'Sem essa restrição a escala sai. Remova-a no passo “Restrições” ou libere mais folgas por dia.' : 'Remova essa restrição ou aumente o máximo de pessoas de folga por dia.'
    });
  }
  if(rest.length) items.push({ title: 'Outras regras', detail: rest.slice(0, 3).join('; ') + '.', fix: 'Revise os pedidos de folga e as folgas por pessoa.' });
  return items.length ? items : [generic];
}


// ---------- Gerador automático de escala: assistente ----------
const GEN_GROUP_ORDER = ['lider','operador','porao','limpeza','triagem'];
const GEN_STEPS = [
  { eyebrow: 'Pessoas',      title: 'Quem entra na escala?' },
  { eyebrow: 'Pedidos',      title: 'Algum dia específico?' },
  { eyebrow: 'Demanda',      title: 'Dias de maior demanda' },
  { eyebrow: 'Restrições',   title: 'Quem não pode folgar junto?' },
  { eyebrow: 'Regras',       title: 'Regras da escala' },
  { eyebrow: 'Resultado',    title: 'Escala gerada' }
];
const GEN_DOW_LETTERS = ['D','S','T','Q','Q','S','S'];
const GEN_STEP_RULES = 4, GEN_STEP_RESULT = 5;
let gen = null; // estado do assistente (null = fechado)

function genEsc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function genUid(){ return 'g' + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36); }
function genClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function genGroupOf(p){
  const fns = p.functions || [];
  for(const id of GEN_GROUP_ORDER) if(fns.includes(id)) return id;
  return 'none';
}
function genSelectedPeople(){ return sortPeople(state.people.filter(p => gen.selected.has(p.id))); }
function genMonthName(){ return MONTHS[gen.month]; }
function genAutoM(){
  const N = genSelectedPeople().length;
  const D = genDayInfo(gen.year, gen.month).D;
  return Math.max(1, Math.ceil(N * gen.rules.offs / D) + 1);
}
function genCurrentM(){ return gen.rules.maxPerDay != null ? gen.rules.maxPerDay : genAutoM(); }

// ---- rascunho (fica salvo neste aparelho) ----
const GEN_DRAFT_KEY = 'escalaGenDraft';
function genSaveDraft(){
  if(!gen || gen.resumePrompt || gen.mode !== 'full') return;
  try{
    const requests = {};
    Object.keys(gen.requests).forEach(pid => { requests[pid] = [...gen.requests[pid]]; });
    localStorage.setItem(GEN_DRAFT_KEY, JSON.stringify({
      v: 4, savedAt: Date.now(),
      step: Math.min(gen.step, GEN_STEP_RULES),
      year: gen.year, month: gen.month,
      selected: [...gen.selected], requests, boost: [...(gen.boost || [])], boostMax: gen.boostMax || {},
      savedOff: gen.savedOff,
      extraGroups: gen.extraGroups, rules: gen.rules
    }));
  }catch(e){ /* localStorage indisponível: segue sem rascunho */ }
}
function genLoadDraft(){
  try{
    const raw = localStorage.getItem(GEN_DRAFT_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || (d.v !== 1 && d.v !== 2 && d.v !== 3 && d.v !== 4) || !Number.isInteger(d.month) || !Number.isInteger(d.year)) return null;
    return d;
  }catch(e){ return null; }
}
function genClearDraft(){
  try{ localStorage.removeItem(GEN_DRAFT_KEY); }catch(e){}
}
function genRestoreDraft(d){
  const ids = new Set(state.people.map(p => p.id));
  gen.year = d.year; gen.month = d.month;
  gen.selected = new Set((d.selected || []).filter(id => ids.has(id)));
  gen.requests = {};
  Object.keys(d.requests || {}).forEach(pid => {
    const days = (d.requests[pid] || []).filter(n => Number.isInteger(n));
    if(ids.has(pid) && days.length) gen.requests[pid] = new Set(days);
  });
  const Dd = genDayInfo(d.year, d.month).D;
  gen.boost = new Set((d.boost || []).filter(n => Number.isInteger(n) && n >= 1 && n <= Dd));
  gen.boostMax = {};
  Object.keys(d.boostMax || {}).forEach(k => { const day = parseInt(k, 10), v = d.boostMax[k]; if(gen.boost.has(day) && Number.isInteger(v) && v >= 0) gen.boostMax[day] = v; });
  gen.fixed = []; // o passo de folgas fixas foi removido: dias fixos são marcados em "Pedidos"
  genPrefillFa();
  gen.savedOff = d.savedOff || {};
  gen.extraGroups = (d.extraGroups || []).map(g => g.filter(id => ids.has(id))).filter(g => g.length >= 2);
  const r = d.rules || {};
  gen.rules = {
    offs: genClamp(r.offs || 8, MIN_OFF_DAYS_PER_MONTH, MAX_OFF_DAYS_PER_MONTH), maxWork: genClamp(r.maxWork || 5, 3, 7),
    maxSun: genClamp(r.maxSun || 5, 2, 8),
    maxPerDay: Number.isInteger(r.maxPerDay) ? Math.max(1, r.maxPerDay) : null
  };
  gen.step = genDraftStep(d);
}
// rascunhos antigos têm outra numeração de passos: converte para a atual
function genDraftStep(d){
  let st = d.step || 0;
  if(d.v === 1 && st >= 2) st -= 1;  // v1 tinha o passo "Folgas fixas" no meio
  if(d.v < 3 && st >= 3) st -= 1;    // o passo de FA foi removido
  if(d.v < 4 && st >= 2) st += 1;    // o passo "Reforço" entra depois de "Pedidos"
  return genClamp(st, 0, GEN_STEP_RULES);
}

// Aproveita os "dias desejados" que já estão marcados no mês, se houver.
function genPrefillRequests(){
  // Uma nova escala sempre começa com os pedidos de dia específico zerados.
  // (Ao continuar um rascunho, os pedidos voltam do próprio rascunho.)
  gen.requests = {};
}

function genPrefillFa(){
  // Regra fixa: quem teve FA na escala do mês anterior fica sem FA neste mês (alternando).
  const py = gen.month === 0 ? gen.year - 1 : gen.year, pm = (gen.month + 11) % 12;
  const D = new Date(py, pm + 1, 0).getDate();
  const dows = [];
  for(let d = 1; d <= D; d++) dows.push(new Date(py, pm, d).getDay());
  gen.faLast = new Set();
  state.people.forEach(p => {
    const offs = [];
    for(let d = 1; d <= D; d++) offs.push(isOff(p.id, iso(py, pm, d)));
    if(genFaFirstDays(offs, dows).length) gen.faLast.add(p.id);
  });
}
// Exceção: pessoas que têm o sábado fixo (religião) e também o domingo do mês já ganham a
// folga agrupada naturalmente; para elas a regra de FA não se aplica ('free' = nem obriga, nem proíbe).
const GEN_NO_FA_NAMES = ['josue marques'];
function genIsNoFaPerson(p){
  return !!p && GEN_NO_FA_NAMES.includes(normalizeText(p.name).trim().replace(/\s+/g, ' '));
}
function genFaMode(pid, fixedDows){
  if(genIsNoFaPerson((state.people || []).find(x => x.id === pid))) return 'free';
  if(fixedDows && fixedDows.has(0)) return 'never';
  if(fixedDows && fixedDows.has(6)) return 'must';
  return gen.faLast.has(pid) ? 'never' : 'must';
}

// ---- montagem da config para o motor ----
// Se a pessoa não tem NENHUMA folga registrada nas semanas anteriores, os dados do
// mês passado provavelmente não foram preenchidos — então não conta como "vem
// trabalhando sem parar" (isso forçaria folga geral no dia 1).
function genHasRecentOffs(personId, year, month, days){
  const first = iso(year, month, 1);
  const start = addDaysToIso(first, -days);
  return (state.offDays[personId] || []).some(ds => ds >= start && ds < first);
}
function genCarryWork(personId, year, month){
  if(!genHasRecentOffs(personId, year, month, 35)) return 0;
  let n = 0;
  let cur = addDaysToIso(iso(year, month, 1), -1);
  while(n < 12 && isWorkingDay(personId, cur)){ n++; cur = addDaysToIso(cur, -1); }
  return n;
}
function genCarrySundays(personId, year, month){
  if(!genHasRecentOffs(personId, year, month, 63)) return 0;
  const d = new Date(year, month, 1);
  d.setDate(d.getDate() - 1);
  while(d.getDay() !== 0) d.setDate(d.getDate() - 1);
  let n = 0;
  while(n < 12){
    if(!isWorkingDay(personId, iso(d.getFullYear(), d.getMonth(), d.getDate()))) break;
    n++;
    d.setDate(d.getDate() - 7);
  }
  return n;
}
function genActiveGroups(selectedIds){
  const groups = [];
  (state.coveragePairs || []).forEach(pair => {
    if(gen.savedOff[pair.id]) return;
    const members = pairMembers(pair).filter(id => selectedIds.includes(id));
    if(members.length >= 2) groups.push(members);
  });
  gen.extraGroups.forEach(g => {
    const members = g.filter(id => selectedIds.includes(id));
    if(members.length >= 2) groups.push(members);
  });
  // regra automática: operadores nunca folgam juntos
  const ops = operatorAutoGroup().filter(id => selectedIds.includes(id));
  if(ops.length >= 2) groups.push(ops);
  return groups;
}
function genBuildConfig(){
  const { D, dows } = genDayInfo(gen.year, gen.month);
  const people = genSelectedPeople();
  const ids = people.map(p => p.id);
  const fixedByPid = {};
  gen.fixed.forEach(row => {
    if(!ids.includes(row.pid)) return;
    if(!fixedByPid[row.pid]) fixedByPid[row.pid] = new Set();
    row.dows.forEach(w => fixedByPid[row.pid].add(w));
  });
  const cfgPeople = people.map(p => {
    const fixedDows = fixedByPid[p.id] || new Set();
    const forced = new Array(D).fill(false);
    const fixedMask = new Array(D).fill(false);
    const reqMask = new Array(D).fill(false);
    for(let d = 0; d < D; d++){
      if(fixedDows.has(dows[d])){ forced[d] = true; fixedMask[d] = true; }
    }
    (gen.requests[p.id] ? [...gen.requests[p.id]] : []).forEach(day => {
      if(day >= 1 && day <= D){ forced[day - 1] = true; if(!fixedMask[day - 1]) reqMask[day - 1] = true; }
    });
    let forcedCount = 0, forcedSundays = 0;
    for(let d = 0; d < D; d++) if(forced[d]){ forcedCount++; if(dows[d] === 0) forcedSundays++; }
    return {
      id: p.id, name: p.name, forced, fixedMask, reqMask, forcedCount, forcedSundays,
      sunRule: !fixedDows.has(0),
      faMode: genFaMode(p.id, fixedDows),
      carryWork: genCarryWork(p.id, gen.year, gen.month),
      carrySun: genCarrySundays(p.id, gen.year, gen.month),
      K: gen.rules.offs
    };
  });
  const groups = genActiveGroups(ids).map(g => g.map(id => ids.indexOf(id)));
  // Dias de maior demanda: nesses dias só pode folgar um número pequeno de pessoas das rampas
  const boost = new Array(D).fill(false);
  (gen.boost ? [...gen.boost] : []).forEach(day => { if(day >= 1 && day <= D) boost[day - 1] = true; });
  const rampIds = new Set(genRampPeople().map(p => p.id));
  const rampIdx = people.map((p, i) => rampIds.has(p.id) ? i : -1).filter(i => i >= 0);
  const boostMax = boost.map((on, d) => on ? genBoostMaxFor(d + 1) : null); // teto de folgas (rampas) por dia marcado
  // Regra fixa: a equipe da Limpeza tenta manter pelo menos GEN_CLEAN_MIN disponíveis por dia
  const cleanIdx = people.map((p, i) => genGroupOf(p) === 'limpeza' ? i : -1).filter(i => i >= 0);
  return {
    year: gen.year, month: gen.month, D, dows, people: cfgPeople, groups, cleanIdx,
    boost: boost.some(Boolean) ? boost : null, rampIdx, boostMax,
    W: GEN_MAX_WORK, SW: gen.rules.maxSun, M: genCurrentM(),
    rules: { offs: gen.rules.offs }, maxOffs: MAX_OFF_DAYS_PER_MONTH
  };
}

// ---- viabilidade das restrições de "não folgar junto" ----
// Em um grupo em que ninguém pode folgar no mesmo dia, cada folga de cada pessoa
// ocupa um dia só dela. Então a soma das folgas do grupo não pode passar do número
// de dias do mês. Também é impossível se duas pessoas do grupo já têm folga
// obrigatória (pedido ou folga fixa) no mesmo dia.
function genJoinNames(list){
  if(list.length <= 1) return list.join('');
  return list.slice(0, -1).join(', ') + ' e ' + list[list.length - 1];
}
function genGroupProblems(cfg, g){
  const reasons = [];
  const clashDays = [];
  for(let d = 0; d < cfg.D; d++){
    if(g.filter(i => cfg.people[i].forced[d]).length >= 2) clashDays.push(d + 1);
  }
  if(clashDays.length){
    reasons.push(`mais de uma pessoa pediu folga no mesmo dia (dia ${clashDays.slice(0, 3).join(', ')}${clashDays.length > 3 ? '…' : ''})`);
  }
  const need = g.reduce((sum, i) => sum + cfg.people[i].K, 0);
  if(need > cfg.D) reasons.push(`juntas, essas ${g.length} pessoas precisam de ${need} folgas e o mês só tem ${cfg.D} dias`);
  return reasons;
}
// Aviso curto para um grupo (lista de ids). Vazio quando é possível.
function genGroupWarn(ids){
  try{
    const cfg = genBuildConfig();
    const idx = ids.map(id => cfg.people.findIndex(P => P.id === id)).filter(i => i >= 0);
    if(idx.length < 2) return '';
    const r = genGroupProblems(cfg, idx);

// Rampas = Porão, Limpeza e Triagem. É delas que se conta o mínimo de pessoas disponíveis no dia.
const GEN_RAMP_GROUPS = ['porao','limpeza','triagem'];
function genRampPeople(){
  const all = genSelectedPeople();
  const r = all.filter(p => GEN_RAMP_GROUPS.includes(genGroupOf(p)));
  return r.length ? r : all; // equipe sem funções cadastradas: conta todo mundo

// Teto de folgas (nas rampas) de cada dia de maior demanda. Padrão: 1. É um teto, não uma cota exata:
// o gerador pode folgar menos gente se o cálculo permitir.
function genBoostMaxFor(day){
  const n = genRampPeople().length;
  const v = gen.boostMax && Number.isInteger(gen.boostMax[day]) ? gen.boostMax[day] : 1;
  return genClamp(v, 0, n);
}
function genBoostCfgHtml(){
  if(!gen.boost.size) return '';

      </div>

// Confere se os dias de maior demanda cabem junto com as restrições e com o limite de folgas por dia.
// Devolve uma lista de avisos (vazia quando está tudo certo). É só aviso: não bloqueia a geração.
function genBoostConflicts(){
  if(!gen.boost || !gen.boost.size) return [];
  const people = genSelectedPeople();
  const N = people.length;
  if(!N) return [];
  const { D } = genDayInfo(gen.year, gen.month);
  const K = gen.rules.offs, M = genCurrentM();
  const rampIds = new Set(genRampPeople().map(p => p.id));
  const nonRamp = people.filter(p => !rampIds.has(p.id)).length;
  const days = [...gen.boost].filter(d => d >= 1 && d <= D);
  if(!days.length) return [];
  const nonBoost = D - days.length;
  const capSum = days.reduce((a, d) => a + genBoostMaxFor(d), 0);
  const out = [];
  // 1) restrições: cada grupo precisa de um dia diferente para cada folga; o que não couber fora
  //    dos dias de maior demanda é obrigado a cair neles
  let forced = 0;
  genActiveGroups(people.map(p => p.id)).forEach(g => {
    const m = g.filter(id => rampIds.has(id)).length;
    forced += Math.max(0, m * K - nonBoost);
  });
  if(forced > capSum){
    out.push(`As restrições de "não folgar junto" obrigam pelo menos ${forced} folga${forced > 1 ? 's' : ''} nos dias de maior demanda, mas os tetos somam ${capSum}. Aumente os tetos, marque menos dias ou reduza as folgas por pessoa.`);
  }
  // 2) limite de pessoas de folga por dia: os demais dias precisam comportar o resto das folgas
  const capacity = nonBoost * M + days.reduce((a, d) => a + Math.min(M, genBoostMaxFor(d) + nonRamp), 0);
  if(N * K > capacity){
    out.push(`Com no máximo ${M} pessoa${M > 1 ? 's' : ''} de folga por dia, não cabem as ${N * K} folgas do mês com esses tetos. Aumente o limite por dia ou os tetos, ou marque menos dias.`);
  }
  return out;
}
function genBoostWarnHtml(){
  let list;
  try{ list = genBoostConflicts(); }catch(e){ return ''; }
  return list.map(t => `<div class="gen-warn-note" style="margin-bottom:10px;"><b>Dias de maior demanda</b>: ${genEsc(t)}</div>`).join('');
}
function genBoostSumHtml(){
  const days = [...gen.boost].sort((a, b) => a - b);
  if(!days.length) return 'Nenhum dia marcado. Se não há dias de maior demanda, é só continuar.';
  let t = `<b>${days.length}</b> dia${days.length > 1 ? 's' : ''} de maior demanda: ${days.join(', ')}`;
  // pedidos de folga nesses dias continuam valendo; avisa se passam do máximo permitido
  const ramp = new Set(genRampPeople().map(p => p.id));
  const over = [];
  days.forEach(day => {
    const maxOff = genBoostMaxFor(day);
    const who = Object.keys(gen.requests).filter(pid => gen.selected.has(pid) && ramp.has(pid) && gen.requests[pid].has(day));
    if(who.length > maxOff) over.push(`dia ${day}: ${who.length} pedido${who.length > 1 ? 's' : ''} de folga, teto de ${maxOff}`);
  });
  if(over.length) t += `<br><span style="color:#FBBF24;">Pedidos de folga acima do teto (serão mantidos): ${over.join('; ')}.</span>`;
  return t;
}

// Código de turno (A…/B…) mostrado no dia de trabalho, quando a tabela traz os códigos (tela principal).
function genCodeBadge(cfg, i, d){
  const c = cfg.codes && cfg.codes[i] && cfg.codes[i][d];
  return c ? `<span class="gen-code ${c.charAt(0) === 'B' ? 'b' : 'a'}" title="${genEsc(SHIFT_TIMES[c] || c)}">${genEsc(c)}</span>` : '';
}
function genTableHtml(cfg, sol){
  const { D, dows } = cfg;
  const faLabel = cfg.people.map((P, i) => genFaLabelDays(sol.offs[i], dows));
  const tNow = new Date();
  const todayIdx = (cfg.year === tNow.getFullYear() && cfg.month === tNow.getMonth()) ? tNow.getDate() - 1 : -1; // coluna do dia de hoje
  let head = `<th class="nm">Nome</th>`;
  for(let d = 1; d <= D; d++){
    head += `<th class="dh ${(dows[d-1] === 0 || dows[d-1] === 6) ? 'wknd' : ''} ${d - 1 === todayIdx ? 'today' : ''} ${(cfg.boost && cfg.boost[d-1]) ? 'boost' : ''}"><span class="dn">${d}</span><span class="dw">${DOW[dows[d-1]].charAt(0)}</span></th>`;
  }
  head += `<th class="tot">Fol.</th>`;
  let rows = '';
  cfg.people.forEach((P, i) => {
    const a = sol.offs[i];
    const count = a.filter(Boolean).length;
    let cells = '';
    for(let d = 0; d < D; d++){
      const isFa = faLabel[i].includes(d);
      const cls = isFa ? 'fa' : (P.reqMask[d] ? 'req' : '');
      const delay = Math.min(i * 24 + d * 7, 600);
      const editable = !P.frozen && !(P.isNew && d < (P.startDay || 0));
      const isSel = !!(gen && gen.sel && gen.sel.sol === sol && gen.sel.p === i && gen.sel.d === d);
      cells += `<td class="c ${(dows[d] === 0 || dows[d] === 6) ? 'wknd' : ''} ${d === todayIdx ? 'today' : ''} ${(P.isNew && d < (P.startDay || 0)) ? 'pre' : ''}"${editable ? ` data-p="${i}" data-d="${d}"` : ''}>${a[d] ? `<span class="gen-cell ${cls} ${isSel ? 'sel' : ''}" style="animation-delay:${delay}ms">${isFa ? 'FA' : 'F'}</span>` : genCodeBadge(cfg, i, d)}</td>`;
    }
    const fnPerson = (state.people || []).find(x => x.id === P.id);
    const fnDef = fnPerson ? fnById(genGroupOf(fnPerson)) : null;
    rows += `<tr class="${P.frozen ? 'frz' : (P.isNew ? 'newp' : '')}"><td class="nm${fnDef ? ' fnbar' : ''}"${fnDef ? ` style="--fn:${fnDef.color}"` : ''} title="${genEsc(P.name)}">${genEsc(P.name)}${P.isNew ? '<span class="gen-newtag">novo</span>' : ''}</td>${cells}<td class="tot ${(!P.frozen && !P.isNew && count < (P.minOffs != null ? P.minOffs : cfg.rules.offs)) ? 'bad' : ''}">${count}</td></tr>`;
  });
  // linha de baixo da tabela: quantas pessoas estão DISPONÍVEIS (trabalhando) em cada dia.
  // Quem ainda não entrou na escala (entra no meio do mês) não conta antes do dia de início.
  // Só contam as rampas (Triagem, Limpeza e Porão); Líder e Operador ficam de fora.
  // Equipe sem nenhuma pessoa dessas funções: conta todo mundo.
  const rampMask = cfg.people.map(P => {
    const sp = (state.people || []).find(x => x.id === P.id);
    return !!sp && GEN_RAMP_GROUPS.includes(genGroupOf(sp));
  });
  const countAll = !rampMask.some(Boolean);
  let foot = `<tr class="foot"><td class="nm">Disponíveis</td>`;
  for(let d = 0; d < D; d++){
    let avail = 0;
    cfg.people.forEach((P, i) => {
      if(!countAll && !rampMask[i]) return;
      if(P.isNew && d < (P.startDay || 0)) return;
      if(!sol.offs[i][d]) avail++;
    });
    foot += `<td class="${sol.load[d] > cfg.M ? 'over' : ''} ${d === todayIdx ? 'today' : ''}">${avail}</td>`;
  }
  foot += `<td></td></tr>`;
  // linha extra: quantas pessoas da Limpeza estão de folga em cada dia
  const cIdx = cfg.cleanIdx || [];
  if(cIdx.length){
    foot += `<tr class="foot clean"><td class="nm">Disp. limp.</td>`;
    for(let d = 0; d < D; d++){
      const n = cIdx.reduce((acc, i) => acc + (sol.offs[i][d] ? 1 : 0), 0);
      const avail = cIdx.length - n; // pessoas da Limpeza disponíveis no dia
      const low = avail < GEN_CLEAN_MIN;
      foot += `<td class="cl-on ${low ? 'cl-low' : ''} ${d === todayIdx ? 'today' : ''}">${avail}</td>`;
    }
    foot += `<td></td></tr>`;
  }
  return `<table class="gen-table"><thead><tr>${head}</tr></thead><tbody>${rows}${foot}</tbody></table>`;
}

function genOptionInner(i, noAnim){
  const { cfg, options } = gen.result;
  const sol = options[i];
  const maxLoad = Math.max(...sol.load);

  let meta = `<div class="gen-opt-meta">No máximo ${maxLoad} pessoa${maxLoad > 1 ? 's' : ''} de folga no mesmo dia · ${withFa} com FA</div>`;
  if(cfg.append){
    meta = `<div class="gen-opt-meta">As folgas de quem já estava na escala foram mantidas.</div>`;
    cfg.people.forEach((P, k) => {
      if(!P.isNew) return;
      const days = sol.offs[k].map((v, d) => v ? d + 1 : null).filter(Boolean);
      const notes = [];
      if(P._faRelaxed) notes.push('sem FA (entra no meio do mês)');
      if(P._sunRelaxed) notes.push('sem domingo de folga (não coube no que sobrou do mês)');
      // quantas pessoas que já estavam na escala folgavam em cada dia escolhido
      const already = d => cfg.people.reduce((n, Q, q) => n + ((!Q.isNew && sol.offs[q][d - 1]) ? 1 : 0), 0);
      const daysTxt = days.map(d => `${d} (${already(d)} já folgava${already(d) === 1 ? '' : 'm'})`).join(', ');
      meta += `<div class="gen-opt-meta"><b>${genEsc(P.name)}</b>: folga nos dias ${daysTxt}${notes.length ? ' · ' + notes.join(', ') : ''}</div>`;
    });
  }
  if(cfg.boost){
    // folgas nas rampas (Porão, Limpeza e Triagem) em cada dia de maior demanda, contra o teto escolhido
    const ramp = cfg.rampIdx || [];
    const offAt = d => ramp.reduce((n, k) => n + (sol.offs[k][d] ? 1 : 0), 0);
    const bst = [];
    for(let d = 0; d < cfg.D; d++) if(cfg.boost[d]) bst.push({ d: d + 1, off: offAt(d), max: cfg.boostMax[d] });
    const miss = bst.filter(x => x.off > x.max);
    meta += `<div class="gen-opt-meta" style="color:${miss.length ? '#FBBF24' : '#60A5FA'};">Dias de maior demanda (folgas nas rampas / teto): ${bst.map(x => `dia ${x.d}: ${x.off} de ${x.max}`).join(' · ')}${miss.length ? ' · teto ultrapassado por causa de pedidos de folga ou regras pessoais' : ''}</div>`;
  }
  const clashes = genGroupClashes(cfg, sol.offs);
  const verdict = clashes.length
    ? `<div class="gen-verdict alert"><span class="vicon">!</span><div>
        <div class="vtitle">Atenção: restrição não cumprida</div>

            <div class="vfix"><b>Como resolver:</b> ${genEsc(ex.fix)}</div>
          </div>`;
        }).join('')}
      </div></div>`
    : `<div class="gen-verdict ok"><span class="vicon">✓</span><div><div class="vtitle">Todas as regras foram respeitadas</div></div></div>`;
  return `${verdict}

    <div class="gen-table-wrap ${noAnim ? 'noanim' : ''}">${genTableHtml(cfg, sol)}</div>${genLegendHtml()}`;

function genSwap(el, html){
  if(!el) return;
  const token = (el._tk = (el._tk || 0) + 1);
  el.classList.add('swap-out');
  setTimeout(() => {
    if(el._tk !== token) return;
    const w = el.querySelector('.gen-table-wrap');

    el.classList.remove('swap-out');

function genRefreshTables(){
  const r = gen && gen.result;
  if(!r || !r.options.length) return;
  const keep = el => { const w = el && el.querySelector('.gen-table-wrap'); return { w: w ? w.scrollLeft : 0, t: el ? el.scrollTop : 0, l: el ? el.scrollLeft : 0 }; };
  const restore = (el, k) => { if(!el) return; const w = el.querySelector('.gen-table-wrap'); if(w) w.scrollLeft = k.w; el.scrollTop = k.t; el.scrollLeft = k.l; };

function genMoveProblems(sol, pi, from, to){
  const cfg = gen.result.cfg;
  const P = cfg.people[pi];
  if(P.frozen) return [`${P.name} já estava na escala e não pode ser alterado aqui.`];
  if(P.forced && P.forced[from]) return [`${P.name}: o dia ${from + 1} é uma folga pedida ou fixa e não pode sair do lugar.`];
  const offs2 = sol.offs.map(a => a.slice());
  offs2[pi][from] = false; offs2[pi][to] = true;
  const before = genValidate(cfg, sol.offs);
  const after = genValidate(cfg, offs2);
  const problems = after.filter(x => !before.includes(x));
  if(cfg.softGroups){
    cfg.groups.forEach(g => {
      if(!g.includes(pi)) return;
      const tg = g.filter(i => offs2[i][to]);
      if(tg.length >= 2) problems.push(`${genJoinNames(tg.map(i => cfg.people[i].name))} não podem folgar juntos (dia ${to + 1})`);
    });
  }
  const cI = cfg.cleanIdx || [];
  if(cI.includes(pi)){
    const offN = arr => cI.reduce((n, k) => n + (arr[k][to] ? 1 : 0), 0);
    const availAfter = cI.length - offN(offs2), availBefore = cI.length - offN(sol.offs);
    if(availAfter < GEN_CLEAN_MIN && availAfter < availBefore){
      problems.push(`Dia ${to + 1}: a Limpeza ficaria com só ${availAfter} disponíveis (mínimo ${GEN_CLEAN_MIN})`);
    }
  }
  return problems;
}

  const sol = gen.result.options[gen.result.active];
  const pi = parseInt(td.dataset.p, 10), d = parseInt(td.dataset.d, 10);
  const sel = (gen.sel && gen.sel.sol === sol) ? gen.sel : null;

    genEditMsg('');

    const problems = genMoveProblems(sol, pi, sel.d, d);
    if(problems.length){
      genEditMsg('Não é permitido: ' + problems.slice(0, 2).join(' · '));

      sol.offs[pi][sel.d] = false; sol.offs[pi][d] = true;

function genFullLayout(){

  }

let genFullAuto = true; // true = em pé, a escala já abre deitada; o ⟳ desliga/liga isso

// Sensor de inclinação: quando a janela fica travada em pé (o app não gira sozinho), a escala deita
// para o lado certo conforme você gira o celular (horário ou anti-horário). Se o sistema girar de
// verdade a tela, nada disso é usado (o resize cuida).
let genTiltOn = false;
function genTiltHandler(e){
  const g = e.gamma, b = e.beta;
  if(typeof g !== 'number') return;
  if(typeof b === 'number' && Math.abs(b) > 75) return;   // celular em pé (retrato): ignora
  const f = document.getElementById('genFull');
  if(!f || !f.classList.contains('open') || !f.classList.contains('force-land')) return;
  // gamma > 0: celular girado no sentido horário -> escala deita no sentido anti-horário (ccw)
  if(g > 35 && !f.classList.contains('ccw')){ f.classList.add('ccw'); genFullLayout(); }
  else if(g < -35 && f.classList.contains('ccw')){ f.classList.remove('ccw'); genFullLayout(); }
}
function genTiltStart(){
  if(genTiltOn || typeof window.DeviceOrientationEvent === 'undefined') return;
  const go = () => { if(genTiltOn) return; window.addEventListener('deviceorientation', genTiltHandler); genTiltOn = true; };
  try{
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){ // iOS: pede permissão no toque
      DeviceOrientationEvent.requestPermission().then(r => { if(r === 'granted') go(); }).catch(() => {});
    }else{
      go();
    }
  }catch(err){ console.error(err); }
}
function genTiltStop(){
  if(!genTiltOn) return;
  window.removeEventListener('deviceorientation', genTiltHandler);
  genTiltOn = false;
}
function genOpenFull(){
  const r = gen && gen.result;
  if(!r || !r.options.length) return;
  openFullOverlay(`${capFirst(MONTHS[r.cfg.month])} ${r.cfg.year}`, genTabsHtml(), genFullInner(r.active));
}
function openFullOverlay(title, tabsHtml, innerHtml){
  const f = document.getElementById('genFull');
  if(f.classList.contains('open')) return;
  document.getElementById('genFullTitle').textContent = title;
  document.getElementById('genFullTabs').innerHTML = tabsHtml;
  document.getElementById('genFullHost').innerHTML = innerHtml;
  f.setAttribute('aria-hidden', 'false');
  genFullAuto = true;
  // celular em pé: já abre na horizontal (tela girada), sem precisar apertar nada
  const portraitNow = window.innerHeight > window.innerWidth;
  f.classList.remove('ccw');
  f.classList.toggle('force-land', portraitNow);
  if(portraitNow) genTiltStart(); // janela em pé: usa o sensor para saber para que lado deitar
  genFullLayout();
  pushOverlay('genFull');
  requestAnimationFrame(() => f.classList.add('open'));
}
function genFullClose(){
  const f = document.getElementById('genFull');
  if(!f) return;
  if(gen) gen.sel = null;
  genEditMsg('');
  const wasEditing = schedEdit.active;
  if(wasEditing){ schedEdit.active = false; schedEdit.undo = []; }
  f.classList.remove('open', 'force-land', 'ccw', 'editing', 'coding');
  f.setAttribute('aria-hidden', 'true');
  genTiltStop();
  genFullLayout();
  if(wasEditing){ try{ renderCalendar(); renderCalSchedule(); }catch(err){ console.error(err); } } // mostra na tela principal o que foi editado
}

// Mostra, abaixo do calendário, a escala do mês de todo mundo (mesma tabela do gerador).
// O quadradinho abre a tela expandida, com a mesma animação.
function schedBuildTable(y, m){
  const people = sortPeopleTabela(rosterPeopleFor(y, m));
  if(!people.length) return null;
  const D = new Date(y, m + 1, 0).getDate();
  const dows = [];
  for(let d = 1; d <= D; d++) dows.push(new Date(y, m, d).getDay());
  const offs = people.map(p => Array.from({ length: D }, (_, d) => isOff(p.id, iso(y, m, d + 1))));
  const load = Array.from({ length: D }, (_, d) => offs.reduce((n, a) => n + (a[d] ? 1 : 0), 0));
  const cfg = {
    year: y, month: m,
    D, dows, rules: { offs: 0 }, M: Infinity,
    cleanIdx: people.map((p, i) => genGroupOf(p) === 'limpeza' ? i : -1).filter(i => i >= 0),
    codes: people.map(p => Array.from({ length: D }, (_, d) => { const ds = iso(y, m, d + 1); return isOff(p.id, ds) ? null : getShiftCode(p.id, ds); })),
    people: people.map(p => ({
      id: p.id, name: p.name, frozen: false, isNew: false, startDay: 0, minOffs: minOffsFor(p.id, y, m),
      reqMask: Array.from({ length: D }, (_, d) => isRequestedOff(p.id, iso(y, m, d + 1)))
    }))
  };
  return { cfg, sol: { offs, load } };
}
