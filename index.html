// ---------- Importar escala de um PDF (dnata) ----------
// Lê o PDF inteiramente no navegador (nenhum dado sai do celular), localiza a
// linha de cabeçalho com os números dos dias (01, 02, 03...), localiza cada
// colaborador pela matrícula e procura, na linha dele, células cujo texto seja
// EXATAMENTE "F" (folga regulamentar) ou "FA" (folga agrupada). Qualquer outro
// código (A9, B, J, CH, etc.) é deliberadamente ignorado.
const MONTH_NAMES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

async function extractPdfTextItems(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const items = [];
  for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });
    const content = await page.getTextContent();
    content.items.forEach(it=>{
      const text = (it.str || '').trim();
      if(!text) return;
      items.push({
        text,
        x: it.transform[4],
        top: viewport.height - it.transform[5], // topo->baixo, igual pdfplumber
        page: pageNum
      });
    });
  }
  return items;
}

function groupItemsIntoRows(items, tolerance){
  // Encadeamento: cada item entra na linha se estiver perto do ÚLTIMO item já
  // agrupado nela (não sempre do primeiro). Isso evita que uma linha se
  // "quebre" em duas quando o conteúdo da célula (matrícula, código de turno
  // etc.) fica alguns pontos acima ou abaixo do restante da mesma linha visual.
  const sorted = [...items].sort((a,b)=> a.page - b.page || a.top - b.top || a.x - b.x);
  const rows = [];
  let current = null;
  sorted.forEach(it=>{
    if(current && current.page === it.page && Math.abs(it.top - current.lastTop) <= tolerance){
      current.items.push(it);
      current.lastTop = it.top;
    } else {
      current = { page: it.page, top: it.top, lastTop: it.top, items: [it] };
      rows.push(current);
    }
  });
  return rows;
}

function findDayHeaderRow(rows){
  let best = null;
  rows.forEach(row=>{
    const nums = row.items
      .filter(it => /^\d{1,2}$/.test(it.text))
      .map(it => ({ day: parseInt(it.text,10), x: it.x }))
      .sort((a,b)=> a.x - b.x);
    if(nums.length < 15) return;
    // valida que forma uma sequência crescente 1,2,3... (permite pequenas falhas)
    let hits = 0;
    nums.forEach((n,i)=>{ if(n.day === i+1) hits++; });
    if(hits >= nums.length - 2 && nums[0].day === 1 && (!best || nums.length > best.nums.length)){
      best = { row, nums };
    }
  });
  return best;
}

function detectMonthYear(items){
  let month = null, year = null;
  for(const it of items){
    const lower = it.text.toLowerCase();
    const idx = MONTH_NAMES_PT.findIndex(m => lower === m || lower.startsWith(m.slice(0,4)));
    if(idx >= 0){ month = idx; break; }
  }
  const yearItem = items.find(it => /^20\d{2}$/.test(it.text));
  if(yearItem) year = parseInt(yearItem.text, 10);
  return { month, year };
}

async function parseEscalaPdf(file){
  const items = await extractPdfTextItems(file);
  const rows = groupItemsIntoRows(items, 3);
  const headerInfo = findDayHeaderRow(rows);
  if(!headerInfo) throw new Error('Não encontrei a linha com os números dos dias (01, 02, 03...) nesse PDF.');
  const dayCols = headerInfo.nums; // [{day, x}], já ordenado por x
  const spacing = dayCols.length > 1
    ? (dayCols[dayCols.length-1].x - dayCols[0].x) / (dayCols[dayCols.length-1].day - dayCols[0].day)
    : 9;
  const tolerance = spacing / 2;
  const totalDaysInPdf = dayCols[dayCols.length-1].day;

  const { month: detectedMonth, year: detectedYear } = detectMonthYear(items);

  const peopleFound = []; // { registration, name, days:[int,...] }
  rows.forEach(row=>{
    if(row.page !== headerInfo.row.page) return;
    if(row.top <= headerInfo.row.top) return; // só linhas abaixo do cabeçalho
    // matrícula fica sempre bem à esquerda da tabela — usamos a posição x do
    // primeiro item numérico de 5 a 7 dígitos entre os itens mais à esquerda da linha.
    const leftMost = [...row.items].sort((a,b)=>a.x-b.x)[0];
    const matriculaItem = /^\d{5,7}$/.test(leftMost?.text) ? leftMost : null;
    if(!matriculaItem) return;
    const registration = matriculaItem.text;
    const nameItems = row.items
      .filter(it => it.x > matriculaItem.x && it.x < dayCols[0].x - spacing*2 && /[A-Za-zÀ-ÿ]/.test(it.text))
      .sort((a,b)=>a.x-b.x);
    const name = nameItems.map(it=>it.text).join(' ');

    const fDays = [];
    row.items.forEach(it=>{
      if(it.text !== 'F' && it.text !== 'FA') return;
      let closest = null, closestDist = Infinity;
      dayCols.forEach(dc=>{
        const dist = Math.abs(dc.x - it.x);
        if(dist < closestDist){ closestDist = dist; closest = dc; }
      });
      if(closest && closestDist <= tolerance) fDays.push(closest.day);
    });
    if(fDays.length){
      const existing = peopleFound.find(p=>p.registration===registration);
      if(existing) existing.days.push(...fDays);
      else peopleFound.push({ registration, name, days: [...new Set(fDays)].sort((a,b)=>a-b) });
    }
  });

  return { peopleFound, detectedMonth, detectedYear, totalDaysInPdf };
}

// Compara os dias de folga do PDF com os que já estão salvos no app para aquele mês.
// added = no PDF e ainda não salvos · removed = salvos no app mas ausentes no PDF.
function importDiff(person, pdfDays, year, month){
  const prefix = monthKey(year, month) + '-';
  const saved = (state.offDays[person.id] || []).filter(ds => ds.startsWith(prefix))
    .map(ds => parseInt(ds.slice(8, 10), 10)).filter(Number.isInteger);
  const pdf = new Set(pdfDays), cur = new Set(saved);
  return {
    added: [...pdf].filter(d => !cur.has(d)).sort((a,b)=>a-b),
    removed: [...cur].filter(d => !pdf.has(d)).sort((a,b)=>a-b)
  };
}
function isPersonInRosterForMonth(personId, year, month){
  return ((state.monthRosters||{})[monthKey(year, month)] || []).includes(personId);
}

function renderImportMatchedList(){
  const monthSel = document.getElementById('importMonthSelect');
  const yearInput = document.getElementById('importYearInput');
  const container = document.getElementById('importMatchedList');
  if(!monthSel || !container || !pendingImport) return;
  const month = parseInt(monthSel.value, 10);
  const year = parseInt(yearInput.value, 10);
  const matched = pendingImport.matched;

  if(!matched.length){
    container.innerHTML = `<p class="mini-hint">Nenhuma folga (F/FA) encontrada pra ninguém já cadastrado. Confira se é o PDF certo.</p>`;
    return;
  }
  const validYear = Number.isInteger(year) && year >= 2020 && year <= 2100 && Number.isInteger(month);
  const daysInMonth = validYear ? new Date(year, month + 1, 0).getDate() : 31;

  const rows = matched.map(m=>{
    const days = [...new Set(m.days)].filter(d => d >= 1 && d <= daysInMonth).sort((a,b)=>a-b);
    const diff = validYear ? importDiff(m.person, days, year, month) : { added: [], removed: [] };
    return { m, days, diff, changed: diff.added.length + diff.removed.length > 0 };
  });
  const divergent = rows.filter(r => r.changed).length;

  let html = `<div class="imp-title">Folgas encontradas <span>${matched.length}</span>${
    divergent ? `<span class="imp-warn">${divergent} com divergência</span>` : `<span class="imp-ok">✓ tudo igual à escala</span>`}</div>`;
  rows.forEach(({ m, days, diff, changed })=>{
    const editing = importEditingReg === m.reg;
    const inRoster = validYear && isPersonInRosterForMonth(m.person.id, year, month);
    const name = genEsc(m.person.name);

    let body;
    if(editing){
      let grid = '';
      for(let d = 1; d <= daysInMonth; d++){
        grid += `<button type="button" class="imp-day ${days.includes(d) ? 'on' : ''}" data-imp-day="${d}" data-imp-reg="${m.reg}">${d}</button>`;
      }
      body = `<div class="imp-grid">${grid}</div>`;
    }else{
      const all = [...new Set([...days, ...diff.removed])].sort((a,b)=>a-b);
      const chips = all.map(d => {
        const cls = diff.added.includes(d) ? 'new' : (diff.removed.includes(d) ? 'gone' : '');
        return `<span class="imp-chip ${cls}">${d}</span>`;
      }).join('');
      body = chips ? `<div class="imp-chips">${chips}</div>` : `<span class="status-tag" style="color:var(--text-faint);">Sem folgas</span>`;
      if(changed){
        const parts = [];
        if(diff.added.length) parts.push(`<span style="color:var(--accent);">+${diff.added.length} nova${diff.added.length > 1 ? 's' : ''}</span>`);
        if(diff.removed.length) parts.push(`<span style="color:var(--c-falta);">−${diff.removed.length} removida${diff.removed.length > 1 ? 's' : ''}</span>`);
        body += `<span class="status-tag">${parts.join(' · ')}</span>`;
      }else if(days.length){
        body += `<span class="status-tag" style="color:var(--c-disponivel);">✓ igual à escala</span>`;
      }
    }
    const rosterNote = (!inRoster && days.length && !editing)
      ? `<span class="status-tag" style="color:var(--c-desejada);">Entra na escala do mês</span>` : '';
    html += `<div class="team-card imp-card">
      <div class="info">
        <span class="name">${name}</span>
        ${body}
        ${rosterNote}
      </div>
      <button type="button" class="icon-btn-sm" data-imp-edit="${m.reg}" title="${editing ? 'Concluir' : 'Editar folgas'}" aria-label="${editing ? 'Concluir edição de' : 'Editar folgas de'} ${name}">${editing ? '✓' : '✎'}</button>
    </div>`;
  });
  container.innerHTML = html;
}

function renderImportReviewBody(result){
  const { peopleFound, detectedMonth, detectedYear, totalDaysInPdf } = result;

  // Se já existe seleção de mês/ano na tela (ex: usuário mudou, ou estamos
  // re-renderizando após cadastrar alguém), preserva o que já estava escolhido.
  const prevMonthSel = document.getElementById('importMonthSelect');
  const prevYearInput = document.getElementById('importYearInput');
  const currentMonth = prevMonthSel ? parseInt(prevMonthSel.value, 10) : detectedMonth;
  const currentYear = prevYearInput ? parseInt(prevYearInput.value, 10) : (detectedYear || todayObj.getFullYear());

  // Casa cada matrícula encontrada no PDF com uma pessoa já cadastrada no app.
  const matched = [];
  const unmatchedRegs = [];
  const normalize = s => (s||'').replace(/\D/g, '');
  peopleFound.forEach(pf=>{
    const person = state.people.find(p => normalize(p.registration) === normalize(pf.registration));
    if(person){
      const reg = normalize(pf.registration);
      const days = importDayEdits[reg] ? importDayEdits[reg] : pf.days;
      matched.push({ person, reg, days: [...days], pdfName: pf.name });
    }
    else unmatchedRegs.push(pf);
  });
  const matchedIds = new Set(matched.map(m=>m.person.id));
  const noDataFound = state.people.filter(p => p.registration && !matchedIds.has(p.id));

  pendingImport = { matched, month: currentMonth, year: currentYear, totalDaysInPdf, result };

  const monthOptions = MONTH_NAMES_PT.map((m,i)=>
    `<option value="${i}" ${i===currentMonth?'selected':''}>${m.charAt(0).toUpperCase()+m.slice(1)}</option>`
  ).join('');

  let html = `
    <div style="margin-bottom:14px;">
      <label style="font-size:12px; color:var(--text-faint); display:block; margin-bottom:4px;">Mês detectado no PDF</label>
      <div style="display:flex; gap:8px;">
        <select id="importMonthSelect" style="flex:1; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px;">${monthOptions}</select>
        <input type="number" id="importYearInput" value="${currentYear}" style="width:90px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px;">
      </div>
    </div>
  `;


  html += `<div id="importMatchedList"></div>`;

  if(noDataFound.length){
    html += `<p style="font-weight:600; margin:14px 0 8px; color:var(--c-falta);">⚠️ Sem dados no PDF pra ${noDataFound.length} pessoa(s) já cadastrada(s)</p>`;
    html += `<p class="mini-hint" style="margin-bottom:8px;">${noDataFound.map(p=>p.name).join(', ')}</p>`;
  }

  if(unmatchedRegs.length){
    html += `<p style="font-weight:600; margin:14px 0 8px; color:var(--text-faint);">Matrículas no PDF sem cadastro no app — cadastre pra incluir as folgas dela(s)</p>`;
    unmatchedRegs.forEach(u=>{
      html += `<div class="team-card" style="margin-bottom:8px;">
        <div class="info">
          <span class="name">${u.name || 'Sem nome'}</span>
          <span class="status-tag" style="color:var(--text-faint);">Matrícula ${u.registration} · ${u.days.length} dia(s) de folga no PDF</span>
        </div>
        <button class="btn-secondary" data-add-reg="${u.registration}" data-add-name="${u.name||''}">+ Cadastrar</button>
      </div>`;
    });
  }

  document.getElementById('importReviewBody').innerHTML = html;
  renderImportMatchedList();
  document.getElementById('importMonthSelect').addEventListener('change', renderImportMatchedList);
  document.getElementById('importYearInput').addEventListener('input', renderImportMatchedList);
  document.getElementById('importReviewBody').querySelectorAll('[data-add-reg]').forEach(btn=>{
    btn.addEventListener('click', ()=> openPersonModalForImport(btn.dataset.addReg, btn.dataset.addName));
  });
}

document.getElementById('importReviewBody').addEventListener('click', (e)=>{

document.getElementById('cancelImportBtn').addEventListener('click', ()=> requestCloseOverlay('importReviewModalOverlay'));
document.getElementById('importReviewModalOverlay').addEventListener('click', (e)=>{

});

document.getElementById('confirmImportBtn').addEventListener('click', ()=>{
  if(!pendingImport || !pendingImport.matched.length){
    showToast('Nada pra importar.');
    return;
  }
  const month = parseInt(document.getElementById('importMonthSelect').value, 10);
  const year = parseInt(document.getElementById('importYearInput').value, 10);
  if(!Number.isInteger(month) || !Number.isInteger(year) || year < 2020 || year > 2100){
    showToast('Confira o mês e o ano antes de confirmar.');
    return;
  }
  const daysInTargetMonth = new Date(year, month+1, 0).getDate();
  const key = monthKey(year, month);
  const prefix = key + '-';

  // As folgas do mês de cada pessoa passam a ser exatamente as do PDF (já com as
  // correções feitas no lápis). Folgas de outros meses não são tocadas.
  let addedTotal = 0, removedTotal = 0;
  pendingImport.matched.forEach(m=>{
    const pdfDays = [...new Set(m.days)].filter(d => d >= 1 && d <= daysInTargetMonth).sort((a,b)=>a-b);
    const current = state.offDays[m.person.id] || [];
    const currentMonth = current.filter(ds => ds.startsWith(prefix));
    const next = pdfDays.map(d => iso(year, month, d));
    addedTotal += next.filter(ds => !currentMonth.includes(ds)).length;
    removedTotal += currentMonth.filter(ds => !next.includes(ds)).length;
    state.offDays[m.person.id] = current.filter(ds => !ds.startsWith(prefix)).concat(next);
    if(next.length){
      // Garante que essa pessoa também participa da escala desse mês.
      if(!state.monthRosters) state.monthRosters = {};
      if(!state.monthRosters[key]) state.monthRosters[key] = [];
      if(!state.monthRosters[key].includes(m.person.id)) state.monthRosters[key].push(m.person.id);
    }
  });

  saveState();
  calYear = year; calMonth = month;
  renderCalendar();
  renderEscalaList();
  renderTeam();
  if(!addedTotal && !removedTotal) showToast('Nada mudou: a escala já estava igual ao PDF.');
  else showToast(`Aplicado: ${addedTotal} folga${addedTotal === 1 ? '' : 's'} nova${addedTotal === 1 ? '' : 's'}, ${removedTotal} removida${removedTotal === 1 ? '' : 's'}.`);
  requestCloseOverlay('importReviewModalOverlay');
});

// ---------- Gerador automático de escala: motor ----------
// O motor não mexe na tela nem no estado do app: recebe uma "config" pronta e
// devolve as folgas de cada pessoa. Para cada pessoa ele resolve, por
// programação dinâmica, o melhor padrão de folgas possível (respeitando as
// regras duras) dado o que as outras pessoas já têm — e repete isso em rodadas
// até a escala se estabilizar. Assim a carga de folgas fica equilibrada entre
// os dias e as restrições de "não folgar junto" são evitadas.
const GEN_INF = 1e12;
let _genBuf = null;
const genTick = () => new Promise(r => setTimeout(r, 0));

function genMulberry(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function genDayInfo(year, month){
  const D = new Date(year, month + 1, 0).getDate();
  const dows = [];
  for(let d = 1; d <= D; d++) dows.push(new Date(year, month, d).getDay());
  return { D, dows };
}

// Melhor padrão de folgas para UMA pessoa, dado o custo de folgar em cada dia.
// Regras duras: meta de folgas, máx. de dias seguidos, domingo, e folga agrupada (FA).
// FA = 2 folgas seguidas em sáb+dom ou dom+seg. O dia da FA é o SÁBADO (sáb+dom) ou a
// SEGUNDA (dom+seg). Em sáb+dom, o sábado (FA) já zera a contagem de dias seguidos.
// Em dom+seg, o domingo ainda conta na sequência e a segunda (FA) zera. Fora da FA,
// ninguém folga 2 dias seguidos.
// relax: 0 = todas as regras; 1 = +1 folga; 2 = solta a regra do domingo;
// 3 = FA deixa de ser obrigatória; 4 = permite folgas coladas fora da FA (com custo);
// 5 = permite 1 dia seguido a mais. Retorna array de booleanos (true = folga) ou null.
function genBestPattern(P, cfg, costOff, relax){
  const D = cfg.D, dows = cfg.dows;
  const K = Math.min(P.K + (relax >= 1 ? 1 : 0), 12);
  const W = cfg.W + (relax >= 5 ? 1 : 0);
  const SW = cfg.SW;
  const sunRule = P.sunRule && relax < 2;
  const maxSun = sunRule ? Math.max(1, P.forcedSundays) : 0;
  const faEnabled = P.faMode === 'must';
  const mustEnd = faEnabled && relax < 3;
  const adjOk = relax >= 4;
  const O = K + 1, R = W + 1, S = maxSun + 1, T = SW + 1, F = 3, A = faEnabled ? 2 : 1;
  // índice do estado: o (folgas), r (dias seguidos), s (domingos de folga), t (domingos seguidos
  // trabalhados), f (0 = ontem trabalhou, 1 = ontem folga comum, 2 = ontem foi o 1º dia da FA), a (FA já usada)
  const sF = A, sT = F * A, sS = T * sT, sR = S * sS, sO = R * sR;
  const size = O * sO;
  const need = (D + 1) * size;
  if(!_genBuf || _genBuf.length < need) _genBuf = new Float64Array(need);
  const V = _genBuf;

  const endBase = D * size;
  for(let o = 0; o < O; o++) for(let r = 0; r < R; r++) for(let s = 0; s < S; s++) for(let t = 0; t < T; t++) for(let f = 0; f < F; f++) for(let a = 0; a < A; a++){
    const ok = (o === K) && (!sunRule || s >= 1) && (!mustEnd || a === 1) && f !== 2;
    V[endBase + o*sO + r*sR + s*sS + t*sT + f*sF + a] = ok ? 0 : GEN_INF;
  }

  const res = new Float64Array(6); // [custoFolga, idxFolga, custoFA, idxFA, custoTrab, idxTrab]
  function evalState(d, o, r, s, t, f, a){
    const nxt = (d + 1) * size;
    const dow = dows[d], isSun = dow === 0;
    const forced = P.forced[d];
    const sunOffOk = !sunRule || !isSun || s < maxSun;
    const ns = (sunRule && isSun) ? s + 1 : s;
    const nt = (sunRule && isSun) ? 0 : t;
    res[0] = GEN_INF; res[2] = GEN_INF; res[4] = GEN_INF;
    // folga comum (ou 2º dia da FA, quando f === 2)
    if(o < K && sunOffOk){
      let ok = false, pen = 0;
      if(f === 0 || f === 2) ok = true;
      else if(forced && d > 0 && P.forced[d-1]) ok = true;      // pedidos/fixas coladas: o usuário quis assim
      else if(adjOk){ ok = true; pen = 150; }
      if(ok){
        const idx = (o+1)*sO + 0*sR + ns*sS + nt*sT + 1*sF + a;
        const v = V[nxt + idx];
        if(v < GEN_INF){ res[0] = costOff[d] + pen + v; res[1] = idx; }
      }
    }
    // 1º dia da FA. Sábado (sáb+dom): é o dia da FA e zera a contagem de dias seguidos.
    // Domingo (dom+seg): ainda conta na sequência; quem zera é a segunda (FA).
    if(faEnabled && a === 0 && f === 0 && o < K && sunOffOk && (dow === 6 || dow === 0) && d + 1 < D && (dow === 6 || r < W)){
      const idx = (o+1)*sO + (dow === 6 ? 0 : r+1)*sR + ns*sS + nt*sT + 2*sF + 1;
      const v = V[nxt + idx];
      if(v < GEN_INF){ res[2] = costOff[d] + v; res[3] = idx; }
    }
    // trabalho
    if(f !== 2 && !forced && r < W && (!sunRule || !isSun || t < SW)){
      const wt = (sunRule && isSun) ? t + 1 : t;
      const idx = o*sO + (r+1)*sR + s*sS + wt*sT + 0*sF + a;
      const v = V[nxt + idx];
      if(v < GEN_INF){ res[4] = v; res[5] = idx; }
    }
  }

  for(let d = D - 1; d >= 0; d--){
    const base = d * size;
    // só vale calcular estados alcançáveis: não dá para ter mais folgas que dias passados
    // nem faltar mais folgas do que dias restantes. O resto fica como inviável.
    V.fill(GEN_INF, base, base + size);
    const oLo = Math.max(0, K - (D - d)), oHi = Math.min(K, d);
    for(let o = oLo; o <= oHi; o++) for(let r = 0; r < R; r++) for(let s = 0; s < S; s++) for(let t = 0; t < T; t++) for(let f = 0; f < F; f++) for(let a = 0; a < A; a++){
      evalState(d, o, r, s, t, f, a);
      let best = res[0];
      if(res[2] < best) best = res[2];
      if(res[4] < best) best = res[4];
      V[base + o*sO + r*sR + s*sS + t*sT + f*sF + a] = best;
    }
  }

  let o = 0, r = Math.min(P.carryWork, W), s = 0, t = sunRule ? Math.min(P.carrySun, SW) : 0, f = 0, a = 0;
  if(V[o*sO + r*sR + s*sS + t*sT + f*sF + a] >= GEN_INF) return null;
  const off = new Array(D).fill(false);
  for(let d = 0; d < D; d++){
    evalState(d, o, r, s, t, f, a);
    let idx, isOff;
    if(res[0] <= res[2] && res[0] <= res[4] && res[0] < GEN_INF){ idx = res[1]; isOff = true; }
    else if(res[2] <= res[4] && res[2] < GEN_INF){ idx = res[3]; isOff = true; }
    else if(res[4] < GEN_INF){ idx = res[5]; isOff = false; }
    else return null; // não deveria acontecer se o estado inicial era viável
    off[d] = isOff;
    o = Math.floor(idx / sO); let rem = idx - o * sO;
    r = Math.floor(rem / sR); rem -= r * sR;
    s = Math.floor(rem / sS); rem -= s * sS;
    t = Math.floor(rem / sT); rem -= t * sT;
    f = Math.floor(rem / sF); a = rem - f * sF;
  }
  return off;
}

// Plano B quando nenhuma versão das regras fecha: respeita os pedidos/fixas e o
// limite de dias seguidos, e distribui o resto. A validação vai apontar o que sobrou.
function genFallbackPattern(P, cfg){
  const D = cfg.D;
  const off = Array.from({ length: D }, (_, d) => !!P.forced[d]);
  let run = P.carryWork;
  for(let d = 0; d < D; d++){
    if(off[d]) run = 0;
    else { run++; if(run > cfg.W){ off[d] = true; run = 0; } }
  }
  let count = off.filter(Boolean).length;
  while(count < P.K){
    let bestD = -1, bestDist = -1;
    for(let d = 0; d < D; d++){
      if(off[d]) continue;
      let dist = D;
      for(let e = 0; e < D; e++) if(off[e]) dist = Math.min(dist, Math.abs(e - d));
      if(dist > bestDist){ bestDist = dist; bestD = d; }
    }
    if(bestD < 0) break;
    off[bestD] = true; count++;
  }
  return off;
}

// Dia (índice) em que cai o rótulo "FA": sábado, quando a FA é sáb+dom; segunda, quando é dom+seg.
function genFaLabelDays(a, dows){
  return genFaFirstDays(a, dows).map(d => dows[d] === 6 ? d : d + 1);
}
// Dias que são o 1º dia de uma FA (duas folgas seguidas em sáb+dom ou dom+seg).
function genFaFirstDays(a, dows){
  const out = [];
  for(let d = 0; d < a.length - 1; d++){
    if(a[d] && a[d+1] && (dows[d] === 6 || dows[d] === 0)) out.push(d);
  }
  return out;
}

function genValidate(cfg, offs){
  const issues = [];
  const D = cfg.D, dows = cfg.dows;
  cfg.people.forEach((P, i) => {
    const a = offs[i];
    const count = a.filter(Boolean).length;
    if(count < cfg.rules.offs) issues.push(`${P.name}: ${count} folga(s), abaixo da meta de ${cfg.rules.offs}`);
    if(count > cfg.maxOffs) issues.push(`${P.name}: ${count} folgas, acima do máximo de ${cfg.maxOffs}`);

    const faDays = genFaFirstDays(a, dows);
    const isFaFirst = new Array(D).fill(false);
    faDays.forEach(d => { isFaFirst[d] = true; });

    // dias seguidos: o sábado da FA (sáb+dom) zera; o domingo da FA (dom+seg) ainda conta,
    // e a segunda (FA) zera
    let run = P.carryWork;
    for(let d = 0; d < D; d++){
      if(a[d] && (!isFaFirst[d] || dows[d] === 6)) run = 0;
      else { run++; if(run > cfg.W){ issues.push(`${P.name}: passa de ${cfg.W} dias seguidos (dia ${d+1})`); break; } }
    }

    // folgas coladas fora da FA
    for(let d = 0; d < D - 1; d++){
      if(a[d] && a[d+1] && !isFaFirst[d] && !(P.forced[d] && P.forced[d+1]) && !(d > 0 && isFaFirst[d-1])){
        issues.push(`${P.name}: folgas coladas nos dias ${d+1} e ${d+2} fora de uma FA`);
        break;
      }
    }
    if(P.faMode === 'must' && faDays.length === 0) issues.push(`${P.name}: ficou sem FA neste mês`);
    if(P.faMode === 'must' && faDays.length > 1) issues.push(`${P.name}: mais de uma FA no mês`);
    if(P.faMode === 'never' && faDays.length > 0 && !faDays.every(d => P.forced[d] && P.forced[d+1])){
      issues.push(`${P.name}: ganhou FA, mas já teve no mês passado`);
    }

    if(P.sunRule){
      let sunOff = 0, t = P.carrySun, chainBroken = false;
      for(let d = 0; d < D; d++){
        if(dows[d] !== 0) continue;
        if(a[d]) { sunOff++; t = 0; }
        else { t++; if(t > cfg.SW && !chainBroken){ chainBroken = true; issues.push(`${P.name}: passa de ${cfg.SW} domingos seguidos sem folga (dia ${d+1})`); } }
      }
      const allowed = Math.max(1, P.forcedSundays);
      if(sunOff === 0) issues.push(`${P.name}: nenhum domingo de folga no mês`);
      else if(sunOff > allowed) issues.push(`${P.name}: ${sunOff} domingos de folga (o certo é 1)`);
    }
  });
  for(let d = 0; d < D; d++){
    let n = 0;
    for(let i = 0; i < offs.length; i++) if(offs[i][d]) n++;
    if(n > cfg.M) issues.push(`Dia ${d+1}: ${n} pessoas de folga (limite ${cfg.M})`);
  }
  cfg.groups.forEach(g => {
    for(let d = 0; d < D; d++){
      const together = g.filter(i => offs[i][d]);
      if(together.length >= 2){
        issues.push(`${together.map(i => cfg.people[i].name).join(', ')} folgam juntos no dia ${d+1}`);
      }
    }
  });
  return issues;
}

function genSolveOnce(cfg, rng){
  const N = cfg.people.length, D = cfg.D;
  const load = new Int32Array(D);
  const groupCnt = cfg.groups.map(() => new Int32Array(D));
  const personGroups = cfg.people.map((_, i) => {
    const out = [];
    cfg.groups.forEach((g, gi) => { if(g.includes(i)) out.push(gi); });
    return out;
  });
  const offs = new Array(N).fill(null);

  function removePerson(i){
    const a = offs[i]; if(!a) return;
    for(let d = 0; d < D; d++) if(a[d]){ load[d]--; personGroups[i].forEach(g => groupCnt[g][d]--); }
    offs[i] = null;
  }
  function addPerson(i, a){
    offs[i] = a;
    for(let d = 0; d < D; d++) if(a[d]){ load[d]++; personGroups[i].forEach(g => groupCnt[g][d]++); }
  }
  function place(i, noiseAmp){
    const costOff = new Float64Array(D);
    for(let d = 0; d < D; d++){
      let c = 10 * (2 * load[d] + 1);                 // equilibra a carga entre os dias
      if(load[d] + 1 > cfg.M) c += 1000;              // passou do limite por dia
      for(const g of personGroups[i]) c += 6000 * groupCnt[g][d]; // folgaria junto de alguém do grupo
      if(noiseAmp) c += rng() * noiseAmp;
      costOff[d] = c;
    }
    // Viabilidade não depende dos custos: guarda o menor nível de relaxamento que funcionou
    // para a pessoa e não perde tempo refazendo os níveis que já falharam.
    const P = cfg.people[i];
    let pat = null;
    for(let relax = P._minRelax || 0; relax <= 5 && !pat; relax++){
      pat = genBestPattern(P, cfg, costOff, relax);
      if(pat) P._minRelax = relax;
    }
    if(!pat){ pat = genFallbackPattern(P, cfg); P._minRelax = 6; }
    addPerson(i, pat);
    return pat;
  }

  // mais travados primeiro (quem tem pedidos/folgas fixas), com desempate aleatório
  const order = cfg.people.map((P, i) => ({ i, k: P.forcedCount + rng() * 0.9 }))
    .sort((a, b) => b.k - a.k).map(x => x.i);
  order.forEach(i => place(i, 40));

  for(let round = 0; round < 6; round++){
    let changed = false;
    const idx = order.slice();
    for(let k = idx.length - 1; k > 0; k--){ const j = Math.floor(rng() * (k + 1)); [idx[k], idx[j]] = [idx[j], idx[k]]; }
    idx.forEach(i => {
      const old = offs[i];
      removePerson(i);
      const pat = place(i, round < 2 ? 6 : 0);
      if(pat.some((v, d) => v !== old[d])) changed = true;
    });
    if(!changed) break;
  }

  const issues = genValidate(cfg, offs);
  let balance = 0;
  for(let d = 0; d < D; d++) balance += load[d] * load[d];
  return { offs, issues, load: Array.from(load), score: issues.length * 100000 + balance };
}

async function genRun(cfg, seed){
  const rng = genMulberry(seed);
  let best = null;
  const TRIES = 6;
  let stall = 0;
  for(let k = 0; k < TRIES; k++){
    const sol = genSolveOnce(cfg, rng);
    if(!best || sol.score < best.score){ best = sol; stall = 0; } else stall++;
    if(k >= 1 && best.issues.length === 0) break;
    if(stall >= 2) break; // já não está melhorando
    await genTick();
  }
  return best;
}


// ---------- Gerador automático de escala: assistente ----------
const GEN_GROUP_ORDER = ['lider','operador','porao','limpeza','restituicao'];
const GEN_STEPS = [
  { eyebrow: 'Pessoas',      title: 'Quem entra na escala?' },
  { eyebrow: 'Pedidos',      title: 'Algum dia específico?' },
  { eyebrow: 'Folgas fixas', title: 'Alguém tem folga fixa?' },
  { eyebrow: 'FA',           title: 'Quem teve FA mês passado?' },
  { eyebrow: 'Restrições',   title: 'Quem não pode folgar junto?' },
  { eyebrow: 'Regras',       title: 'Regras da escala' },
  { eyebrow: 'Resultado',    title: 'Escala gerada' }
];
const GEN_DOW_LETTERS = ['D','S','T','Q','Q','S','S'];
const GEN_STEP_FA = 3, GEN_STEP_RULES = 5, GEN_STEP_RESULT = 6;
let gen = null; // estado do assistente (null = fechado)

function genEsc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function genUid(){ return 'g' + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36); }
function genClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function genGroupOf(p){
  const fns = p.functions || [];
  for(const id of GEN_GROUP_ORDER) if(fns.includes(id)) return id;
  return 'none';
}
function genSelectedPeople(){ return sortPeople(state.people.filter(p => gen.selected.has(p.id))); }
function genMonthName(){ return MONTHS[gen.month]; }
function genAutoM(){
  const N = genSelectedPeople().length;
  const D = genDayInfo(gen.year, gen.month).D;
  return Math.max(1, Math.ceil(N * gen.rules.offs / D) + 1);
}
function genCurrentM(){ return gen.rules.maxPerDay != null ? gen.rules.maxPerDay : genAutoM(); }

// ---- rascunho (fica salvo neste aparelho) ----
const GEN_DRAFT_KEY = 'escalaGenDraft';
function genSaveDraft(){
  if(!gen || gen.resumePrompt) return;
  try{
    const requests = {};
    Object.keys(gen.requests).forEach(pid => { requests[pid] = [...gen.requests[pid]]; });
    localStorage.setItem(GEN_DRAFT_KEY, JSON.stringify({
      v: 1, savedAt: Date.now(),
      step: Math.min(gen.step, GEN_STEP_RULES),
      year: gen.year, month: gen.month,
      selected: [...gen.selected], requests, fixed: gen.fixed,
      faLast: [...gen.faLast], savedOff: gen.savedOff,
      extraGroups: gen.extraGroups, rules: gen.rules
    }));
  }catch(e){ /* localStorage indisponível: segue sem rascunho */ }
}
function genLoadDraft(){
  try{
    const raw = localStorage.getItem(GEN_DRAFT_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || d.v !== 1 || !Number.isInteger(d.month) || !Number.isInteger(d.year)) return null;
    return d;
  }catch(e){ return null; }
}
function genClearDraft(){
  try{ localStorage.removeItem(GEN_DRAFT_KEY); }catch(e){}
}
function genRestoreDraft(d){
  const ids = new Set(state.people.map(p => p.id));
  gen.year = d.year; gen.month = d.month;
  gen.selected = new Set((d.selected || []).filter(id => ids.has(id)));
  gen.requests = {};
  Object.keys(d.requests || {}).forEach(pid => {
    const days = (d.requests[pid] || []).filter(n => Number.isInteger(n));
    if(ids.has(pid) && days.length) gen.requests[pid] = new Set(days);
  });
  gen.fixed = (d.fixed || []).filter(r => ids.has(r.pid) && Array.isArray(r.dows))
    .map(r => ({ id: r.id || genUid(), pid: r.pid, dows: r.dows.filter(w => w >= 0 && w <= 6) }));
  gen.faLast = new Set((d.faLast || []).filter(id => ids.has(id)));
  gen.faRecorded = Array.isArray((state.faMonths || {})[genPrevMonthKey()]);
  gen.savedOff = d.savedOff || {};
  gen.extraGroups = (d.extraGroups || []).map(g => g.filter(id => ids.has(id))).filter(g => g.length >= 2);
  const r = d.rules || {};
  gen.rules = {
    offs: genClamp(r.offs || 8, 5, 9), maxWork: genClamp(r.maxWork || 5, 3, 7),
    maxSun: genClamp(r.maxSun || 5, 2, 8),
    maxPerDay: Number.isInteger(r.maxPerDay) ? Math.max(1, r.maxPerDay) : null
  };
  gen.step = genClamp(d.step || 0, 0, GEN_STEP_RULES);
  genNormalizeFixed();
}

// ---- abrir / fechar ----
function genOpen(){
  if(!state.people.length){
    showToast('Cadastre sua equipe na aba "Equipe" antes de gerar a escala.');
    return;
  }
  const rosterIds = ((state.monthRosters || {})[monthKey(calYear, calMonth)] || []).filter(id => state.people.some(p => p.id === id));
  gen = {
    step: 0, dir: 1, year: calYear, month: calMonth,
    selected: new Set(rosterIds.length ? rosterIds : state.people.map(p => p.id)),
    requests: {}, fixed: [], faLast: new Set(), savedOff: {}, extraGroups: [], draft: null, openReq: null,
    rules: { offs: 8, maxWork: 5, maxSun: 5, maxPerDay: null },
    result: null, runToken: 0
  };
  genPrefillRequests();
  genPrefillFa();
  const draft = genLoadDraft();
  if(draft) gen.resumePrompt = draft;
  document.getElementById('genOverlay').classList.add('active');
  pushOverlay('genOverlay');
  genRender(true);
}
function genClose(){
  const hadDraft = gen && !gen.applied && !gen.resumePrompt && !!genLoadDraft();
  document.getElementById('genOverlay').classList.remove('active');
  gen = null;
  if(hadDraft) showToast('Rascunho salvo. Você retoma de onde parou.');
}
registerOverlay('genOverlay', genClose);

// Aproveita os "dias desejados" que já estão marcados no mês, se houver.
function genPrefillRequests(){
  gen.requests = {};
  const prefix = monthKey(gen.year, gen.month) + '-';
  const req = state.requestedOffDays || {};
  state.people.forEach(p => {
    const days = (req[p.id] || []).filter(ds => ds.startsWith(prefix)).map(ds => parseInt(ds.slice(8), 10));
    if(days.length) gen.requests[p.id] = new Set(days);
  });
}

// Quem teve FA no mês anterior: vem da escala que o próprio gerador gravou
// naquele mês (state.faMonths). Se não houver registro, começa vazio e o usuário marca.
function genPrevMonthKey(){
  const d = new Date(gen.year, gen.month - 1, 1);
  return monthKey(d.getFullYear(), d.getMonth());
}
function genPrevMonthName(){
  const d = new Date(gen.year, gen.month - 1, 1);
  return MONTHS[d.getMonth()];
}
function genPrefillFa(){
  const saved = (state.faMonths || {})[genPrevMonthKey()];
  gen.faRecorded = Array.isArray(saved);
  gen.faLast = new Set(gen.faRecorded ? saved : []);
}
// Quem tem folga fixa no sábado (e não no domingo) tem FA todo mês.
function genFixedDowsByPid(){
  const map = {};
  gen.fixed.forEach(row => {
    if(!map[row.pid]) map[row.pid] = new Set();
    row.dows.forEach(w => map[row.pid].add(w));
  });
  return map;
}
function genFaMode(pid, fixedDows){
  if(fixedDows && fixedDows.has(0)) return 'never';
  if(fixedDows && fixedDows.has(6)) return 'must';
  return gen.faLast.has(pid) ? 'never' : 'must';
}

// ---- montagem da config para o motor ----
// Se a pessoa não tem NENHUMA folga registrada nas semanas anteriores, os dados do
// mês passado provavelmente não foram preenchidos — então não conta como "vem
// trabalhando sem parar" (isso forçaria folga geral no dia 1).
function genHasRecentOffs(personId, year, month, days){
  const first = iso(year, month, 1);
  const start = addDaysToIso(first, -days);
  return (state.offDays[personId] || []).some(ds => ds >= start && ds < first);
}
function genCarryWork(personId, year, month){
  if(!genHasRecentOffs(personId, year, month, 35)) return 0;
  let n = 0;
  let cur = addDaysToIso(iso(year, month, 1), -1);
  while(n < 12 && isWorkingDay(personId, cur)){ n++; cur = addDaysToIso(cur, -1); }
  return n;
}
function genCarrySundays(personId, year, month){
  if(!genHasRecentOffs(personId, year, month, 63)) return 0;
  const d = new Date(year, month, 1);
  d.setDate(d.getDate() - 1);
  while(d.getDay() !== 0) d.setDate(d.getDate() - 1);
  let n = 0;
  while(n < 12){
    if(!isWorkingDay(personId, iso(d.getFullYear(), d.getMonth(), d.getDate()))) break;
    n++;
    d.setDate(d.getDate() - 7);
  }
  return n;
}
function genActiveGroups(selectedIds){
  const groups = [];
  (state.coveragePairs || []).forEach(pair => {
    if(gen.savedOff[pair.id]) return;
    const members = pairMembers(pair).filter(id => selectedIds.includes(id));
    if(members.length >= 2) groups.push(members);
  });
  gen.extraGroups.forEach(g => {
    const members = g.filter(id => selectedIds.includes(id));
    if(members.length >= 2) groups.push(members);
  });
  return groups;
}
function genBuildConfig(){
  const { D, dows } = genDayInfo(gen.year, gen.month);
  const people = genSelectedPeople();
  const ids = people.map(p => p.id);
  const fixedByPid = {};
  gen.fixed.forEach(row => {
    if(!ids.includes(row.pid)) return;
    if(!fixedByPid[row.pid]) fixedByPid[row.pid] = new Set();
    row.dows.forEach(w => fixedByPid[row.pid].add(w));
  });
  const cfgPeople = people.map(p => {
    const fixedDows = fixedByPid[p.id] || new Set();
    const forced = new Array(D).fill(false);
    const fixedMask = new Array(D).fill(false);
    const reqMask = new Array(D).fill(false);
    for(let d = 0; d < D; d++){
      if(fixedDows.has(dows[d])){ forced[d] = true; fixedMask[d] = true; }
    }
    (gen.requests[p.id] ? [...gen.requests[p.id]] : []).forEach(day => {
      if(day >= 1 && day <= D){ forced[day - 1] = true; if(!fixedMask[day - 1]) reqMask[day - 1] = true; }
    });
    let forcedCount = 0, forcedSundays = 0;
    for(let d = 0; d < D; d++) if(forced[d]){ forcedCount++; if(dows[d] === 0) forcedSundays++; }
    return {
      id: p.id, name: p.name, forced, fixedMask, reqMask, forcedCount, forcedSundays,
      sunRule: !fixedDows.has(0),
      faMode: genFaMode(p.id, fixedDows),
      carryWork: genCarryWork(p.id, gen.year, gen.month),
      carrySun: genCarrySundays(p.id, gen.year, gen.month),
      K: Math.max(gen.rules.offs, forcedCount)
    };
  });
  const groups = genActiveGroups(ids).map(g => g.map(id => ids.indexOf(id)));
  return {
    year: gen.year, month: gen.month, D, dows, people: cfgPeople, groups,
    W: gen.rules.maxWork, SW: gen.rules.maxSun, M: genCurrentM(),
    rules: { offs: gen.rules.offs }, maxOffs: MAX_OFF_DAYS_PER_MONTH
  };
}

// ---- viabilidade das restrições de "não folgar junto" ----
// Em um grupo em que ninguém pode folgar no mesmo dia, cada folga de cada pessoa
// ocupa um dia só dela. Então a soma das folgas do grupo não pode passar do número
// de dias do mês. Também é impossível se duas pessoas do grupo já têm folga
// obrigatória (pedido ou folga fixa) no mesmo dia.
function genJoinNames(list){
  if(list.length <= 1) return list.join('');
  return list.slice(0, -1).join(', ') + ' e ' + list[list.length - 1];
}
function genGroupProblems(cfg, g){
  const reasons = [];
  const clashDays = [];
  for(let d = 0; d < cfg.D; d++){
    if(g.filter(i => cfg.people[i].forced[d]).length >= 2) clashDays.push(d + 1);
  }
  if(clashDays.length){
    reasons.push(`mais de uma pessoa com folga obrigatória no dia ${clashDays.slice(0, 3).join(', ')}${clashDays.length > 3 ? '…' : ''}`);
  }
  const need = g.reduce((sum, i) => sum + cfg.people[i].K, 0);
  if(need > cfg.D) reasons.push(`${g.length} pessoas precisam de ${need} folgas em dias diferentes e o mês tem ${cfg.D}`);
  return reasons;
}
function genFindImpossibleGroups(cfg){
  const found = [];
  cfg.groups.forEach(g => {
    const reasons = genGroupProblems(cfg, g);
    if(reasons.length) found.push({ names: g.map(i => cfg.people[i].name), reasons });
  });
  return found;
}
// Aviso curto para um grupo (lista de ids). Vazio quando é possível.
function genGroupWarn(ids){
  try{
    const cfg = genBuildConfig();
    const idx = ids.map(id => cfg.people.findIndex(P => P.id === id)).filter(i => i >= 0);
    if(idx.length < 2) return '';
    const r = genGroupProblems(cfg, idx);
    return r.length ? `<div class="gen-warn-note">⚠ Não dá: ${genEsc(r.join('; '))}.</div>` : '';
  }catch(e){ return ''; }
}
function genImpossibleHtml(){
  let bad;
  try{ bad = genFindImpossibleGroups(genBuildConfig()); }catch(e){ return ''; }
  return bad.map(b => `<div class="gen-warn-note" style="margin-bottom:10px;">⚠ <b>${genEsc(genJoinNames(b.names))}</b>: não dá, ${genEsc(b.reasons.join('; '))}.</div>`).join('');
}

// ---- renderização ----
function genRenderResume(animate){
  const d = gen.resumePrompt;
  const when = new Date(d.savedAt || Date.now()).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const step = GEN_STEPS[genClamp(d.step || 0, 0, GEN_STEP_RULES)];

    <div class="gen-group">

      </div>

}
function genRender(animate){
  if(!gen) return;
  if(gen.resumePrompt){ genRenderResume(animate); return; }
  const st = GEN_STEPS[gen.step];
  document.getElementById('genModal').classList.toggle('wide', gen.step === GEN_STEP_RESULT);
  document.getElementById('genEyebrow').textContent = `Passo ${gen.step + 1} de ${GEN_STEPS.length} · ${st.eyebrow}`;
  document.getElementById('genTitle').textContent = st.title;
  document.querySelectorAll('#genProgress span').forEach((el, i) => el.classList.toggle('done', i <= gen.step));
  const builders = [genStep0, genStep1, genStep2, genStepFa, genStep3, genStep4, genStep5];
  const body = document.getElementById('genBody');
  const cls = animate ? (gen.dir > 0 ? 'anim-fwd' : 'anim-back') : '';
  body.innerHTML = `<div class="gen-step ${cls}">${builders[gen.step]()}</div>`;
  if(animate) body.scrollTop = 0;
  genRenderFooter();
}

function genRenderFooter(){
  const foot = document.getElementById('genFoot');
  const s = gen.step;
  let h = '';
  if(s === 0){
    h = `<button class="btn-secondary" data-nav="close">Cancelar</button>
         <button class="btn-primary" data-nav="next" ${gen.selected.size ? '' : 'disabled'}>Continuar</button>`;
  }else if(s < GEN_STEP_RULES){
    h = `<button class="btn-secondary" data-nav="back">Voltar</button>
         <button class="btn-primary" data-nav="next">Continuar</button>`;
  }else if(s === GEN_STEP_RULES){
    h = `<button class="btn-secondary" data-nav="back">Voltar</button>
         <button class="btn-primary" data-nav="generate">✨ Gerar escala</button>`;
  }else{
    h = `<button class="btn-secondary" data-nav="adjust">‹ Ajustar</button>
         <button class="btn-secondary" data-nav="again" ${gen.result ? '' : 'disabled'}>🔀 Outra</button>
         <button class="btn-primary" data-nav="apply" ${gen.result ? '' : 'disabled'}>✓ Aplicar</button>`;
  }
  foot.innerHTML = h;
}

// Passo 1 — mês e pessoas
function genStep0(){
  const monthOpts = MONTHS.map((m, i) => `<option value="${i}" ${i === gen.month ? 'selected' : ''}>${capFirst(m)}</option>`).join('');

function genSum0Text(){

function genRefreshStep0(){

// Passo 2 — pedidos de dia específico
function genCalHtml(pid, set, D, dows){

  for(let i = 0; i < firstDow; i++) h += `<div class="blank"></div>`;
  for(let d = 1; d <= D; d++){
    const dw = dows[d - 1];
    h += `<button class="${dw === 0 || dw === 6 ? 'wk' : ''} ${set.has(d) ? 'on' : ''}" data-act="toggleReqDay" data-pid="${pid}" data-day="${d}">${d}</button>`;
  }
  return `<div class="gen-cal">${h}</div>`;
}
function genStep1(){
  const people = genSelectedPeople();
  const { D, dows } = genDayInfo(gen.year, gen.month);
  let html = `<p class="gen-lead">Alguém pediu um <b>dia específico</b> de folga em ${genMonthName()}? Toque no nome e marque os dias. Quem não pediu nada fica em branco.</p>`;

// Passo 4 — quem teve FA no mês passado (marcação manual)
function genFaPickable(){
  const fx = genFixedDowsByPid();
  return genSelectedPeople().filter(p => !(fx[p.id] && (fx[p.id].has(6) || fx[p.id].has(0))));
}
function genFaSummaryText(){
  const pickable = genFaPickable();
  const sem = pickable.filter(p => gen.faLast.has(p.id)).length;
  const fx = genFixedDowsByPid();
  const fixedSat = genSelectedPeople().filter(p => fx[p.id] && fx[p.id].has(6) && !fx[p.id].has(0)).length;
  const com = (pickable.length - sem) + fixedSat;
  return `<b>${com}</b> com FA em ${genMonthName()} · <b>${sem}</b> sem FA (já tiveram)`;
}
function genStepFa(){
  const fx = genFixedDowsByPid();
  const people = genSelectedPeople();
  const pickable = genFaPickable();
  const fixedSat = people.filter(p => fx[p.id] && fx[p.id].has(6) && !fx[p.id].has(0));
  let html = `<p class="gen-lead">A <b>FA</b> (folga agrupada) são 2 folgas seguidas: sábado e domingo, ou domingo e segunda. Cada pessoa tem uma por mês, alternando. Marque <b>quem teve FA em ${genPrevMonthName()}</b>: essas pessoas ficam sem FA em ${genMonthName()}.</p>`;
  html += `<p class="mini-hint" style="margin-top:-6px;">${gen.faRecorded ? `Já marcado a partir da escala gerada em ${genPrevMonthName()}. Confira e corrija se precisar.` : `Não tenho registro de ${genPrevMonthName()}. Marque manualmente.`}</p>`;
  const groups = {};
  pickable.forEach(p => { const g = genGroupOf(p); (groups[g] = groups[g] || []).push(p); });
  [...GEN_GROUP_ORDER, 'none'].forEach(gid => {
    const list = groups[gid];
    if(!list) return;
    const f = fnById(gid);
    html += `<div class="gen-group">
      <div class="gen-group-head"><span class="dot" style="background:${f ? f.hex : '#64748B'}"></span><span class="gname">${f ? f.name : 'Sem função'}</span></div>
      <div class="gen-pills">${list.map(p => `<button class="gen-pill ${gen.faLast.has(p.id) ? 'on' : ''}" data-act="faToggle" data-pid="${p.id}"><span class="gen-check">✓</span>${genEsc(p.name)}</button>`).join('')}</div>
    </div>`;
  });
  if(fixedSat.length){
    html += `<div class="gen-warn-note" style="color:var(--text-dim); background:var(--surface-2); border-color:var(--border);">Folga fixa no sábado, com FA todo mês: <b style="color:var(--text);">${fixedSat.map(p => genEsc(p.name)).join(', ')}</b></div>`;
  }
  html += `<div class="gen-summary" id="genSumFa">${genFaSummaryText()}</div>`;
  return html;
}

// Passo 5 — restrições de "não folgar junto"
function genStep3(){
  const ids = genSelectedPeople().map(p => p.id);
  const nameOf = id => { const p = state.people.find(x => x.id === id); return p ? p.name : '?'; };
  const saved = (state.coveragePairs || []).map(pair => ({ pair, members: pairMembers(pair).filter(id => ids.includes(id)) })).filter(x => x.members.length >= 2);
  let html = `<p class="gen-lead">Marque quem <b>não pode folgar no mesmo dia</b>. Podem ser 2, 3, 4 ou mais pessoas por restrição. O gerador evita esses encontros.</p>`;
  if(saved.length){
    html += `<div class="gen-sec-title">Restrições já cadastradas</div>`;
    saved.forEach(({ pair, members }) => {
      const on = !gen.savedOff[pair.id];
      html += `<div class="gen-check-row ${on ? 'on' : 'off'}" data-act="savedToggle" data-id="${pair.id}">
        <span class="gen-tick">✓</span>
        <span class="ctext">${members.map(id => genEsc(nameOf(id))).join(' ⇄ ')}</span>
      </div>${on ? genGroupWarn(members) : ''}`;
    });
  }
  if(gen.extraGroups.length){
    html += `<div class="gen-sec-title">Novas, só para esta escala</div>`;
    gen.extraGroups.forEach((g, i) => {
      const members = g.filter(id => ids.includes(id));
      html += `<div class="gen-check-row on" style="cursor:default;">
        <span class="gen-tick">✓</span>
        <span class="ctext">${members.map(id => genEsc(nameOf(id))).join(' ⇄ ')}</span>
        <button class="gen-x" data-act="extraRemove" data-i="${i}" title="Remover">✕</button>
      </div>${members.length >= 2 ? genGroupWarn(members) : ''}`;
    });
  }
  if(gen.draft){
    html += `<div class="gen-draft">
      <div class="gen-sec-title" style="margin-top:0;">Marque 2 ou mais pessoas</div>
      <div class="gen-pills">${genSelectedPeople().map(p => `<button class="gen-pill ${gen.draft.has(p.id) ? 'on' : ''}" data-act="draftToggle" data-pid="${p.id}"><span class="gen-check">✓</span>${genEsc(p.name)}</button>`).join('')}</div>
      <div id="genDraftWarn">${gen.draft.size >= 2 ? genGroupWarn([...gen.draft]) : ''}</div>
      <div class="gen-draft-actions">
        <button class="btn-secondary" data-act="draftCancel">Cancelar</button>
        <button class="btn-primary" id="genDraftAdd" data-act="draftAdd" ${gen.draft.size >= 2 ? '' : 'disabled'}>Adicionar</button>
      </div>
    </div>`;
  }else{
    html += `<button class="gen-add-btn" data-act="draftStart" style="margin-top:6px;">+ Nova restrição</button>`;
  }
  if(!saved.length && !gen.extraGroups.length && !gen.draft){
    html += `<p class="mini-hint" style="margin-top:12px;">Nenhuma restrição ainda. Se não houver, é só continuar.</p>`;
  }
  return html;
}

// Passo 5 — regras
function genStep4(){
  const N = genSelectedPeople().length;
  const { D } = genDayInfo(gen.year, gen.month);
  const r = gen.rules;
  const autoM = genAutoM();
  const stepper = (key, val) => `<div class="gen-stepper">
      <button data-act="step" data-key="${key}" data-d="-1">−</button><span class="val">${val}</span><button data-act="step" data-key="${key}" data-d="1">+</button>
    </div>`;
  return `${genImpossibleHtml()}
    <div class="gen-rule">
      <div class="rtext"><div class="rtitle">Folgas por pessoa</div></div>
      ${stepper('offs', r.offs)}
    </div>
    <div class="gen-rule">
      <div class="rtext"><div class="rtitle">Máx. dias seguidos trabalhando</div></div>
      ${stepper('maxWork', r.maxWork)}
    </div>
    <div class="gen-rule">
      <div class="rtext"><div class="rtitle">Máx. pessoas de folga no mesmo dia</div>${r.maxPerDay == null ? '' : `<div class="rhint"><button class="gen-link-btn" data-act="autoM" style="padding:0;">usar automático (${autoM})</button></div>`}</div>
      ${stepper('maxPerDay', genCurrentM())}
    </div>`;
}

// Passo 6 — resultado
function genStep5(){
  if(!gen.result){
    return `<div class="gen-loading"><div class="gen-spinner"></div><p>Montando a escala…</p><div class="sub">Equilibrando folgas e respeitando as regras</div></div>`;
  }
  const { cfg, sol } = gen.result;
  const { D, dows } = cfg;
  const issues = sol.issues;
  const totalOffs = sol.offs.reduce((acc, a) => acc + a.filter(Boolean).length, 0);
  const faInfo = cfg.people.map((P, i) => genFaFirstDays(sol.offs[i], dows));
  const faLabel = cfg.people.map((P, i) => genFaLabelDays(sol.offs[i], dows));
  const withFa = faInfo.filter(l => l.length > 0).length;
  const maxLoad = Math.max(...sol.load);
  let verdict;
  if(!issues.length){
    verdict = `<div class="gen-verdict ok"><span class="vicon">✅</span><div><div class="vtitle">Todas as regras foram respeitadas</div></div></div>`;
  }else{
    const shown = issues.slice(0, 6).map(t => `<div>${genEsc(t)}</div>`).join('');
    const more = issues.length > 6 ? `<div>e mais ${issues.length - 6} ponto(s)</div>` : '';
    verdict = `<div class="gen-verdict warn"><span class="vicon">⚠️</span><div><div class="vtitle">Gerada com ${issues.length} ponto${issues.length > 1 ? 's' : ''} de atenção</div>
      <div class="vlist">${shown}${more}</div><div class="vlist" style="margin-top:8px;">Toque em “Outra” para tentar uma variação.</div></div></div>`;
  }
  let head = `<th class="nm">Nome</th>`;
  for(let d = 1; d <= D; d++){
    head += `<th class="dh ${(dows[d-1] === 0 || dows[d-1] === 6) ? 'wknd' : ''}"><span class="dn">${d}</span><span class="dw">${DOW[dows[d-1]].charAt(0)}</span></th>`;
  }
  head += `<th class="tot">Fol.</th>`;
  let rows = '';
  cfg.people.forEach((P, i) => {
    const a = sol.offs[i];
    const count = a.filter(Boolean).length;
    let cells = '';
    for(let d = 0; d < D; d++){
      const isFa = faLabel[i].includes(d);
      const cls = isFa ? 'fa' : (P.reqMask[d] ? 'req' : '');
      const delay = Math.min(i * 24 + d * 7, 600);
      const label = isFa ? 'FA' : 'F';
      cells += `<td class="c ${(dows[d] === 0 || dows[d] === 6) ? 'wknd' : ''}">${a[d] ? `<span class="gen-cell ${cls}" style="animation-delay:${delay}ms">${label}</span>` : ''}</td>`;
    }
    rows += `<tr><td class="nm" title="${genEsc(P.name)}">${genEsc(P.name)}</td>${cells}<td class="tot ${count < cfg.rules.offs ? 'bad' : ''}">${count}</td></tr>`;
  });
  let foot = `<tr class="foot"><td class="nm">Folgam</td>`;
  for(let d = 0; d < D; d++) foot += `<td class="${sol.load[d] > cfg.M ? 'over' : ''}">${sol.load[d]}</td>`;
  foot += `<td></td></tr>`;
  return `${verdict}
    <div class="gen-table-wrap"><table class="gen-table"><thead><tr>${head}</tr></thead><tbody>${rows}${foot}</tbody></table></div>
    <div class="gen-legend">
      <span><i style="background:var(--c-folga)"></i>Folga</span>
      <span><i style="background:var(--accent)"></i>FA (folga agrupada)</span>
      <span><i style="background:var(--c-desejada)"></i>Dia pedido</span>
      <span><i style="background:rgba(255,107,53,0.25)"></i>Fim de semana</span>
    </div>`;
}

// ---- gerar / aplicar ----
async function genGenerate(animate){
  if(!gen) return;
  const token = ++gen.runToken;
  gen.result = null;
  genRender(!!animate);
  await genTick();
  await new Promise(r => setTimeout(r, 450)); // deixa a animação de carregamento respirar
  if(!gen || token !== gen.runToken) return;
  let result;
  try{
    const cfg = genBuildConfig();
    const sol = await genRun(cfg, (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
    result = { cfg, sol };
  }catch(err){
    console.error('Falha ao gerar escala:', err);
    if(gen){ showToast('Não consegui gerar a escala. Confira as opções e tente de novo.'); genGo(GEN_STEP_RULES, -1); }
    return;
  }
  if(!gen || token !== gen.runToken) return;
  gen.result = result;
  genRender(false);
  document.getElementById('genBody').scrollTop = 0;
}

function genApply(){
  if(!gen || !gen.result) return;
  const { cfg, sol } = gen.result;
  const { year, month } = cfg;
  const key = monthKey(year, month);
  const prefix = key + '-';
  const hasExisting = cfg.people.some(P => (state.offDays[P.id] || []).some(ds => ds.startsWith(prefix)));
  if(hasExisting && !confirm(`Isso vai substituir as folgas atuais das pessoas selecionadas em ${MONTHS[month]} de ${year}. Continuar?`)) return;

  if(!state.publishedMonths) state.publishedMonths = [];
  if(!state.publishedMonths.includes(key)) state.publishedMonths.push(key);
  if(!state.monthRosters) state.monthRosters = {};
  if(!state.monthRosters[key]) state.monthRosters[key] = [];
  if(!state.requestedOffDays) state.requestedOffDays = {};
  if(!state.faMonths) state.faMonths = {};
  const selectedIds = cfg.people.map(P => P.id);
  const faIds = cfg.people.filter((P, i) => genFaFirstDays(sol.offs[i], cfg.dows).length > 0).map(P => P.id);
  state.faMonths[key] = (state.faMonths[key] || []).filter(id => !selectedIds.includes(id)).concat(faIds);

  cfg.people.forEach((P, i) => {
    const keepOther = (state.offDays[P.id] || []).filter(ds => !ds.startsWith(prefix));
    const newDays = [];
    sol.offs[i].forEach((isOffDay, d) => { if(isOffDay) newDays.push(iso(year, month, d + 1)); });
    state.offDays[P.id] = keepOther.concat(newDays);

    const reqKeep = (state.requestedOffDays[P.id] || []).filter(ds => !ds.startsWith(prefix));
    const reqNew = (gen.requests[P.id] ? [...gen.requests[P.id]] : [])
      .filter(day => day >= 1 && day <= cfg.D && sol.offs[i][day - 1])
      .map(day => iso(year, month, day));
    const reqAll = reqKeep.concat(reqNew);
    if(reqAll.length) state.requestedOffDays[P.id] = reqAll; else delete state.requestedOffDays[P.id];

    if(!state.monthRosters[key].includes(P.id)) state.monthRosters[key].push(P.id);
  });

  saveState();
  calYear = year; calMonth = month;
  saveUiState();
  render();
  gen.applied = true;
  genClearDraft();
  requestCloseOverlay('genOverlay');
  showToast('Escala gerada e aplicada ✓');
}

function genGo(step, dir){
  if(!gen) return;
  gen.dir = dir;
  gen.step = step;
  gen.runToken++;
  if(step >= 2) genNormalizeFixed();
  genSaveDraft();
  if(step === GEN_STEP_RESULT){ genGenerate(true); return; }
  genRender(true);
}

// ---- eventos (delegação: ligados uma vez só) ----
(function genWireEvents(){
  const body = document.getElementById('genBody');
  const foot = document.getElementById('genFoot');

  document.getElementById('genCloseBtn').addEventListener('click', ()=>{
    requestCloseOverlay('genOverlay');
  });

  foot.addEventListener('click', (e)=>{
    if(!gen) return;
    const btn = e.target.closest('[data-nav]');
    if(!btn || btn.disabled) return;
    switch(btn.dataset.nav){
      case 'close':    requestCloseOverlay('genOverlay'); break;
      case 'resume':
        genRestoreDraft(gen.resumePrompt);
        gen.resumePrompt = null;
        gen.dir = 1;
        genRender(true);
        break;
      case 'fresh':
        genClearDraft();
        gen.resumePrompt = null;
        gen.dir = 1;
        genRender(true);
        break;
      case 'next':     genGo(gen.step + 1, 1); break;
      case 'back':     genGo(gen.step - 1, -1); break;
      case 'generate': {
        let bad = [];
        try{ bad = genFindImpossibleGroups(genBuildConfig()); }catch(err){ bad = []; }
        if(bad.length && !confirm(`Há ${bad.length} restrição${bad.length > 1 ? 'ões' : ''} de "não folgar junto" impossível${bad.length > 1 ? 'is' : ''} de cumprir. A escala vai sair com folgas juntas. Gerar mesmo assim?`)) break;
        genGo(GEN_STEP_RESULT, 1);
        break;
      }
      case 'adjust':   genGo(GEN_STEP_RULES, -1); break;
      case 'again':    genGenerate(false); break;
      case 'apply':    genApply(); break;
    }
  });

  body.addEventListener('change', (e)=>{
    if(!gen) return;
    const t = e.target;
    if(t.id === 'genMonth'){
      gen.month = parseInt(t.value, 10);
      genPrefillRequests();
      genPrefillFa();
      const sum = document.getElementById('genSum0'); if(sum) sum.innerHTML = genSum0Text();
    }else if(t.id === 'genYear'){
      const y = parseInt(t.value, 10);
      if(!Number.isInteger(y) || y < 2020 || y > 2100){ t.value = gen.year; showToast('Confira o ano.'); return; }
      gen.year = y;
      genPrefillRequests();
      genPrefillFa();
      const sum = document.getElementById('genSum0'); if(sum) sum.innerHTML = genSum0Text();
    }else if(t.dataset.act === 'fixedPerson'){
      const row = gen.fixed.find(r => r.id === t.dataset.rid);
      if(row) row.pid = t.value;
    }
    genSaveDraft();
  });

  const genOnBodyClick = (e)=>{
    if(!gen) return;
    const el = e.target.closest('[data-act]');
    if(!el || el.tagName === 'SELECT') return;
    const act = el.dataset.act;

    if(act === 'togglePerson'){
      const pid = el.dataset.pid;
      if(gen.selected.has(pid)) gen.selected.delete(pid); else gen.selected.add(pid);
      el.classList.toggle('on', gen.selected.has(pid));
      genRefreshStep0();
    }
    else if(act === 'groupAll'){
      const gid = el.dataset.gid;
      const list = state.people.filter(p => genGroupOf(p) === gid);
      const allOn = list.every(p => gen.selected.has(p.id));
      list.forEach(p => { if(allOn) gen.selected.delete(p.id); else gen.selected.add(p.id); });
      el.closest('.gen-group').querySelectorAll('.gen-pill').forEach(pill => pill.classList.toggle('on', gen.selected.has(pill.dataset.pid)));
      genRefreshStep0();
    }
    else if(act === 'faToggle'){
      const pid = el.dataset.pid;
      if(gen.faLast.has(pid)) gen.faLast.delete(pid); else gen.faLast.add(pid);
      el.classList.toggle('on', gen.faLast.has(pid));
      const sum = document.getElementById('genSumFa');
      if(sum) sum.innerHTML = genFaSummaryText();
    }
    else if(act === 'toggleAcc'){
      const pid = el.dataset.pid;
      const acc = el.closest('.gen-acc');
      const wasOpen = acc.classList.contains('open');
      body.querySelectorAll('.gen-acc.open').forEach(a => a.classList.remove('open'));
      if(!wasOpen){ acc.classList.add('open'); gen.openReq = pid; } else gen.openReq = null;
    }
    else if(act === 'toggleReqDay'){
      const pid = el.dataset.pid, day = parseInt(el.dataset.day, 10);
      let set = gen.requests[pid];
      if(!set) set = gen.requests[pid] = new Set();
      if(set.has(day)) set.delete(day); else set.add(day);
      el.classList.toggle('on', set.has(day));
      if(set.size === 0) delete gen.requests[pid];
      const badge = el.closest('.gen-acc').querySelector('.gen-badge');
      badge.textContent = set.size ? `${set.size} dia${set.size > 1 ? 's' : ''}` : 'nenhum';
      badge.classList.toggle('has', set.size > 0);
    }
    else if(act === 'fixedAdd'){
      const people = genSelectedPeople();
      const used = gen.fixed.map(r => r.pid);
      const pick = people.find(p => !used.includes(p.id)) || people[0];
      gen.fixed.push({ id: genUid(), pid: pick.id, dows: [6] });
      genRender(false);
      body.scrollTop = body.scrollHeight;
    }
    else if(act === 'fixedRemove'){
      gen.fixed = gen.fixed.filter(r => r.id !== el.dataset.rid);
      genRender(false);
    }
    else if(act === 'fixedDow'){
      const row = gen.fixed.find(r => r.id === el.dataset.rid);
      if(!row) return;
      const w = parseInt(el.dataset.dow, 10);
      const idx = row.dows.indexOf(w);
      if(idx >= 0) row.dows.splice(idx, 1); else row.dows.push(w);
      el.classList.toggle('on', row.dows.includes(w));
    }
    else if(act === 'savedToggle'){
      const id = el.dataset.id;
      gen.savedOff[id] = !gen.savedOff[id];
      el.classList.toggle('on', !gen.savedOff[id]);
      el.classList.toggle('off', !!gen.savedOff[id]);
    }
    else if(act === 'extraRemove'){
      gen.extraGroups.splice(parseInt(el.dataset.i, 10), 1);
      genRender(false);
    }
    else if(act === 'draftStart'){
      gen.draft = new Set();
      genRender(false);
      body.scrollTop = body.scrollHeight;
    }
    else if(act === 'draftToggle'){
      const pid = el.dataset.pid;
      if(gen.draft.has(pid)) gen.draft.delete(pid); else gen.draft.add(pid);
      el.classList.toggle('on', gen.draft.has(pid));
      const add = document.getElementById('genDraftAdd');
      if(add) add.disabled = gen.draft.size < 2;
      const dw = document.getElementById('genDraftWarn');
      if(dw) dw.innerHTML = gen.draft.size >= 2 ? genGroupWarn([...gen.draft]) : '';
    }
    else if(act === 'draftAdd'){
      if(!gen.draft || gen.draft.size < 2) return;
      gen.extraGroups.push([...gen.draft]);
      gen.draft = null;
      genRender(false);
    }
    else if(act === 'draftCancel'){
      gen.draft = null;
      genRender(false);
    }
    else if(act === 'step'){
      const key = el.dataset.key, dlt = parseInt(el.dataset.d, 10);
      const limits = { offs: [5, 9], maxWork: [3, 7], maxSun: [2, 8] };
      if(key === 'maxPerDay'){
        const N = Math.max(1, genSelectedPeople().length);
        gen.rules.maxPerDay = genClamp(genCurrentM() + dlt, 1, N);
      }else if(limits[key]){
        gen.rules[key] = genClamp(gen.rules[key] + dlt, limits[key][0], limits[key][1]);
      }
      genRender(false);
    }
    else if(act === 'autoM'){
      gen.rules.maxPerDay = null;
      genRender(false);
    }
  };
  body.addEventListener('click', (e)=>{ genOnBodyClick(e); genSaveDraft(); });

  document.getElementById('genOpenBtn').addEventListener('click', genOpen);
})();


// ---------- Exportar a escala do mês em PDF ----------
// Gerador de PDF próprio (sem biblioteca externa, funciona offline). Desenha uma
// tabela em A4 paisagem: matrícula, nome, um quadradinho por dia e total de folgas,
// agrupada por função. O layout segue o mesmo padrão que o "Importar PDF" entende

// F/FA na coluna do dia), então o PDF exportado também pode ser importado de volta.

// Larguras da Helvetica (AFM, unidades de 1/1000 em), caracteres 32 a 126.

function pdfCharWidth(ch, bold){
  let code = ch.charCodeAt(0);
  if(code < 32 || code > 126){
    const base = ch.normalize('NFD').charAt(0);
    code = base.charCodeAt(0);
    if(code < 32 || code > 126) return 556;
  }
  return (bold ? PDF_WIDTHS_BOLD : PDF_WIDTHS_REG)[code - 32];
}
function pdfTextWidth(str, size, bold){
  let w = 0;
  for(const ch of String(str)) w += pdfCharWidth(ch, bold);
  return w * size / 1000;
}
function pdfFit(str, maxW, size, bold){
  str = String(str);
  if(pdfTextWidth(str, size, bold) <= maxW) return str;
  while(str.length > 1 && pdfTextWidth(str + '...', size, bold) > maxW) str = str.slice(0, -1);
  return str.trimEnd() + '...';
}
// Texto -> bytes WinAnsi (os acentos do português cabem direto), com escape de ( ) \
function pdfEncode(str){
  const special = { '’':'\x92', '‘':'\x91', '“':'\x93', '”':'\x94', '–':'\x96', '—':'\x97', '•':'\x95', '…':'\x85' };
  let out = '';
  for(const ch of String(str)){
    const code = ch.charCodeAt(0);
    if(special[ch]) out += special[ch];
    else if(code < 32 || (code >= 127 && code < 160)) out += ' ';
    else if(code > 255) out += '?';
    else if(ch === '(' || ch === ')' || ch === '\\') out += '\\' + ch;
    else out += ch;
  }
  return out;
}
function pdfColor(hex){
  const n = parseInt(hex.replace('#', ''), 16);
  const f = v => (v / 255).toFixed(3);
  return `${f((n >> 16) & 255)} ${f((n >> 8) & 255)} ${f(n & 255)}`;
}

function PdfDoc(W, H){ this.W = W; this.H = H; this.pages = []; this.cur = null; }
PdfDoc.prototype.addPage = function(){ this.cur = []; this.pages.push(this.cur); };
// coordenadas "de cima para baixo" (y = distância do topo da página)
PdfDoc.prototype.rect = function(x, y, w, h, fill, stroke, lw){
  const ops = [];
  if(fill) ops.push(`${pdfColor(fill)} rg`);
  if(stroke) ops.push(`${pdfColor(stroke)} RG ${lw || 0.4} w`);
  ops.push(`${x.toFixed(2)} ${(this.H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill && stroke ? 'B' : (fill ? 'f' : 'S')}`);
  this.cur.push(ops.join(' '));
};
PdfDoc.prototype.line = function(x1, y1, x2, y2, color, lw){
  this.cur.push(`${pdfColor(color)} RG ${lw || 0.4} w ${x1.toFixed(2)} ${(this.H - y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H - y2).toFixed(2)} l S`);
};
PdfDoc.prototype.text = function(x, baseline, str, size, bold, color){
  if(str === '' || str == null) return;
  this.cur.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${pdfColor(color || '#111827')} rg ${x.toFixed(2)} ${(this.H - baseline).toFixed(2)} Td (${pdfEncode(str)}) Tj ET`);
};
PdfDoc.prototype.textCenter = function(cx, baseline, str, size, bold, color){
  const w = pdfTextWidth(str, size, bold);
  this.text(cx - w / 2, baseline, str, size, bold, color);
};
PdfDoc.prototype.build = function(){
  const objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  let next = 5;
  const pageNums = [];
  this.pages.forEach(ops => {
    const pageNo = next++, contentNo = next++;
    pageNums.push(pageNo);
    const stream = ops.join('\n');
    objs[contentNo] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
    objs[pageNo] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${contentNo} 0 R >>`;
  });
  objs[2] = `<< /Type /Pages /Kids [${pageNums.map(n => n + ' 0 R').join(' ')}] /Count ${pageNums.length} >>`;
  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = [];
  for(let i = 1; i < objs.length; i++){
    offsets[i] = out.length;
    out += `${i} 0 obj\n${objs[i]}\nendobj\n`;
  }
  const xref = out.length;
  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for(let i = 1; i < objs.length; i++) out += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
};

function buildEscalaPdf(year, month){
  const roster = sortPeople(rosterPeopleFor(year, month));
  if(!roster.length) return null;
  const D = new Date(year, month + 1, 0).getDate();
  const dows = [];
  for(let d = 1; d <= D; d++) dows.push(new Date(year, month, d).getDay());

  // agrupa por função (mesma ordem do assistente)
  const groups = [];
  [...GEN_GROUP_ORDER, 'none'].forEach(gid => {
    const list = roster.filter(p => genGroupOf(p) === gid);
    if(list.length) groups.push({ gid, fn: fnById(gid), list });
  });

  // dados de cada pessoa
  const info = {};
  roster.forEach(p => {
    const offs = [], absent = [];
    for(let d = 1; d <= D; d++){
      const ds = iso(year, month, d);
      offs.push(isOff(p.id, ds));
      absent.push(isAbsent(p.id, ds));
    }
    const faSet = new Set(genFaLabelDays(offs, dows));
    const reqSet = new Set();
    for(let d = 1; d <= D; d++) if(isRequestedOff(p.id, iso(year, month, d))) reqSet.add(d - 1);
    info[p.id] = { offs, absent, faSet, reqSet, total: offs.filter(Boolean).length };
  });

  const W = 841.89, H = 595.28, M = 24;
  const hasReg = roster.some(p => (p.registration || '').trim());
  const matrW = hasReg ? 40 : 0, nameW = 132, totW = 24;
  const dayW = (W - 2 * M - matrW - nameW - totW) / D;
  const dx0 = M + matrW + nameW;                 // x do primeiro dia
  const tableW = W - 2 * M;

  // altura das linhas: reduz um pouco para caber numa página só (o importador lê 1 página)
  const nPeople = roster.length, nBands = 0; // sem faixas de função no PDF
  const titleBlock = 46, colHeadH = 26, footRowH = 15, legendH = 24;
  const tableTop1 = M + titleBlock;
  const avail1 = H - M - legendH - footRowH - (tableTop1 + colHeadH);
  const nominal = nPeople * 16 + nBands * 13;
  let f = 1;
  if(nominal > avail1) f = Math.max(0.78, avail1 / nominal);
  const pRow = 16 * f, bRow = 13 * f, fs = Math.max(0.85, f);

  const doc = new PdfDoc(W, H);
  const mesNome = capFirst(MONTHS[month]);
  const now = new Date();
  const stamp = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  function drawTitle(first){
    if(first){
      let x = M;
      doc.text(x, M + 15, 'Escala de folgas', 16, true, '#111827');
      x += pdfTextWidth('Escala de folgas', 16, true) + 8;
      doc.text(x, M + 15, '·', 16, true, '#9CA3AF');
      x += pdfTextWidth('·', 16, true) + 8;
      doc.text(x, M + 15, mesNome, 16, true, '#EA580C');
      x += pdfTextWidth(mesNome, 16, true) + 10;
      doc.text(x, M + 15, String(year), 16, false, '#EA580C'); // fonte diferente: o ano vira um item de texto separado (o importador precisa disso)
      doc.text(M, M + 30, `${nPeople} pessoa${nPeople > 1 ? 's' : ''} na escala · gerado em ${stamp}`, 8.5, false, '#6B7280');
    }else{
      doc.text(M, M + 10, `Escala de folgas · ${mesNome} ${year} (continuação)`, 10, true, '#111827');
    }
  }
  function drawColHeader(y){
    doc.rect(M, y, tableW, colHeadH, '#E5E7EB');
    if(hasReg) doc.text(M + 3, y + 16, 'Matr.', 7.5, true, '#374151');
    doc.text(M + matrW + 3, y + 16, 'Nome', 7.5, true, '#374151');
    for(let d = 0; d < D; d++){
      const x = dx0 + d * dayW;
      if(dows[d] === 0 || dows[d] === 6) doc.rect(x, y, dayW, colHeadH, '#FDDCC5');
      doc.textCenter(x + dayW / 2, y + 12, String(d + 1), 8, true, '#111827');
      doc.textCenter(x + dayW / 2, y + 21, DOW[dows[d]].charAt(0).toUpperCase(), 6.5, false, '#6B7280');
    }
    doc.textCenter(dx0 + D * dayW + totW / 2, y + 16, 'Fol.', 7.5, true, '#374151');
    doc.line(M, y + colHeadH, M + tableW, y + colHeadH, '#9CA3AF', 0.6);
  }
  function drawBand(y, g){
    doc.rect(M, y, tableW, bRow, '#F3F4F6');
    doc.rect(M + 3, y + (bRow - 5) / 2, 5, 5, g.fn ? g.fn.hex : '#64748B');
    doc.text(M + 12, y + bRow / 2 + 2.6, `${g.fn ? g.fn.name : 'Sem função'} (${g.list.length})`, 7.5 * fs, true, '#374151');
  }
  function drawPerson(y, p){
    const inf = info[p.id];
    const baseline = y + pRow / 2 + 2.6 * fs;
    if(hasReg) doc.text(M + 3, baseline, (p.registration || '').trim(), 7.5 * fs, false, '#374151');
    doc.text(M + matrW + 3, baseline, pdfFit(p.name, nameW - 6, 8.5 * fs, false), 8.5 * fs, false, '#111827');
    for(let d = 0; d < D; d++){
      const x = dx0 + d * dayW;
      let fill = null, label = '', lcolor = '#111827';
      if(inf.offs[d]){
        const isFa = inf.faSet.has(d);
        fill = isFa ? '#FF6B35' : (inf.reqSet.has(d) ? '#38BDF8' : '#CBD5E1');
        label = isFa ? 'FA' : 'F';
      }
      else if(inf.absent[d]){ fill = '#FCA5A5'; label = 'FT'; lcolor = '#7F1D1D'; }
      else if(dows[d] === 0 || dows[d] === 6) fill = '#FFF4EC';
      doc.rect(x, y, dayW, pRow, fill, '#D1D5DB', 0.3);
      if(label) doc.text(x + (dayW - pdfTextWidth(label, 7 * fs, true)) / 2, baseline, label, 7 * fs, true, lcolor);
    }
    doc.textCenter(dx0 + D * dayW + totW / 2, baseline, String(inf.total), 8 * fs, true, '#111827');
    doc.line(M, y + pRow, M + matrW + nameW, y + pRow, '#D1D5DB', 0.3);
    doc.line(dx0 + D * dayW, y + pRow, M + tableW, y + pRow, '#D1D5DB', 0.3);
  }
  function drawFootRow(y){
    doc.rect(M, y, tableW, footRowH, '#E5E7EB');
    doc.text(M + 3, y + 10.5, 'Folgam', 7.5, true, '#374151');
    let sum = 0;
    for(let d = 0; d < D; d++){
      let n = 0;
      roster.forEach(p => { if(info[p.id].offs[d]) n++; });
      sum += n;
      doc.textCenter(dx0 + d * dayW + dayW / 2, y + 10.5, String(n), 7.5, true, '#111827');
    }
    doc.textCenter(dx0 + D * dayW + totW / 2, y + 10.5, String(sum), 7.5, true, '#111827');
  }
  function drawLegend(){
    let x = M;
    const y = H - M - 4;
    const items = [['#CBD5E1', 'F  Folga'], ['#FF6B35', 'FA  Folga agrupada'], ['#38BDF8', 'Dia pedido'], ['#FCA5A5', 'FT  Falta'], ['#FFF4EC', 'Fim de semana']];
    items.forEach(([c, label]) => {
      doc.rect(x, y - 7, 9, 9, c, '#9CA3AF', 0.4);
      doc.text(x + 13, y, label, 7.5, false, '#374151');
      x += 13 + pdfTextWidth(label, 7.5, false) + 16;
    });
  }

  // ---- paginação ----
  let pageIdx = 0;
  let y;
  function newPage(){
    doc.addPage();
    pageIdx++;
    drawTitle(pageIdx === 1);
    y = pageIdx === 1 ? tableTop1 : M + 16;
    drawColHeader(y);
    y += colHeadH;
  }
  const limit = H - M - legendH - footRowH;
  newPage();
  groups.forEach(g => {
    g.list.forEach(p => {
      if(y + pRow > limit) newPage();
      drawPerson(y, p);
      y += pRow;
    });
  });
  drawFootRow(y);
  drawLegend();
  doc.text(W - M - pdfTextWidth('Folgas e faltas conforme a escala do app', 7.5, false), H - M - 4, 'Folgas e faltas conforme a escala do app', 7.5, false, '#9CA3AF');

  const fname = `escala-${normalizeText(MONTHS[month])}-${year}.pdf`;
  return { bytes: doc.build(), filename: fname };
}

function downloadPdfBytes(bytes, filename){
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function exportPdfForMonth(y, m){
  try{
    const res = buildEscalaPdf(y, m);
    if(!res){
      showToast('Ninguém está incluído na escala deste mês ainda.');
      return;
    }
    downloadPdfBytes(res.bytes, res.filename);
    showToast('PDF da escala gerado ✓');
  }catch(err){
    console.error('Falha ao exportar PDF:', err);
    showToast('Não consegui gerar o PDF. Tente de novo.');
  }
}

// Só o mês atual e o próximo (se já tiver escala) podem ser exportados.
// Meses que já acabaram não ficam mais disponíveis.
function exportableMonths(){
  const now = new Date();
  const out = [];
  for(let i = 0; i < 2; i++){
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const y = d.getFullYear(), m = d.getMonth();
    if(rosterPeopleFor(y, m).length) out.push({ y, m, label: `${capFirst(MONTHS[m])} de ${y}`, current: i === 0 });
  }
  return out;
}

function closeExportMonthModal(){
  document.getElementById('exportMonthOverlay').classList.remove('active');
}
registerOverlay('exportMonthOverlay', closeExportMonthModal);

document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
  const months = exportableMonths();
  if(!months.length){
    showToast('Nenhum mês disponível para exportar: o mês atual e o próximo ainda não têm ninguém na escala.');
    return;
  }
  const list = document.getElementById('exportMonthList');
  list.innerHTML = months.map((x, i) =>
    `<button class="btn-secondary" data-i="${i}" style="width:100%; text-align:left; padding:14px;">${x.label}<span style="color:var(--text-faint); font-weight:500;"> · ${x.current ? 'mês atual' : 'próximo mês'}</span></button>`
  ).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const x = months[Number(btn.dataset.i)];
      requestCloseOverlay('exportMonthOverlay');
      exportPdfForMonth(x.y, x.m);
    });
  });
  document.getElementById('exportMonthOverlay').classList.add('active');
  pushOverlay('exportMonthOverlay');
});
document.getElementById('cancelExportMonthBtn').addEventListener('click', ()=> requestCloseOverlay('exportMonthOverlay'));
document.getElementById('exportMonthOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'exportMonthOverlay') requestCloseOverlay('exportMonthOverlay');
});

restoreUiState();
loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch((e) => {
      console.error('Falha ao registrar service worker', e);
    });
  });
}
